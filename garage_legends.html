<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>GARAGE LEGENDS — Премиум и гоночные иконы</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Inter', 'Montserrat', sans-serif; }
    body {
      --bg-primary: #0a0e17;
      --bg-secondary: #131826;
      --bg-card: rgba(20, 28, 45, 0.85);
      --glass-border: rgba(212, 175, 55, 0.25);
      --accent-gold: #d4af37;
      --accent-red: #ff2a2a;
      --accent-neon: #ff6b00;
      --text-primary: #ffffff;
      --text-secondary: #a0b0c8;
      --shadow-heavy: 0 25px 45px rgba(0,0,0,0.7);
      --transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }
    body.light-theme {
      --bg-primary: #f5f7fc;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255,255,255,0.9);
      --glass-border: rgba(180, 130, 30, 0.25);
      --accent-gold: #b8860b;
      --accent-red: #c0392b;
      --accent-neon: #e65c00;
      --text-primary: #1a1a2e;
      --text-secondary: #2c3e50;
      --shadow-heavy: 0 15px 30px rgba(0,0,0,0.1);
    }
    .side-menu {
      position: fixed; top: 0; left: -340px; width: 320px; max-width: 85vw; height: 100vh;
      background: var(--bg-secondary); backdrop-filter: blur(25px); z-index: 1000;
      transition: left 0.4s; overflow-y: auto; padding: 24px 18px;
      border-right: 1px solid var(--glass-border);
    }
    .side-menu.open { left: 0; }
    .menu-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 999;
      opacity: 0; visibility: hidden; transition: 0.3s;
    }
    .menu-overlay.show { opacity: 1; visibility: visible; }
    .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .menu-header h3 { color: var(--accent-gold); }
    .close-menu { font-size: 30px; cursor: pointer; }
    .menu-section { margin-bottom: 28px; }
    .menu-section h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-gold); margin-bottom: 14px; }
    .menu-item {
      padding: 12px; margin: 6px 0; border-radius: 14px; cursor: pointer;
      display: flex; align-items: center; gap: 14px; transition: var(--transition);
      color: var(--text-primary);
    }
    .menu-item i { width: 26px; color: var(--accent-gold); }
    .menu-item:hover { background: rgba(212,175,55,0.12); transform: translateX(5px); }
    .search-box {
      background: rgba(0,0,0,0.2); border-radius: 40px; padding: 10px 18px;
      display: flex; align-items: center; border: 1px solid var(--glass-border);
    }
    .search-box input { background: transparent; border: none; color: var(--text-primary); width: 100%; outline: none; }
    .app-wrapper { max-width: 1400px; margin: 0 auto; padding: 20px 28px 40px; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 15px; }
    .logo-area { display: flex; align-items: center; gap: 15px; }
    .burger-btn {
      font-size: 28px; cursor: pointer; background: var(--bg-card); width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center; border-radius: 18px;
      border: 1px solid var(--glass-border); transition: var(--transition);
    }
    .burger-btn:hover { background: var(--accent-gold); color: #0a0e17; }
    .logo h1 { font-size: 30px; font-weight: 800; background: linear-gradient(135deg, var(--accent-gold), #ffe7a0); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .logo p { font-size: 13px; color: var(--text-secondary); }
    .header-actions { display: flex; gap: 12px; }
    .icon-btn {
      background: var(--bg-card); border: 1px solid var(--glass-border); width: 52px; height: 52px;
      border-radius: 18px; display: flex; align-items: center; justify-content: center;
      font-size: 22px; cursor: pointer; transition: var(--transition);
    }
    .icon-btn:hover { background: var(--accent-gold); color: #0a0e17; }
    .tabs-container { display: flex; gap: 8px; margin: 20px 0 30px; border-bottom: 1px solid var(--glass-border); }
    .tab { padding: 14px 32px; font-size: 18px; font-weight: 600; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; border-radius: 40px 40px 0 0; transition: var(--transition); }
    .tab.active { color: var(--accent-gold); background: var(--bg-card); }
    .selector-panel { display: flex; gap: 20px; margin-bottom: 35px; flex-wrap: wrap; }
    .custom-select {
      padding: 16px 24px; background: var(--bg-card); border: 1.5px solid var(--glass-border);
      border-radius: 50px; color: var(--text-primary); font-size: 16px; cursor: pointer;
      min-width: 240px;
    }
    .car-showcase {
      background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
      border-radius: 50px; padding: 35px; margin-bottom: 40px;
    }
    .slider-container { position: relative; margin-bottom: 25px; border-radius: 30px; overflow: hidden; }
    .slider-image { width: 100%; height: 400px; object-fit: cover; border-radius: 30px; background: #1e2638; }
    .slider-nav { display: flex; justify-content: center; gap: 25px; margin-top: 20px; }
    .slider-btn {
      background: var(--bg-secondary); border: 1.5px solid var(--accent-gold); color: var(--accent-gold);
      width: 55px; height: 55px; border-radius: 40px; font-size: 26px; cursor: pointer;
    }
    .dots { display: flex; gap: 12px; justify-content: center; margin: 18px 0; }
    .dot { width: 12px; height: 12px; border-radius: 20px; background: #3a4a6a; cursor: pointer; }
    .dot.active { background: var(--accent-gold); width: 35px; }
    .car-title { font-size: 42px; font-weight: 800; margin-bottom: 12px; }
    .car-short { font-size: 20px; color: var(--accent-gold); margin-bottom: 20px; font-style: italic; }
    .car-description { font-size: 16px; line-height: 1.7; color: var(--text-secondary); margin-bottom: 30px; }
    .specs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 20px; margin: 30px 0; }
    .spec-card { background: rgba(0,0,0,0.25); padding: 18px; border-radius: 24px; border: 1px solid var(--glass-border); }
    .spec-label { color: var(--accent-gold); font-size: 13px; text-transform: uppercase; margin-bottom: 8px; }
    .spec-value { font-size: 24px; font-weight: 700; }
    .price-tag { font-size: 38px; font-weight: 800; color: var(--accent-gold); display: inline-block; margin-right: 25px; }
    .action-buttons { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
    .engine-start-btn, .fav-btn {
      background: var(--accent-red); border: none; color: white; padding: 16px 32px;
      border-radius: 60px; font-size: 16px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 12px;
    }
    .fav-btn { background: transparent; border: 2px solid var(--accent-gold); color: var(--accent-gold); }
    .jdm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; margin-top: 20px; }
    .jdm-card {
      background: linear-gradient(145deg, rgba(25,20,35,0.9), rgba(15,10,25,0.95));
      backdrop-filter: blur(12px); border-radius: 35px; padding: 24px;
      border: 1px solid rgba(255,80,0,0.3); transition: var(--transition);
    }
    .jdm-card:hover { transform: translateY(-8px); border-color: var(--accent-neon); }
    .jdm-card img { width: 100%; height: 190px; object-fit: cover; border-radius: 25px; margin-bottom: 18px; background: #2a2a3a; }
    .jdm-title { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .jdm-sub { color: var(--accent-neon); margin: 10px 0; display: flex; gap: 15px; flex-wrap: wrap; }
    .detail-btn {
      background: transparent; border: 2px solid var(--accent-neon); color: var(--accent-neon);
      padding: 14px 24px; border-radius: 50px; margin-top: 20px; cursor: pointer;
      width: 100%; font-weight: 700; transition: var(--transition);
    }
    .detail-btn:hover { background: var(--accent-neon); color: #0a0e17; }
    .card-fav {
      position: absolute; top: 35px; right: 35px; background: rgba(0,0,0,0.6);
      border-radius: 50px; padding: 10px 14px; cursor: pointer; z-index: 5;
    }
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
      display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px;
    }
    .modal-content {
      background: var(--bg-secondary); max-width: 850px; width: 100%;
      max-height: 90vh; overflow-y: auto; border-radius: 45px; padding: 35px;
      border: 1px solid var(--glass-border);
    }
    .close-modal { float: right; font-size: 36px; cursor: pointer; }
    .pagination { display: flex; gap: 12px; justify-content: center; margin-top: 45px; }
    .page-btn {
      padding: 12px 22px; background: var(--bg-card); border: 1px solid var(--glass-border);
      border-radius: 40px; cursor: pointer; font-weight: 600;
    }
    .page-btn.active { background: var(--accent-neon); color: #0a0e17; }
    .hidden-section { display: none; }
    .filter-bar { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
    @media (max-width: 700px) {
      .app-wrapper { padding: 12px; }
      .car-title { font-size: 28px; }
      .slider-image { height: 240px; }
    }
  </style>
</head>
<body>

<div class="menu-overlay" id="menuOverlay"></div>
<div class="side-menu" id="sideMenu">
  <div class="menu-header"><h3><i class="fas fa-garage"></i> GARAGE MENU</h3><i class="fas fa-times close-menu" id="closeMenuBtn"></i></div>
  <div class="menu-section"><h4>ПРОФИЛЬ</h4>
    <div class="menu-item"><i class="fas fa-user-circle"></i> Гость</div>
    <div class="menu-item" id="favoritesMenuBtn"><i class="fas fa-heart"></i> Избранное (<span id="favCount">0</span>)</div>
    <div class="menu-item" id="historyMenuBtn"><i class="fas fa-history"></i> История</div>
  </div>
  <div class="menu-section"><h4>КАТАЛОГ</h4>
    <div class="menu-item" data-tab="premium"><i class="fas fa-gem"></i> Премиум (16)</div>
    <div class="menu-item" data-tab="legends"><i class="fas fa-flag-checkered"></i> Легенды (24)</div>
    <div class="menu-item" id="popularMenuItem"><i class="fas fa-fire"></i> Популярные</div>
  </div>
  <div class="menu-section"><h4>НАСТРОЙКИ</h4>
    <div class="menu-item"><i class="fas fa-moon"></i> Тема <button id="themeSwitchBtn" style="margin-left:auto; padding:6px 14px; border-radius:30px; background:var(--bg-card);">🌙</button></div>
    <div class="menu-item"><i class="fas fa-volume-up"></i> Звук <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5" style="width:80px; margin-left:auto;"></div>
  </div>
  <div class="menu-section"><h4>ПОИСК</h4>
    <div class="search-box"><i class="fas fa-search"></i><input type="text" id="globalSearchInput" placeholder="Модель, марка..."></div>
  </div>
  <div class="menu-section"><h4>СРАВНЕНИЕ И ТОПЫ</h4>
    <div class="menu-item" id="compareMenuBtn"><i class="fas fa-balance-scale"></i> Сравнить</div>
    <div class="menu-item" id="topAccelerationBtn"><i class="fas fa-tachometer-alt"></i> Топ по разгону</div>
    <div class="menu-item" id="topPowerPriceBtn"><i class="fas fa-chart-line"></i> Цена/мощность</div>
  </div>
</div>

<div class="app-wrapper">
  <div class="top-bar">
    <div class="logo-area"><div class="burger-btn" id="burgerBtn"><i class="fas fa-bars"></i></div><div class="logo"><h1><i class="fas fa-garage"></i> GARAGE LEGENDS</h1><p>Премиум · JDM · Гоночные иконы</p></div></div>
    <div class="header-actions">
      <div class="icon-btn" id="headerFavBtn"><i class="fas fa-heart"></i></div>
      <div class="icon-btn" id="headerSettingsBtn"><i class="fas fa-cog"></i></div>
    </div>
  </div>

  <div class="tabs-container">
    <button class="tab active" data-tab="premium"><i class="fas fa-gem"></i> ПРЕМИУМ</button>
    <button class="tab" data-tab="legends"><i class="fas fa-trophy"></i> ЛЕГЕНДЫ 90-Х</button>
  </div>

  <div id="premiumSection">
    <div class="selector-panel">
      <select id="brandSelect" class="custom-select"></select>
      <select id="seriesSelect" class="custom-select"></select>

    <div id="premiumCarDisplay" class="car-showcase"></div>

  <div id="legendsSection" class="hidden-section">

      <select id="countryFilter" class="custom-select"><option value="all">Все страны</option><option value="🇯🇵">Япония 🇯🇵</option><option value="🇩🇪">Германия 🇩🇪</option><option value="🇮🇹">Италия 🇮🇹</option><option value="🇬🇧">Великобритания 🇬🇧</option></select>
      <select id="engineFilter" class="custom-select"><option value="all">Все двигатели</option><option value="турбо">Турбо</option><option value="атмо">Атмосферный</option><option value="ротор">Роторный</option></select>
    </div>
    <div id="jdmGridContainer" class="jdm-grid"></div>
    <div id="paginationContainer" class="pagination"></div>
  </div>
</div>

<div class="modal" id="detailModal"><div class="modal-content"><i class="fas fa-times close-modal" id="closeModalBtn"></i><div id="modalBody"></div></div></div>
<div class="modal" id="favoritesModal"><div class="modal-content"><i class="fas fa-times close-modal" id="closeFavModal"></i><h3>❤️ Избранное</h3><div id="favListBody"></div></div></div>
<audio id="engineAudio" preload="none"></audio>

<script>
(function(){
  // ========== ПРЕМИУМ АВТОМОБИЛИ (16 шт) ==========
  const premiumCars = [
    { brand:"Porsche", series:"911 Turbo S (992)", price:245000, power:650, torque:800, engine:"3.8L Twin-Turbo Flat-6", transmission:"8-ступ. PDK", drivetrain:"AWD", acceleration:2.7, topSpeed:330, weight:1640, shortQuote:"Ракета на кожаных сиденьях. Разрывает пространство быстрее, чем мозг успевает испугаться.", description:"Porsche 911 Turbo S — это тот случай, когда немецкие инженеры создали машину, которая одновременно комфортнее бизнес-седана и быстрее большинства суперкаров. В основе — 3,8-литровый оппозитный битурбо, спрятанный за задней осью. На старте с Launch Control позвонки водителя испытывают перегрузку в 1,1 G. Но самое пугающее — как эта машина проходит повороты. Полный привод с векторизацией тяги и подруливающая задняя ось заставляют физику работать на тебя. В салоне пахнет дорогой кожей и алькантарой, а единственный громкий звук — это свист турбин и гул 6-цилиндрового оппозитника за спиной. Porsche 911 Turbo S — идеальный ежедневный суперкар для тех, кто не хочет кричать о своём статусе, но всегда готов уехать с любого светофора первым.", images:["https://images.unsplash.com/photo-1503376780354-9c3d6f7d5f8d?w=800","https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?w=800"] },
    { brand:"Porsche", series:"718 Cayman GT4 RS", price:160000, power:500, torque:450, engine:"4.0L Flat-6 (атмосферный)", transmission:"7-ступ. PDK", drivetrain:"RWD", acceleration:3.2, topSpeed:315, weight:1415, shortQuote:"Атмосферный шестицилиндровый монстр за спиной. 9000 об/мин, 500 л.с. и никаких компромиссов.", description:"Cayman GT4 RS — это лучший Cayman в истории. 4.0-литровый атмосферный Flat-6 от 911 GT3 (но без турбин) выдаёт 500 л.с. при 9000 об/мин. Это самая высокая удельная мощность среди среднемоторных Porsche. Разгон до сотни — 3.2 секунды. Максималка — 315 км/ч. Шасси — карбон, керамические тормоза, адаптивные амортизаторы, колёсные гайки центральной затяжки. Аэродинамика: огромное антикрыло, диффузор, воздухозаборники за дверьми. Салон — чистая функциональность: ковши, каркас безопасности, алькантара. GT4 RS — это машина для трек-дней. Она создана, чтобы бить рекорды.", images:["https://images.unsplash.com/photo-1614200187524-dc4b892acf16?w=800"] },
    { brand:"BMW", series:"M3 Competition xDrive (G80)", price:85000, power:510, torque:650, engine:"3.0L Twin-Turbo I6 (S58)", transmission:"8-ступ. M Steptronic", drivetrain:"AWD", acceleration:3.5, topSpeed:290, weight:1780, shortQuote:"Четырёхдверный монстр, который кусает асфальт и обижает суперкары.", description:"BMW M3 G80 с полным приводом M xDrive — это снаряд для любых дорог. Рядная шестёрка S58 выдувает 510 лошадиных сил и 650 Нм крутящего момента, разрывая шины с минимальной задержкой. Система векторизации крутящего момента и адаптивная подвеска делают её точной на треке и комфортной в городе. Карбоновая крыша, расширенные арки и огромная радиаторная решётка подчёркивают агрессивный силуэт. При включении Launch Control кажется, что тебя выстрелили из катапульты. При этом M3 остаётся практичным седаном: четырёхдверка, багажник 480 литров.", images:["https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=800"] },
    { brand:"BMW", series:"M5 CS (F90)", price:142000, power:635, torque:750, engine:"4.4L Twin-Turbo V8", transmission:"8-ступ. M Steptronic", drivetrain:"AWD", acceleration:3.0, topSpeed:305, weight:1825, shortQuote:"Карбоновый зверь, который носит костюм и разрывает автобаны.", description:"M5 CS — вершина седанов BMW M. 635 л.с., карбоновые ковши, сниженный вес и уникальная настройка шасси. Этот автомобиль проезжает Нюрбургринг быстрее многих суперкаров (7:29.57), но при этом в салоне могут разместиться четверо. Рёв V8 с системой выпуска M Sport заставляет прохожих оборачиваться даже на парковке. Двигатель S63 с двумя турбинами выдувает 750 Нм момента, а полный привод M xDrive может стать чистым задним нажатием одной кнопки. Внутри — золотая отделка, карбон и алькантара.", images:["https://images.unsplash.com/photo-1621135802920-133df287f89c?w=800"] },

      <div class="action-buttons">
        <span class="price-tag">$${car.price.toLocaleString()}</span>
        <button class="engine-start-btn" id="engineStartBtn"><i class="fas fa-play"></i> ЗАВЕСТИ</button>
        <button class="fav-btn" id="premiumFavBtn"><i class="fas fa-heart"></i> ${favorites.includes(car.brand+car.series) ? 'В ИЗБРАННОМ' : 'В ИЗБРАННОЕ'}</button>
      </div>
    `;
    document.getElementById('prevSlide')?.addEventListener('click', () => { currentImageIndex--; renderPremiumCar(); });
    document.getElementById('nextSlide')?.addEventListener('click', () => { currentImageIndex++; renderPremiumCar(); });
    document.getElementById('engineStartBtn')?.addEventListener('click', playSound);
    document.getElementById('premiumFavBtn')?.addEventListener('click', () => {
      const id = car.brand+car.series;
      if(favorites.includes(id)) favorites = favorites.filter(f => f !== id);
      else favorites.push(id);
      saveFav(); renderPremiumCar();
    });
  }

  // ========== РЕНДЕР ЛЕГЕНД С ПАГИНАЦИЕЙ, ФИЛЬТРАМИ И ПОИСКОМ ==========
  function filterLegends() {
    let filtered = [...legendsData];
    if(currentCountryFilter !== 'all') filtered = filtered.filter(c => c.country === currentCountryFilter);
    if(currentEngineFilter !== 'all') filtered = filtered.filter(c => c.engineType === currentEngineFilter);
    if(currentSearchQuery) {
      const q = currentSearchQuery.toLowerCase();
      filtered = filtered.filter(c => c.name.toLowerCase().includes(q) || c.engine.toLowerCase().includes(q));
    }
    return filtered;
  }

  function renderLegendsGrid() {
    const filtered = filterLegends();
    const totalPages = Math.ceil(filtered.length / pageSize);
    const start = (jdmCurrentPage-1) * pageSize;
    const pageCars = filtered.slice(start, start+pageSize);
    const container = document.getElementById('jdmGridContainer');
    container.innerHTML = pageCars.map(car => `
      <div class="jdm-card" style="position:relative">
        <div class="card-fav" data-id="${car.name}"><i class="fas ${favorites.includes(car.name) ? 'fa-heart' : 'fa-heart'}"></i></div>
        <img src="https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=400" alt="${car.name}">
        <div class="jdm-title">${car.name}</div>
        <div class="jdm-sub">${car.country} ${car.code} · ${car.power} л.с.</div>
        <div class="jdm-engine">${car.engine}</div>
        <button class="detail-btn" data-car='${JSON.stringify(car)}'>ПОДРОБНЕЕ</button>
      </div>
    `).join('');
    document.querySelectorAll('.card-fav').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        if(favorites.includes(id)) favorites = favorites.filter(f => f !== id);
        else favorites.push(id);
        saveFav(); renderLegendsGrid();
      });
    });
    document.querySelectorAll('.detail-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const car = JSON.parse(btn.dataset.car);
        showModal(car);
      });
    });
    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    const container = document.getElementById('paginationContainer');
    if(totalPages <= 1) { container.innerHTML = ''; return; }
    let html = '';
    for(let i=1; i<=totalPages; i++) {
      html += `<button class="page-btn ${i===jdmCurrentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
    }
    container.innerHTML = html;
    document.querySelectorAll('.page-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        jdmCurrentPage = parseInt(btn.dataset.page);
        renderLegendsGrid();
      });
    });
  }

  function showModal(car) {
    const modal = document.getElementById('detailModal');
    const modalBody = document.getElementById('modalBody');
    modalBody.innerHTML = `
      <h2>${car.name}</h2>
      <p><strong>Двигатель:</strong> ${car.engine}</p>
      <p><strong>Мощность:</strong> ${car.power} л.с. / ${car.torque} Нм</p>
      <p><strong>Привод:</strong> ${car.drivetrain}</p>
      <p><strong>Разгон 0-100:</strong> ${car.acceleration} сек</p>
      <p><strong>Масса:</strong> ${car.weight} кг</p>
      <p><strong>Цена:</strong> $${car.price.toLocaleString()}</p>
      <p><strong>Описание:</strong> ${car.description || car.shortQuote}</p>
      <button class="engine-start-btn" id="modalSoundBtn" style="margin-top:20px">🔊 Завести мотор</button>
    `;
    modal.style.display = 'flex';
    document.getElementById('modalSoundBtn')?.addEventListener('click', playSound);
  }

  // ========== ТОПЫ И СРАВНЕНИЕ ==========
  function showTopAcceleration() {
    const sorted = [...premiumCars, ...legendsData].sort((a,b) => a.acceleration - b.acceleration).slice(0,5);
    const modal = document.getElementById('detailModal');
    document.getElementById('modalBody').innerHTML = `<h2>🏆 Топ-5 по разгону</h2>${sorted.map((c,i)=>`<p>${i+1}. ${c.name||c.brand+' '+c.series} — ${c.acceleration} сек до 100 км/ч</p>`).join('')}<button class="engine-start-btn" onclick="document.getElementById('detailModal').style.display='none'">Закрыть</button>`;
    modal.style.display = 'flex';
  }

  function showTopValue() {
    const sorted = [...premiumCars, ...legendsData].map(c => ({ ...c, value: c.price / c.power })).sort((a,b) => a.value - b.value).slice(0,5);
    const modal = document.getElementById('detailModal');
    document.getElementById('modalBody').innerHTML = `<h2>💰 Топ-5 по цене/лошадь</h2>${sorted.map((c,i)=>`<p>${i+1}. ${c.name||c.brand+' '+c.series} — $${c.value.toFixed(0)} за л.с.</p>`).join('')}<button class="engine-start-btn" onclick="document.getElementById('detailModal').style.display='none'">Закрыть</button>`;
    modal.style.display = 'flex';
  }

  function showCompare() {
    const modal = document.getElementById('detailModal');
    if(compareList.length === 0) {
      modal.style.display = 'flex';
      document.getElementById('modalBody').innerHTML = `<p>Выберите автомобили для сравнения, нажав на кнопку "Сравнить" на карточках JDM или в премиум-разделе.</p><button onclick="document.getElementById('detailModal').style.display='none'">Закрыть</button>`;
      return;
    }
    let html = '<h2>⚖️ Сравнение выбранных автомобилей</h2><table style="width:100%; border-collapse:collapse"><tr><th>Характеристика</th>';
    compareList.forEach(c => html += `<th>${c.name||c.brand+' '+c.series}</th>`);
    html += '</tr><tr><td>Мощность</td>';
    compareList.forEach(c => html += `<td>${c.power} л.с.</td>`);
    html += '</tr><tr><td>Разгон 0-100</td>';
    compareList.forEach(c => html += `<td>${c.acceleration} сек</td>`);
    html += '</tr><tr><td>Цена</td>';
    compareList.forEach(c => html += `<td>$${c.price.toLocaleString()}</td>`);
    html += '</tr></table><button class="engine-start-btn" onclick="document.getElementById(\'detailModal\').style.display=\'none\'">Закрыть</button>';
    document.getElementById('modalBody').innerHTML = html;
    modal.style.display = 'flex';
  }

  function addToCompare(car) {
    if(compareList.some(c => (c.name||c.brand+c.series) === (car.name||car.brand+car.series))) {
      alert('Автомобиль уже в списке сравнения');
      return;
    }
    if(compareList.length >= 3) {
      alert('Можно сравнить не более 3 автомобилей');
      return;
    }
    compareList.push(car);
    alert('Автомобиль добавлен для сравнения');
  }

  // ========== ИНИЦИАЛИЗАЦИЯ И СОБЫТИЯ ==========
  function applyTheme(theme) {
    if(theme === 'light') document.body.classList.add('light-theme');
    else document.body.classList.remove('light-theme');
  }

  function setupListeners() {
    document.getElementById('brandSelect')?.addEventListener('change', (e) => { selectedBrand = e.target.value; updateSeries(); });
    document.getElementById('seriesSelect')?.addEventListener('change', (e) => { selectedSeries = e.target.value; renderPremiumCar(); });
    document.getElementById('burgerBtn')?.addEventListener('click', () => { document.getElementById('sideMenu').classList.toggle('open'); document.getElementById('menuOverlay').classList.toggle('show'); });
    document.getElementById('closeMenuBtn')?.addEventListener('click', () => { document.getElementById('sideMenu').classList.remove('open'); document.getElementById('menuOverlay').classList.remove('show'); });
    document.getElementById('menuOverlay')?.addEventListener('click', () => { document.getElementById('sideMenu').classList.remove('open'); document.getElementById('menuOverlay').classList.remove('show'); });
    document.getElementById('themeSwitchBtn')?.addEventListener('click', () => { const isLight = document.body.classList.toggle('light-theme'); localStorage.setItem('theme', isLight ? 'light' : 'dark'); });
    document.getElementById('volumeSlider')?.addEventListener('input', (e) => { audioVolume = parseFloat(e.target.value); });
    document.getElementById('countryFilter')?.addEventListener('change', (e) => { currentCountryFilter = e.target.value; jdmCurrentPage = 1; renderLegendsGrid(); });
    document.getElementById('engineFilter')?.addEventListener('change', (e) => { currentEngineFilter = e.target.value; jdmCurrentPage = 1; renderLegendsGrid(); });
    document.getElementById('globalSearchInput')?.addEventListener('input', (e) => { currentSearchQuery = e.target.value; jdmCurrentPage = 1; renderLegendsGrid(); });
    document.getElementById('compareMenuBtn')?.addEventListener('click', showCompare);
    document.getElementById('topAccelerationBtn')?.addEventListener('click', showTopAcceleration);
    document.getElementById('topPowerPriceBtn')?.addEventListener('click', showTopValue);
    document.getElementById('headerFavBtn')?.addEventListener('click', () => {
      const modal = document.getElementById('favoritesModal');
      const list = document.getElementById('favListBody');
      list.innerHTML = favorites.length ? favorites.map(f => `<p>${f}</p>`).join('') : '<p>Нет избранных автомобилей</p>';
      modal.style.display = 'flex';
    });
    document.getElementById('closeFavModal')?.addEventListener('click', () => document.getElementById('favoritesModal').style.display='none');
    document.querySelectorAll('.close-modal').forEach(btn => btn.addEventListener('click', function(){ this.closest('.modal').style.display='none'; }));
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        currentTab = tab.dataset.tab;
        document.getElementById('premiumSection').classList.toggle('hidden-section', currentTab !== 'premium');
        document.getElementById('legendsSection').classList.toggle('hidden-section', currentTab !== 'legends');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });
  }

  renderBrands();
  renderLegendsGrid();
  setupListeners();
  applyTheme(localStorage.getItem('theme')||'dark');
  updateFavCount();
})();
</script>
</body>
</html>
