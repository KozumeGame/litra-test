<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>📖 Her Cookbook — кулинарный дневник</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== ПЕРЕМЕННЫЕ (динамически меняются через настройки) ===== */
        :root {
            --bg-page: #fef7e8;
            --bg-card: #ffffff;
            --text-primary: #3d2a1f;
            --text-secondary: #7a6856;
            --accent: #d47a5a;
            --accent-hover: #b85e3e;
            --border: #f0e4d0;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --radius-card: 20px;
            --radius-btn: 40px;
            --font-size: 16px;
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-page);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: var(--font-size);
            transition: background 0.2s, color 0.2s;
            padding-bottom: 60px;
        }

        /* ===== КОНТЕЙНЕР ===== */
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        /* ===== ХЕДЕР ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent), var(--text-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .settings-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-btn);
            padding: 8px 18px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        /* ===== ПАНЕЛЬ ДЕЙСТВИЙ ===== */
        .action-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .btn-primary {
            background: var(--accent);
            border: none;
            border-radius: var(--radius-btn);
            padding: 10px 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .btn-secondary {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-btn);
            padding: 10px 20px;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        /* ===== ПОИСК И ФИЛЬТРЫ ===== */
        .search-box {
            width: 100%;
            padding: 12px 18px;
            border-radius: var(--radius-btn);
            border: 1px solid var(--border);
            background: var(--bg-card);
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
        .filter-chips {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* ===== ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМОВ ===== */
        .view-toggle {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 16px;
        }
        .view-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .view-btn.active {
            background: var(--accent);
            color: white;
        }

        /* ===== СПИСОК РЕЦЕПТОВ (сетка) ===== */
        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        /* режим списка */
        .recipes-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .recipe-card-list {
            display: flex;
            gap: 16px;
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 12px;
            border: 1px solid var(--border);
            align-items: center;
        }
        .recipe-card-list .recipe-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 16px;
        }
        .recipe-card-list .recipe-info {
            flex: 1;
        }

        /* общая карточка */
        .recipe-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.1s;
            cursor: pointer;
        }
        .recipe-img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            background: #f0e4d0;
        }
        .recipe-info {
            padding: 12px;
        }
        .recipe-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .recipe-meta {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .difficulty {
            display: flex;
            gap: 2px;
        }
        .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .tag {
            background: var(--bg-page);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        .edit-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* ===== МОДАЛКА (форма + детали) ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal.open {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: var(--bg-card);
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 28px;
            padding: 24px;
            position: relative;
        }
        .close-modal {
            position: sticky;
            top: 0;
            text-align: right;
            font-size: 28px;
            cursor: pointer;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--bg-page);
        }
        .category-check {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 12px 0;
        }
        .category-check label {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .photo-upload {
            margin: 12px 0;
        }
        .photo-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .preview-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
        }
        .inline-list {
            margin: 10px 0;
        }
        .inline-item {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
        @media (max-width: 550px) {
            .container { padding: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📖 Her Cookbook</h1>
        <button class="settings-btn" id="openSettingsBtn">⚙️ настройки</button>
    </div>

    <div class="action-bar">
        <button class="btn-primary" id="newRecipeBtn">➕ новый рецепт</button>
        <button class="btn-secondary" id="randomBtn">🎲 мне повезёт</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 поиск по названию, ингредиентам, тегам...">

    <div class="filter-chips" id="categoryFilters"></div>

    <div class="view-toggle">
        <button class="view-btn" data-view="grid">📱 сетка</button>
        <button class="view-btn" data-view="list">📋 список</button>
    </div>

    <div id="recipesContainer" class="recipes-grid"></div>
    <footer>✨ все рецепты сохраняются в твоём браузере</footer>
</div>

<!-- Модалка настроек -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <div class="close-modal">&times;</div>
        <h3>⚙️ настройки книги</h3>
        <label>🎨 основной цвет:</label>
        <select id="accentColorSelect">
            <option value="#d47a5a">Терракотовый</option><option value="#e87b9c">Розовый</option><option value="#b38b6d">Коричневый</option>
            <option value="#9b9b7a">Оливковый</option><option value="#7b9e87">Мятный</option><option value="#b8a0d0">Лавандовый</option>
            <option value="#f4b942">Золотой</option><option value="#5f9ea0">Бирюзовый</option>
        </select>
        <label>📄 фон страницы:</label>
        <select id="bgSelect"><option value="#fef7e8">Кремовый</option><option value="#f5efe3">Бежевый</option><option value="#1e1e2a">Тёмный</option></select>
        <label>🔣 иконка сложности:</label>
        <select id="difficultyIconSelect"><option value="stars">⭐ Звёзды</option><option value="cats">🐱 Котики</option><option value="fire">🔥 Огоньки</option><option value="pans">🍳 Сковородки</option></select>
        <label>🔤 размер шрифта:</label>
        <select id="fontSizeSelect"><option value="14px">Маленький</option><option value="16px" selected>Средний</option><option value="18px">Большой</option><option value="20px">Очень большой</option></select>
        <button id="saveSettingsBtn" class="btn-primary" style="margin-top:20px;">💾 сохранить настройки</button>
    </div>
</div>

<!-- Модалка рецепта (форма + просмотр) -->
<div id="recipeModal" class="modal"><div class="modal-content"><div class="close-modal">&times;</div><div id="recipeModalBody"></div></div></div>

<script>
    // ---------- ДАННЫЕ ПО УМОЛЧАНИЮ ----------
    let recipes = JSON.parse(localStorage.getItem('hercookbook_recipes')) || [];
    if(recipes.length===0){
        recipes.push({ id: Date.now(), title: "Идеальная яичница", categories: ["Завтрак"], difficulty: 2, time: 5, tags: ["#быстро","#завтрак"], ingredients: ["2 яйца","сливочное масло","соль"], steps: ["Разогреть сковороду","Растопить масло","Вбить яйца","Жарить 2 минуты"], comment: "Люблю с помидорами!", mainPhoto: "", extraPhotos: [], createdAt: Date.now() });
        recipes.push({ id: Date.now()+1, title: "Паста карбонара", categories: ["Обед","Ужин"], difficulty: 3, time: 25, tags: ["#паста","#ужин"], ingredients: ["спагетти","бекон","сливки","пармезан","яйцо"], steps: ["Отварить пасту","Обжарить бекон","Смешать сливки с желтком","Соединить"], comment: "Маша любит с беконом", mainPhoto: "", extraPhotos: [], createdAt: Date.now() });
    }

    let currentView = localStorage.getItem('hercookbook_view') || 'grid';
    let currentCategoryFilter = 'все';
    let currentSearch = '';

    // ---------- СОХРАНЕНИЕ ----------
    function saveRecipes(){ localStorage.setItem('hercookbook_recipes', JSON.stringify(recipes)); }

    // ---------- ОТРИСОВКА ИНТЕРФЕЙСА ----------
    function renderDifficulty(level){
        const iconType = localStorage.getItem('hercookbook_difficultyIcon') || 'stars';
        const maps = { stars: '⭐', cats: '🐱', fire: '🔥', pans: '🍳' };
        const icon = maps[iconType] || '⭐';
        let out = '';
        for(let i=1;i<=5;i++) out += (i<=level) ? icon : (iconType==='stars'?'☆':'▢');
        return out;
    }

    function renderRecipes(){
        const container = document.getElementById('recipesContainer');
        let filtered = recipes.filter(r => {
            let matchCat = (currentCategoryFilter==='все' || r.categories.includes(currentCategoryFilter));
            let searchLow = currentSearch.toLowerCase();
            let matchSearch = r.title.toLowerCase().includes(searchLow) || r.tags.some(t=>t.toLowerCase().includes(searchLow)) || r.ingredients.some(i=>i.toLowerCase().includes(searchLow));
            return matchCat && matchSearch;
        });
        if(currentView === 'grid'){
            container.className = 'recipes-grid';
            container.innerHTML = filtered.map(r => `
                <div class="recipe-card" data-id="${r.id}">
                    <img class="recipe-img" src="${r.mainPhoto || 'https://via.placeholder.com/300?text=📷'}" onerror="this.src='https://via.placeholder.com/300?text=🍽️'">
                    <div class="recipe-info">
                        <div class="recipe-title">${escapeHtml(r.title)}<button class="edit-btn" data-id="${r.id}">✏️</button></div>
                        <div class="recipe-meta"><span>⏱️ ${r.time} мин</span><span class="difficulty">${renderDifficulty(r.difficulty)}</span></div>
                        <div class="tags">${r.tags.slice(0,3).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
                    </div>
                </div>
            `).join('');
        } else {
            container.className = 'recipes-list';
            container.innerHTML = filtered.map(r => `
                <div class="recipe-card-list" data-id="${r.id}">
                    <img class="recipe-img" src="${r.mainPhoto || 'https://via.placeholder.com/80?text=📷'}" style="width:70px;height:70px;" onerror="this.src='https://via.placeholder.com/80?text=🍽️'">
                    <div class="recipe-info">
                        <div class="recipe-title">${escapeHtml(r.title)}<button class="edit-btn" data-id="${r.id}">✏️</button></div>
                        <div class="recipe-meta">⏱️ ${r.time} мин | ${renderDifficulty(r.difficulty)}</div>
                        <div class="tags">${r.tags.slice(0,2).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
                    </div>
                </div>
            `).join('');
        }
        document.querySelectorAll('.recipe-card, .recipe-card-list').forEach(el => {
            el.addEventListener('click', (e) => { if(!e.target.classList.contains('edit-btn')){ const id = parseInt(el.dataset.id); openRecipeDetail(id); } });
        });
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); const id = parseInt(btn.dataset.id); openRecipeForm(id); });
        });
    }

    function openRecipeDetail(id){
        const r = recipes.find(r=>r.id===id);
        if(!r) return;
        const modal = document.getElementById('recipeModal');
        document.getElementById('recipeModalBody').innerHTML = `
            <h2>${escapeHtml(r.title)}</h2>
            ${r.mainPhoto ? `<img src="${r.mainPhoto}" style="width:100%; border-radius:24px; margin:12px 0;">` : ''}
            <p><strong>⏱️ ${r.time} мин</strong> | сложность: ${renderDifficulty(r.difficulty)}</p>
            <p><strong>📂 Категории:</strong> ${r.categories.join(', ')}</p>
            <p><strong>🏷️ Теги:</strong> ${r.tags.join(' ')}</p>
            <p><strong>🧾 Ингредиенты:</strong></p><ul>${r.ingredients.map(i=>`<li>${escapeHtml(i)}</li>`).join('')}</ul>
            <p><strong>📝 Приготовление:</strong></p><ol>${r.steps.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ol>
            <p><strong>💬 Комментарий:</strong> ${escapeHtml(r.comment||'')}</p>
            <button id="closeDetailBtn" class="btn-primary">закрыть</button>
        `;
        modal.classList.add('open');
        document.getElementById('closeDetailBtn').onclick = () => modal.classList.remove('open');
    }

    function openRecipeForm(id=null){
        const r = id ? recipes.find(r=>r.id===id) : null;
        const modal = document.getElementById('recipeModal');
        const categoriesList = ["Завтрак","Обед","Ужин","Десерт","Напиток","Суп","Салат","Другое"];
        const checkedCats = r ? r.categories : [];
        modal.classList.add('open');
        document.getElementById('recipeModalBody').innerHTML = `
            <h3>${r ? '✏️ редактировать' : '➕ новый рецепт'}</h3>
            <input type="text" id="formTitle" placeholder="Название" value="${r ? escapeHtml(r.title) : ''}">
            <div class="category-check">${categoriesList.map(cat => `<label><input type="checkbox" value="${cat}" ${checkedCats.includes(cat)?'checked':''}> ${cat}</label>`).join('')}</div>
            <label>Сложность (1-5):</label><input type="number" id="formDifficulty" min="1" max="5" value="${r ? r.difficulty : 3}">
            <input type="text" id="formTime" placeholder="Время в минутах" value="${r ? r.time : ''}">
            <input type="text" id="formTags" placeholder="Теги через запятую (#вкусно)" value="${r ? r.tags.join(', ') : ''}">
            <label>📸 Главное фото (URL или выбери файл):</label>
            <input type="file" id="photoUpload" accept="image/*">
            <div id="photoPreview"></div>
            <label>🧾 Ингредиенты (по одному)</label><div id="ingredientsList"></div>
            <button id="addIngredientBtn" class="btn-secondary" type="button">+ добавить ингредиент</button>
            <label>📝 Шаги приготовления</label><div id="stepsList"></div>
            <button id="addStepBtn" class="btn-secondary" type="button">+ добавить шаг</button>
            <textarea id="formComment" placeholder="Личный комментарий">${r ? (r.comment||'') : ''}</textarea>
            <button id="saveRecipeBtn" class="btn-primary" style="margin-top:20px;">💾 сохранить</button>
        `;
        // динамические списки
        let ingredients = r ? [...r.ingredients] : [];
        let steps = r ? [...r.steps] : [];
        function refreshIngredients(){ const div=document.getElementById('ingredientsList'); div.innerHTML=ingredients.map((ing,i)=>`<div class="inline-item"><input value="${escapeHtml(ing)}" data-ingidx="${i}" class="ing-input"><button data-ingidx="${i}" class="removeIng">🗑️</button></div>`).join(''); document.querySelectorAll('.ing-input').forEach(inp=>inp.addEventListener('change',(e)=>{ ingredients[e.target.dataset.ingidx]=e.target.value; })); document.querySelectorAll('.removeIng').forEach(btn=>btn.addEventListener('click',(e)=>{ let idx=parseInt(btn.dataset.ingidx); ingredients.splice(idx,1); refreshIngredients(); })); }
        function refreshSteps(){ const div=document.getElementById('stepsList'); div.innerHTML=steps.map((st,i)=>`<div class="inline-item"><input value="${escapeHtml(st)}" data-stepidx="${i}" class="step-input"><button data-stepidx="${i}" class="removeStep">🗑️</button></div>`).join(''); document.querySelectorAll('.step-input').forEach(inp=>inp.addEventListener('change',(e)=>{ steps[e.target.dataset.stepidx]=e.target.value; })); document.querySelectorAll('.removeStep').forEach(btn=>btn.addEventListener('click',(e)=>{ let idx=parseInt(btn.dataset.stepidx); steps.splice(idx,1); refreshSteps(); })); }
        refreshIngredients(); refreshSteps();
        document.getElementById('addIngredientBtn').onclick = ()=>{ ingredients.push(''); refreshIngredients(); };
        document.getElementById('addStepBtn').onclick = ()=>{ steps.push(''); refreshSteps(); };
        document.getElementById('photoUpload').addEventListener('change', (e)=>{ const file=e.target.files[0]; if(file){ const reader=new FileReader(); reader.onload=ev=>{ document.getElementById('photoPreview').innerHTML=`<img src="${ev.target.result}" style="width:100px;border-radius:12px;">`; window.tempPhoto=ev.target.result; }; reader.readAsDataURL(file); } });
        document.getElementById('saveRecipeBtn').onclick = ()=>{
            const title = document.getElementById('formTitle').value.trim();
            if(!title) return alert('введите название');
            const categories = Array.from(document.querySelectorAll('.category-check input:checked')).map(cb=>cb.value);
            const difficulty = parseInt(document.getElementById('formDifficulty').value);
            const time = parseInt(document.getElementById('formTime').value);
            const tags = document.getElementById('formTags').value.split(',').map(t=>t.trim()).filter(t=>t);
            const mainPhoto = window.tempPhoto || (r ? r.mainPhoto : '');
            const comment = document.getElementById('formComment').value;
            if(!r){
                const newId = Date.now();
                recipes.push({ id:newId, title, categories, difficulty, time, tags, ingredients: [...ingredients], steps:[...steps], comment, mainPhoto, extraPhotos:[], createdAt:Date.now() });
            } else {
                r.title = title; r.categories = categories; r.difficulty = difficulty; r.time = time; r.tags = tags;
                r.ingredients = [...ingredients]; r.steps = [...steps]; r.comment = comment;
                if(window.tempPhoto) r.mainPhoto = window.tempPhoto;
            }
            saveRecipes(); renderRecipes(); modal.classList.remove('open');
        };
    }

    function randomRecipe(){
        if(recipes.length) openRecipeDetail(recipes[Math.floor(Math.random()*recipes.length)].id);
        else alert('нет рецептов');
    }

    function buildFilters(){
        const allCats = ['все', ...new Set(recipes.flatMap(r=>r.categories))];
        const container = document.getElementById('categoryFilters');
        container.innerHTML = allCats.map(cat => `<div class="chip ${currentCategoryFilter===cat?'active':''}" data-cat="${cat}">${cat}</div>`).join('');
        document.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{ currentCategoryFilter=ch.dataset.cat; renderRecipes(); buildFilters(); }));
    }

    // настройки темы
    function applySettings(){
        const accent = localStorage.getItem('hercookbook_accent') || '#d47a5a';
        const bg = localStorage.getItem('hercookbook_bg') || '#fef7e8';
        const fontSize = localStorage.getItem('hercookbook_fontSize') || '16px';
        document.documentElement.style.setProperty('--accent', accent);
        document.documentElement.style.setProperty('--bg-page', bg);
        document.documentElement.style.setProperty('--font-size', fontSize);
        renderRecipes();
    }
    document.getElementById('saveSettingsBtn')?.addEventListener('click',()=>{
        localStorage.setItem('hercookbook_accent', document.getElementById('accentColorSelect').value);
        localStorage.setItem('hercookbook_bg', document.getElementById('bgSelect').value);
        localStorage.setItem('hercookbook_difficultyIcon', document.getElementById('difficultyIconSelect').value);
        localStorage.setItem('hercookbook_fontSize', document.getElementById('fontSizeSelect').value);
        applySettings();
        document.getElementById('settingsModal').classList.remove('open');
    });
    function openSettings(){
        const modal = document.getElementById('settingsModal');
        modal.classList.add('open');
        document.getElementById('accentColorSelect').value = localStorage.getItem('hercookbook_accent') || '#d47a5a';
        document.getElementById('bgSelect').value = localStorage.getItem('hercookbook_bg') || '#fef7e8';
        document.getElementById('difficultyIconSelect').value = localStorage.getItem('hercookbook_difficultyIcon') || 'stars';
        document.getElementById('fontSizeSelect').value = localStorage.getItem('hercookbook_fontSize') || '16px';
    }
    document.getElementById('openSettingsBtn').onclick = openSettings;
    document.querySelectorAll('.close-modal').forEach(btn=>btn.addEventListener('click', function(){ this.closest('.modal').classList.remove('open'); }));
    document.getElementById('newRecipeBtn').onclick = ()=>openRecipeForm(null);
    document.getElementById('randomBtn').onclick = randomRecipe;
    document.getElementById('searchInput').addEventListener('input', (e)=>{ currentSearch=e.target.value; renderRecipes(); });
    document.querySelectorAll('.view-btn').forEach(btn=>btn.addEventListener('click',()=>{ currentView=btn.dataset.view; localStorage.setItem('hercookbook_view',currentView); renderRecipes(); document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }));
    document.querySelector('.view-btn[data-view="'+currentView+'"]').classList.add('active');
    applySettings(); buildFilters(); renderRecipes();
    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
</script>
</body>
</html>
