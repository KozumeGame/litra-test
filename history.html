<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>История | Зачетный тренажер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #475569;
            --border: #e2e8f0;
            --primary: #2c3e8f;
            --primary-dark: #1e2a5e;
            --primary-light: #eef2ff;
            --correct: #10b981;
            --wrong: #ef4444;
            --progress-bg: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            --card-radius: 24px;
        }

        body.dark {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f1f5f9;
            --text-light: #cbd5e1;
            --border: #334155;
            --primary-light: #2d3a5e;
            --progress-bg: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            padding: 16px 12px 40px;
            transition: background 0.2s, color 0.2s;
            min-height: 100vh;
            position: relative;
        }

        .hidden-message {
            position: fixed;
            bottom: 8px;
            right: 12px;
            font-size: 11px;
            color: var(--text-light);
            opacity: 0.25;
            font-family: monospace;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 999;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        .card {
            background: var(--surface);
            border-radius: var(--card-radius);
            box-shadow: var(--shadow);
            padding: 20px 18px;
            border: 1px solid var(--border);
            transition: background 0.2s;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .theme-toggle, .sound-toggle {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text);
            transition: all 0.2s;
        }
        
        .theme-toggle:hover, .sound-toggle:hover {
            background: var(--primary-light);
        }

        .start-screen {
            text-align: center;
        }
        
        .start-screen h1 {
            font-size: 1.7rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--primary), #4f6eb3);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        
        .name-input-group {
            margin: 24px 0 20px;
            text-align: left;
        }
        
        .name-input-group label {
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 60px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(44,62,143,0.2);
        }
        
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        
        button:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            margin-top: 12px;
        }
        
        .btn-outline:hover {
            background: var(--primary-light);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .progress-area {
            flex: 1;
            min-width: 140px;
        }
        
        .progress-bar-bg {
            background: var(--progress-bg);
            border-radius: 40px;
            height: 8px;
            overflow: hidden;
        }
        
        .progress-fill {
            background: var(--primary);
            width: 0%;
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 40px;
        }
        
        .timer-box {
            background: var(--primary-light);
            padding: 6px 14px;
            border-radius: 60px;
            font-weight: 700;
            font-family: monospace;
            font-size: 1.3rem;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        
        .timer-box.warning {
            background: #fee2e2;
            color: #b91c1c;
            animation: pulse 1s infinite;
        }
        
        body.dark .timer-box.warning {
            background: #7f1a1a;
            color: #ffcdcd;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1);}
            50% { opacity: 0.8; transform: scale(1.02);}
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.4;
            margin: 16px 0 20px;
        }
        
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .option {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .option:active {
            transform: scale(0.98);
        }
        
        .option.selected {
            background: var(--primary-light);
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(44,62,143,0.2);
        }
        
        .option-letter {
            font-weight: 800;
            background: var(--progress-bg);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            flex-shrink: 0;
        }
        
        .option-text {
            flex: 1;
            font-size: 14px;
            line-height: 1.3;
        }
        
        .next-btn {
            margin-top: 8px;
        }
        
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 13px;
        }
        
        .result-stats {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .grade {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 12px 0;
            word-break: break-word;
        }
        
        .grade-badge {
            background: #10b98120;
            padding: 8px 24px;
            border-radius: 40px;
            display: inline-block;
            word-break: break-word;
        }
        
        .circle-chart {
            display: flex;
            justify-content: center;
            margin: 16px 0;
        }
        .donut {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            position: relative;
            background: var(--progress-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .donut-inner {
            width: 100px;
            height: 100px;
            background: var(--surface);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 28px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
        }
        .donut-inner span {
            font-size: 12px;
            font-weight: normal;
            color: var(--text-light);
        }
        .stats-text {
            margin-top: 12px;
            font-size: 14px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .mistake-item {
            background: var(--surface);
            border-left: 5px solid var(--wrong);
            padding: 14px;
            margin-bottom: 14px;
            border-radius: 18px;
            border: 1px solid var(--border);
        }
        
        .mistake-question {
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .mistake-detail {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 4px;
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .action-buttons button {
            flex: 1;
            min-width: 120px;
        }
        
        .motivation-message {
            margin: 16px 0 8px;
            padding: 12px;
            background: var(--primary-light);
            border-radius: 20px;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
        }
        
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-light);
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 550px) {
            body {
                padding: 12px 10px 30px;
            }
            .card {
                padding: 18px 16px;
            }
            .question-text {
                font-size: 1.1rem;
            }
            .option {
                padding: 12px 14px;
            }
            .option-text {
                font-size: 13px;
            }
            button {
                padding: 12px 20px;
                font-size: 15px;
            }
            .donut {
                width: 120px;
                height: 120px;
            }
            .donut-inner {
                width: 85px;
                height: 85px;
                font-size: 24px;
            }
            .grade {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="hidden-message">F. T'es la meilleure.</div>

<div class="container" id="app">
    <div class="header-bar">
        <div style="font-weight: 600; font-size: 14px;">📜 ИСТОРИЯ | ЗАЧЕТ</div>
        <div style="display: flex; gap: 8px;">
            <button class="sound-toggle" id="soundToggleBtn">🔊 Звук вкл</button>
            <button class="theme-toggle" id="themeToggleBtn">🌙 Тёмная</button>
        </div>
    </div>

    <div id="startScreen" class="card start-screen">
        <h1>🏛️ Тренажёр зачёта</h1>
        <p style="margin: 12px 0 8px; font-size: 14px;">20 случайных вопросов • 20 минут • 120 вопросов в базе</p>
        <div class="name-input-group">
            <label>👤 Ваше имя</label>
            <input type="text" id="userNameInput" placeholder="Например: Анастасия" autocomplete="off">
        </div>
        <button id="startQuizBtn">▶️ Начать тест</button>
        <button class="btn-outline" id="resetLocalStorageBtn" style="margin-top: 10px;">🔄 Сбросить имя</button>
        <footer>Можно менять ответ до нажатия «Далее» • Работа над ошибками</footer>
    </div>

    <div id="quizScreen" class="hidden">
        <div class="card">
            <div class="quiz-header">
                <div class="progress-area">
                    <div class="flex-between">
                        <span id="questionCounter">Вопрос 1 / 20</span>
                        <span id="answeredCount">✅ 0 отвечено</span>
                    </div>
                    <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>
                </div>
                <div class="timer-box" id="timerDisplay">20:00</div>
            </div>
            <div id="quizInner">
                <div class="question-text" id="questionText">Загрузка...</div>
                <div class="options-list" id="optionsContainer"></div>
                <button id="nextQuestionBtn" class="next-btn">Далее →</button>
            </div>
        </div>
    </div>

    <div id="resultScreen" class="hidden">
        <div class="card">
            <div class="result-stats">
                <h2 style="font-size: 1.5rem;">📋 Результат</h2>
                <div id="greetingName" style="font-size: 1.1rem; margin: 8px 0;"></div>
                <div class="circle-chart">
                    <div class="donut" id="donutChart">
                        <div class="donut-inner">
                            <span id="centerScore">0</span>
                            <span>баллов</span>
                        </div>
                    </div>
                </div>
                <div class="stats-text">
                    <span>✅ <span id="correctCount">0</span> правильных</span>
                    <span>❌ <span id="wrongCount">0</span> ошибок</span>
                </div>
                <div id="gradeDisplay" class="grade"></div>
                <div id="motivationMessage" class="motivation-message"></div>
                <button id="showMistakesBtn" class="btn-outline" style="width: auto; padding: 10px 20px; margin-top: 8px;">📖 Показать ошибки</button>
            </div>
            <div id="mistakesList" class="hidden" style="margin-top: 20px;"></div>
            <div class="action-buttons">
                <button id="shareResultBtn">📤 Поделиться</button>
                <button id="restartQuizBtn">🔄 Пройти заново</button>
            </div>
        </div>
    </div>
</div>

        if(!quizActive) return;
        if(currentQuestions[currentIndex].userAnswer === null) { alert("Выберите ответ"); return; }
        if(currentIndex+1 < 20) { currentIndex++; renderCurrentQuestion(); }
        else if(currentQuestions.every(q => q.userAnswer !== null)) finishQuiz();
    }

    function updateDonutChart(percent, correct, wrong) {
        const donut = document.getElementById('donutChart');
        const angle = (percent/100)*360;
        if(percent===100) donut.style.background = `conic-gradient(var(--correct) 0deg, var(--correct) 360deg)`;
        else if(percent===0) donut.style.background = `conic-gradient(var(--wrong) 0deg, var(--wrong) 360deg)`;
        else donut.style.background = `conic-gradient(var(--correct) 0deg, var(--correct) ${angle}deg, var(--wrong) ${angle}deg, var(--wrong) 360deg)`;
        document.getElementById('centerScore').innerText = correct*5;
        document.getElementById('correctCount').innerText = correct;
        document.getElementById('wrongCount').innerText = wrong;
    }

    function finishQuiz() {
        if(timerInterval) clearInterval(timerInterval);
        quizActive = false;
        let correct = currentQuestions.filter(q => q.userAnswer === q.correct).length;
        let points = correct*5;
        let gradeNum = points>=85 ? 5 : points>=75 ? 4 : points>=50 ? 3 : 2;
        let gradeText = gradeNum===5 ? "5 (отлично)" : gradeNum===4 ? "4 (хорошо)" : gradeNum===3 ? "3 (удовлетворительно)" : "2 (неудовлетворительно)";
        document.getElementById('gradeDisplay').innerHTML = `<div class="grade-badge" style="background:${points>=50 ? '#10b98120' : '#ef444420'}">${gradeText}</div>`;
        document.getElementById('greetingName').innerHTML = `${userName ? userName+', ' : ''}ваш результат:`;
        updateDonutChart((correct/20)*100, correct, 20-correct);
        document.getElementById('motivationMessage').innerHTML = getRandomMessage(gradeNum);
        quizScreen.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        document.getElementById('mistakesList').classList.add('hidden');
        window.mistakesData = currentQuestions.filter(q => q.userAnswer !== q.correct);
    }

    function showMistakes() {
        const mistakes = window.mistakesData || [];
        const container = document.getElementById('mistakesList');
        if(mistakes.length===0) { container.innerHTML = '<div style="padding:16px;text-align:center;">✨ Нет ошибок! Отличные знания ✨</div>'; container.classList.remove('hidden'); return; }
        let html = '<h3 style="margin-bottom:16px;">📌 Работа над ошибками</h3>';
        mistakes.forEach((m,i) => { html += `<div class="mistake-item"><div class="mistake-question">${i+1}. ${m.text}</div><div class="mistake-detail">❌ Ваш ответ: ${m.userAnswer}</div><div class="mistake-detail" style="color:var(--correct);">✅ Правильный: ${m.correct}</div></div>`; });
        container.innerHTML = html;
        container.classList.remove('hidden');
    }

    function shareResult() {
        let points = document.getElementById('centerScore').innerText;
        let text = `${userName ? userName : 'Я'} прошёл зачёт по истории на ${points} баллов!`;
        if(navigator.share) navigator.share({ title: 'Результат', text: text });
        else navigator.clipboard.writeText(text).then(()=>alert('Скопировано'));
    }

    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(!quizActive) return;
            if(timeSeconds <= 0) { clearInterval(timerInterval); quizActive=false; alert("Время вышло!"); finishQuiz(); }
            else { timeSeconds--; let mins = Math.floor(timeSeconds/60), secs = timeSeconds%60;
                document.getElementById('timerDisplay').innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                if(timeSeconds<=120) document.getElementById('timerDisplay').classList.add('warning');
            }
        }, 1000);
    }

    function initQuiz() {
        currentQuestions = selectRandomQuestions();
        currentIndex = 0; timeSeconds = 20*60; quizActive = true;
        renderCurrentQuestion(); updateAnsweredCounter(); startTimer();
        document.getElementById('timerDisplay').classList.remove('warning');
        quizScreen.classList.remove('hidden'); startScreen.classList.add('hidden'); resultScreen.classList.add('hidden');
    }

    function initTheme() { if(localStorage.getItem('theme')==='dark') document.body.classList.add('dark'); }
    themeBtn.onclick = () => { document.body.classList.toggle('dark'); localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light'); };
    soundToggleBtn.onclick = () => { soundEnabled = !soundEnabled; soundToggleBtn.innerText = soundEnabled ? "🔊 Звук вкл" : "🔇 Звук выкл"; };
    startBtn.onclick = () => { let name = userNameInput.value.trim(); userName = name ? name : "Участник"; if(name) localStorage.setItem('quizUserName', name); initQuiz(); };
    restartQuizBtn.onclick = () => { if(timerInterval) clearInterval(timerInterval); quizActive=false; startScreen.classList.remove('hidden'); resultScreen.classList.add('hidden'); quizScreen.classList.add('hidden'); };
    shareResultBtn.onclick = shareResult;
    showMistakesBtn.onclick = showMistakes;
    document.getElementById('nextQuestionBtn').onclick = nextQuestion;
    resetLocalBtn.onclick = () => { localStorage.removeItem('quizUserName'); userNameInput.value = ''; alert('Имя сброшено'); };
    if(localStorage.getItem('quizUserName')) userNameInput.value = localStorage.getItem('quizUserName');
    initTheme();
    soundToggleBtn.innerText = "🔊 Звук вкл";
</script>
</body>
</html>
