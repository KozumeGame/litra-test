<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер по Литературе</title>
    <style>
        :root { --main: #6c5ce7; --bg: #f0f3f7; --card: #ffffff; --text: #2d3436; --success: #00b894; --error: #d63031; }
        [data-theme="dark"] { --bg: #1e272e; --card: #2f3640; --text: #f5f6fa; --main: #a29bfe; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; }
        #app { width: 100%; max-width: 500px; padding: 20px; position: relative; }
        
        .card { background: var(--card); padding: 30px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); animation: slideIn 0.5s ease; position: relative; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .theme-toggle { position: absolute; top: 10px; right: 10px; background: none; border: none; cursor: pointer; font-size: 20px; z-index: 10; }
        
        .progress-bar { height: 6px; background: #dfe6e9; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        #progress { height: 100%; background: var(--main); width: 0%; transition: 0.4s; }
        
        .timer { font-weight: bold; color: var(--error); text-align: center; margin-bottom: 15px; font-size: 18px; }
        
        input[type="text"] { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #edeff2; margin-bottom: 20px; box-sizing: border-box; font-size: 16px; outline: none; background: var(--card); color: var(--text); }
        
        .q-text { font-size: 19px; font-weight: 600; line-height: 1.4; margin-bottom: 25px; }
        .options { display: grid; gap: 12px; }
        
        /* СТИЛИ КНОПОК */
        .opt-btn { background: rgba(0,0,0,0.03); border: 2px solid #edeff2; padding: 16px; border-radius: 16px; cursor: pointer; text-align: left; font-size: 16px; color: var(--text); transition: 0.2s; }
        
        /* Подсветка при нажатии */
        .opt-btn.selected { 
            border-color: var(--main) !important; 
            background: rgba(108, 92, 231, 0.15) !important; 
            box-shadow: 0 0 10px rgba(108, 92, 231, 0.2);
        }
        
        .opt-btn.correct-anim { background: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .opt-btn.error-anim { background: var(--error) !important; color: white !important; border-color: var(--error) !important; }
        
        .btn-check { background: var(--main); color: white; border: none; width: 100%; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3); transition: 0.3s; margin-top: 25px;}
        .btn-check:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        #start-screen, #result-screen { text-align: center; }
        .score-circle { width: 130px; height: 130px; border-radius: 50%; border: 6px solid var(--main); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; margin: 25px auto; color: var(--main); }
    </style>
</head>
<body>

<div id="app">
    <button class="theme-toggle" onclick="toggleTheme()">🌓</button>

    <div class="card" id="start-screen">
        <h1>Привет! ❤️</h1>
        <p>Введи своё имя перед началом:</p>
        <input type="text" id="user-name" placeholder="Твоё ФИО или Имя">
        <button class="btn-check" onclick="startQuiz()">НАЧАТЬ ТЕСТ</button>
    </div>

    <div class="card" id="quiz-screen" style="display: none;">
        <div class="progress-bar"><div id="progress"></div></div>
        <div class="timer" id="timer">Осталось: 20:00</div>
        <div id="quiz-content"></div>
        <button class="btn-check" id="main-btn" onclick="handleNext()">ОТВЕТИТЬ</button>
    </div>

    <div class="card" id="result-screen" style="display: none;">
        <h1 id="greeting">Результат:</h1>
        <div class="score-circle" id="final-score">0/20</div>
        <p style="font-size: 20px;">Твоя оценка: <b id="final-grade">-</b></p>
        <button class="btn-check" onclick="location.reload()">ЕЩЁ РАЗ</button>
    </div>
</div>

    { q: "Почему Соколов не притронулся к хлебу?", options: ["Гордость и достоинство", "Боялся яда", "Был сыт", "Хотел отдать своим"], correct: "Гордость и достоинство" },
    { q: "Когда Соколов пытался совершить первый побег?", options: ["В мае", "Декабре", "Июле", "Сентябре"], correct: "В мае" },
    { q: "Комендант, говорящий на «о» (Мюллер):", options: ["Мюллер", "Ванников", "Штейнер", "Полицай"], correct: "Мюллер" },
    { q: "Где Соколов встретил Ваньку?", options: ["Около чайной", "В лагере", "На фронте", "В Москве"], correct: "Около чайной" },
    { q: "Как Андрей лишился книжки шофера?", options: ["Сбил корову (авария)", "Продал", "Потерял", "Отобрали фашисты"], correct: "Сбил корову (авария)" },
    { q: "Соколов с хлебом от фашистов поступил так:", options: ["Поделил на всех поровну", "Съел сам", "Спрятал на побег", "Выбросил"], correct: "Поделил на всех поровну" },
    { q: "Актер, режиссер и сценарист в литературе:", options: ["Шукшин", "Астафьев", "Распутин", "Солженицын"], correct: "Шукшин" },
    { q: "Автор в «Царь-рыбе»:", options: ["Рассказчик и философ", "Наблюдатель", "Геолог", "Рыбак"], correct: "Рассказчик и философ" },
    { q: "Жанр «Царь-рыбы»:", options: ["Повествование в рассказах", "Роман", "Драма", "Сказ"], correct: "Повествование в рассказах" },
    { q: "Автор «Привычного дела»:", options: ["Василий Белов", "Валентин Распутин", "Виктор Астафьев", "Михаил Шолохов"], correct: "Василий Белов" },
    { q: "Причина отъезда Ганина в «Машеньке»:", options: ["Прошлое не вернуть", "Узнал об измене", "Испугался Алферова", "Забыл любовь"], correct: "Прошлое не вернуть" },
    { q: "Рассказ «Матренин двор» — это:", options: ["Солженицын о праведнице", "Рассказ о колхозе", "Очерк о деревне", "Повесть о войне"], correct: "Солженицын о праведнице" }
];

let sessionQ = [];
let current = 0;
let score = 0;
let timeLeft = 1200; 
let timerInt;
let selectedText = null;

function shuffle(a) { return a.sort(() => Math.random() - 0.5); }

function toggleTheme() {
    const b = document.body;
    b.dataset.theme = b.dataset.theme === "dark" ? "" : "dark";
}

function startQuiz() {
    const name = document.getElementById('user-name').value;
    if(!name) { alert("Введи имя!"); return; }
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    sessionQ = shuffle([...database]).slice(0, 20);
    startTimer();
    render();
}

function startTimer() {
    timerInt = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        document.getElementById('timer').innerText = `Осталось: ${m}:${s < 10 ? '0' + s : s}`;
        if(timeLeft <= 0) { clearInterval(timerInt); finish(); }
    }, 1000);
}

function render() {
    const q = sessionQ[current];
    const opts = shuffle([...q.options]);
    selectedText = null;
    document.getElementById('progress').style.width = (current / 20) * 100 + '%';
    document.getElementById('main-btn').innerText = "ОТВЕТИТЬ";
    const cont = document.getElementById('quiz-content');
    cont.innerHTML = `
        <div class="q-text">${current + 1}. ${q.q}</div>
        <div class="options">
            ${opts.map(o => `<button class="opt-btn" onclick="select(this)">${o}</button>`).join('')}
        </div>
    `;
}

function select(btn) {
    if(document.querySelector('.correct-anim')) return;
    document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedText = btn.innerText;
}

function handleNext() {
    if(!selectedText && document.getElementById('main-btn').innerText === "ОТВЕТИТЬ") return;
    const q = sessionQ[current];
    const btn = document.getElementById('main-btn');
    if(btn.innerText === "ДАЛЕЕ") {
        current++;
        if(current < 20) render(); else finish();
        return;
    }
    const btns = document.querySelectorAll('.opt-btn');
    let isCorrect = selectedText === q.correct;
    if(isCorrect) score++;
    btns.forEach(b => {
        if(b.innerText === q.correct) b.classList.add('correct-anim');
        if(b.classList.contains('selected') && !isCorrect) b.classList.add('error-anim');
    });
    btn.innerText = "ДАЛЕЕ";
}

function finish() {
    clearInterval(timerInt);
    const name = document.getElementById('user-name').value;
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('greeting').innerText = `${name}, твой результат:`;
    document.getElementById('final-score').innerText = `${score}/20`;
    let p = (score / 20) * 100;
    let g = p >= 85 ? 5 : (p >= 75 ? 4 : (p >= 50 ? 3 : 2));
    document.getElementById('final-grade').innerText = g;
}
</script>
