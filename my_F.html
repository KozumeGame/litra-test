<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌸 F.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(180deg, #fef9fa 0%, #fdf3f6 40%, #fbeaef 100%);
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            position: relative;
        }

        /* Частицы фона */
        .bg-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp 14s ease-in infinite;
            opacity: 0.22;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            10% { opacity: 0.3; }
            50% { opacity: 0.18; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }

        /* Подсказка */
        .hint {
            position: absolute;
            top: 16%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            color: #c28496;
            font-size: 1.1rem;
            letter-spacing: 0.09em;
            text-align: center;
            pointer-events: none;
            transition: opacity 1s ease;
            text-shadow: 0 1px 5px rgba(255, 255, 255, 0.8);
        }
        .hint.fade-out {
            opacity: 0;
        }

        /* Контур сердца */
        .heart-hint {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            pointer-events: none;
            transition: opacity 1s ease;
        }
        .heart-hint svg {
            width: 80px;
            height: 75px;
            animation: pulseHint 2.6s ease-in-out infinite;
        }
        .heart-hint path {
            fill: none;
            stroke: #e6b5c4;
            stroke-width: 2;
            stroke-dasharray: 7 5;
            opacity: 0.65;
        }
        @keyframes pulseHint {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 0.9; }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        #treeContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none;
            display: none;
        }

        #textBlock {
            position: absolute;
            bottom: 18%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            pointer-events: none;
            text-align: center;
            width: 90%;
            max-width: 500px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        #textBlock.visible {
            display: flex;
        }
        .typed-line {
            color: #9e6176;
            font-size: 1rem;
            letter-spacing: 0.04em;
            line-height: 1.6;
            min-height: 1.6em;
            text-align: center;
            text-shadow: 0 1px 4px rgba(255, 235, 240, 0.8);
            transition: opacity 1s ease;
        }
        .typed-line.fading {
            opacity: 0.2;
        }
        .typed-line.final {
            color: #7d4b5e;
            font-size: 1.1rem;
            font-style: italic;
            letter-spacing: 0.05em;
            opacity: 1;
        }

        #counterBlock {
            display: none;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            z-index: 20;
            pointer-events: none;
        }
        #counterBlock.visible {
            display: flex;
        }
        .counter-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 48px;
        }
        .counter-number {
            font-size: 1.6rem;
            font-weight: bold;
            color: #ba6d82;
            letter-spacing: 0.03em;
            line-height: 1;
            text-shadow: 0 2px 6px rgba(186, 109, 130, 0.2);
        }
        .counter-label {
            font-size: 0.65rem;
            color: #cb98a7;
            letter-spacing: 0.06em;
            text-transform: lowercase;
            margin-top: 2px;
        }
        .counter-divider {
            font-size: 1.5rem;
            color: #dfa9b8;
            line-height: 1;
            margin-bottom: 12px;
            opacity: 0.65;
        }
    </style>
</head>
<body>

    <div id="bgParticles"></div>
    <div class="hint" id="hintText">draw a heart</div>
    <div class="heart-hint" id="heartHint">
        <svg viewBox="0 0 32 29.6">
            <path d="M16 28 C16 28, 0 19, 0 10 C0 4, 5 0, 9 0 C12 0, 15 2, 16 5 C17 2, 20 0, 23 0 C27 0, 32 4, 32 10 C32 19, 16 28, 16 28Z"/>
        </svg>
    </div>
    <canvas id="drawingCanvas"></canvas>
    <div id="treeContainer"></div>
    <div id="textBlock">
        <div class="typed-line" id="line1"></div>
        <div class="typed-line" id="line2"></div>
        <div class="typed-line final" id="line3"></div>
        <div id="counterBlock">
            <div class="counter-item"><span class="counter-number" id="days">0</span><span class="counter-label">days</span></div>
            <span class="counter-divider">:</span>
            <div class="counter-item"><span class="counter-number" id="hours">0</span><span class="counter-label">hours</span></div>
            <span class="counter-divider">:</span>
            <div class="counter-item"><span class="counter-number" id="minutes">0</span><span class="counter-label">min</span></div>
            <span class="counter-divider">:</span>
            <div class="counter-item"><span class="counter-number" id="seconds">0</span><span class="counter-label">sec</span></div>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('drawingCanvas');
            const ctx = canvas.getContext('2d');
            const hintText = document.getElementById('hintText');
            const heartHint = document.getElementById('heartHint');
            const treeContainer = document.getElementById('treeContainer');
            const textBlock = document.getElementById('textBlock');
            const line1 = document.getElementById('line1');
            const line2 = document.getElementById('line2');
            const line3 = document.getElementById('line3');
            const counterBlock = document.getElementById('counterBlock');

            let W, H;

            function resize() {
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W;
                canvas.height = H;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = '#f2c4d2';
                ctx.shadowBlur = 18;
            }
            resize();
            window.addEventListener('resize', resize);

            // Фоновые частицы
            const bgContainer = document.getElementById('bgParticles');
            const colors = ['#f5d2dc', '#ebc8d2', '#f9dde4', '#f0cfd8', '#fbe2e9', '#e8c4cf'];
            for (let i = 0; i < 24; i++) {
                const p = document.createElement('div');
                p.classList.add('bg-particle');
                const s = Math.random() * 25 + 8;
                p.style.width = s + 'px';
                p.style.height = s + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.animationDuration = (Math.random() * 15 + 11) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                bgContainer.appendChild(p);
            }

            let drawing = false;
            let path = [];

            function getPos(e) {
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: cx, y: cy };
            }

            function startDraw(e) {
                if (treeContainer.style.display === 'block') return;
                e.preventDefault();
                drawing = true;
                path = [];
                ctx.clearRect(0, 0, W, H);
                const p = getPos(e);
                path.push(p);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            function moveDraw(e) {
                if (!drawing) return;
                e.preventDefault();
                const p = getPos(e);
                path.push(p);
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#eaa4ba';
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            function endDraw(e) {
                if (!drawing) return;
                drawing = false;
                ctx.shadowBlur = 0;
                if (path.length < 8) {
                    ctx.clearRect(0, 0, W, H);
                    return;
                }
                if (isHeartSimple(path)) {
                    triggerTree();
                } else {
                    ctx.clearRect(0, 0, W, H);
                }
            }

            // УПРОЩЁННОЕ распознавание
            function isHeartSimple(points) {
                if (points.length < 8) return false;
                let minX = Infinity,
                    minY = Infinity,
                    maxX = -Infinity,
                    maxY = -Infinity;
                points.forEach(p => {
                    if (p.x < minX) minX = p.x;
                    if (p.y < minY) minY = p.y;
                    if (p.x > maxX) maxX = p.x;
                    if (p.y > maxY) maxY = p.y;
                });
                const w = maxX - minX;
                const h = maxY - minY;
                if (w < 50 || h < 45 || w / h < 0.5 || w / h > 2.2) return false;

                const cx = (minX + maxX) / 2;
                const cy = (minY + maxY) / 2;
                let top = 0,
                    bottom = 0;
                points.forEach(p => {
                    if (p.y < cy - h * 0.06) top++;
                    if (p.y > cy + h * 0.06) bottom++;
                });
                if (top < 3 || bottom < 4) return false;

                const first = points[0];
                const last = points[points.length - 1];
                const dist = Math.hypot(last.x - first.x, last.y - first.y);
                if (dist > Math.hypot(w, h) * 0.75) return false;

                let left = 0,
                    right = 0;
                points.forEach(p => {
                    if (p.x < cx - w * 0.04) left++;
                    if (p.x > cx + w * 0.04) right++;
                });
                return left >= 2 && right >= 2;
            }

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', moveDraw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseleave', endDraw);
            canvas.addEventListener('touchstart', startDraw, { passive: false });
            canvas.addEventListener('touchmove', moveDraw, { passive: false });
            canvas.addEventListener('touchend', endDraw);
            canvas.addEventListener('touchcancel', endDraw);

            function triggerTree() {
                canvas.style.pointerEvents = 'none';
                hintText.classList.add('fade-out');
                heartHint.style.opacity = '0';
                ctx.clearRect(0, 0, W, H);
                setTimeout(() => { hintText.style.display = 'none';
                    heartHint.style.display = 'none'; }, 900);

                treeContainer.style.display = 'block';
                treeContainer.innerHTML = '';
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', '0 0 400 420');
                svg.setAttribute('width', '100%');
                svg.setAttribute('height', '100%');
                svg.style.position = 'absolute';
                svg.style.bottom = '22%';
                svg.style.left = '50%';
                svg.style.transform = 'translateX(-50%)';
                svg.style.maxWidth = '400px';
                svg.style.pointerEvents = 'none';
                treeContainer.appendChild(svg);

                // Ствол
                const trunk = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                trunk.setAttribute('d', 'M193 340 Q188 260 190 200 Q192 160 200 160 Q208 160 210 200 Q212 260 207 340 Z');
                trunk.setAttribute('fill', '#cfa395');
                trunk.setAttribute('opacity', '0');
                svg.appendChild(trunk);
                animateAttr(trunk, 'opacity', 0, 0.9, 500);

                // Ветви
                const branchPaths = [
                    'M200 180 Q160 140 120 110',
                    'M200 175 Q240 130 280 105',
                    'M200 195 Q150 160 90 145',
                    'M200 190 Q250 155 310 145',
                    'M198 210 Q160 190 100 185',
                    'M202 210 Q240 190 300 185',
                    'M196 185 Q175 140 165 95',
                    'M204 185 Q225 140 235 95',
                ];
                branchPaths.forEach((d, i) => {
                    const br = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    br.setAttribute('d', d);
                    br.setAttribute('stroke', '#cfa395');
                    br.setAttribute('stroke-width', '6');
                    br.setAttribute('fill', 'none');
                    br.setAttribute('stroke-linecap', 'round');
                    br.setAttribute('opacity', '0');
                    svg.appendChild(br);
                    setTimeout(() => animateAttr(br, 'opacity', 0, 0.8, 450), 200 + i * 60);
                });

                // Сердечки на ветвях
                const heartShape = 'M0 0 C0 -6, -5 -10, -8 -10 C-12 -10, -14 -6, -14 0 C-14 8, 0 16, 0 16 C0 16, 14 8, 14 0 C14 -6, 12 -10, 8 -10 C5 -10, 0 -6, 0 0Z';
                const heartSpots = [
                    [115, 108],
                    [285, 103],
                    [88, 143],
                    [312, 143],
                    [98, 183],
                    [302, 183],
                    [163, 93],
                    [237, 93],
                    [125, 140],
                    [275, 138],
                    [108, 160],
                    [292, 160]
                ];
                heartSpots.forEach(([cx, cy], i) => {
                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    g.setAttribute('transform', `translate(${cx},${cy}) scale(0.85)`);
                    g.setAttribute('opacity', '0');
                    const h = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    h.setAttribute('d', heartShape);
                    h.setAttribute('fill', '#eaa8bb');
                    g.appendChild(h);
                    svg.appendChild(g);
                    setTimeout(() => {
                        animateAttr(g, 'opacity', 0, 1, 400);
                        g.style.transformOrigin = `${cx}px ${cy}px`;
                        g.style.animation = `breathe ${2.6+Math.random()*2}s ease-in-out infinite`;
                    }, 500 + i * 70);
                });

                // Падающие
                for (let i = 0; i < 30; i++) createHeartParticle(svg, 'fall');
                // Улетающие
                for (let i = 0; i < 22; i++) createHeartParticle(svg, 'fly');

                setTimeout(() => {
                    textBlock.classList.add('visible');
                    startTyping();
                }, 1300);
            }

            function animateAttr(el, attr, from, to, dur) {
                const start = performance.now();
                (function step(ts) {
                    const p = Math.min((ts - start) / dur, 1);
                    el.setAttribute(attr, from + (to - from) * p);
                    if (p < 1) requestAnimationFrame(step);
                })(start);
            }

            function createHeartParticle(svg, type) {
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                const h = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                h.setAttribute('d', 'M0 0 C0 -5, -4 -8, -7 -8 C-10 -8, -12 -5, -12 0 C-12 6, 0 13, 0 13 C0 13, 12 6, 12 0 C12 -5, 10 -8, 7 -8 C4 -8, 0 -5, 0 0Z');
                const fills = ['#f2c1cf', '#eaa9bc', '#f6d3dd', '#e1b7c5', '#fadce5'];
                h.setAttribute('fill', fills[Math.floor(Math.random() * fills.length)]);
                h.setAttribute('opacity', '0.8');
                const s = 0.35 + Math.random() * 0.65;
                const x = 155 + Math.random() * 90;
                const y = 280 + Math.random() * 50;
                g.setAttribute('transform', `translate(${x},${y}) scale(${s})`);
                g.appendChild(h);
                svg.appendChild(g);
                const dur = type === 'fall' ? (2+Math.random()*3.5) : (3.5+Math.random()*5);
                const delay = Math.random() * 6;
                g.style.animation = `${type==='fall'?'fallDown':'flyAway'} ${dur}s ${delay}s ease-out forwards`;
            }

            const styleEl = document.createElement('style');
            styleEl.textContent = `
                @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
                @keyframes fallDown { 0%{transform:translate(0,0) rotate(0deg); opacity:0.85} 100%{transform:translate(${Math.random()*30-15}px,70px) rotate(${Math.random()*50-25}deg); opacity:0} }
                @keyframes flyAway { 0%{transform:translate(0,0) rotate(0deg); opacity:0.8} 100%{transform:translate(${(Math.random()-0.5)*180}px,-110px) rotate(${Math.random()*100-50}deg); opacity:0} }
            `;
            document.head.appendChild(styleEl);

            const T1 = "Look at this tree. This is what happened the moment you walked into my life.";
            const T2 = "You didn't just make things better. You made them bloom.";
            const T3 = "Not a single day has passed without the world being more beautiful simply because you exist, F.";

            function typeText(el, text, speed, cb) {
                let i = 0;
                el.textContent = '';
                el.style.opacity = '1';
                el.classList.remove('fading');

                function tick() {
                    if (i < text.length) { el.textContent += text.charAt(i);
                        i++;
                        setTimeout(tick, speed); } else if (cb) setTimeout(cb, 800);
                }
                tick();
            }

            function startTyping() {
                typeText(line1, T1, 45, () => {
                    setTimeout(() => { line1.classList.add('fading');
                        typeText(line2, T2, 45, () => {
                            setTimeout(() => { line2.classList.add('fading');
                                typeText(line3, T3, 45, () => {
                                    line3.classList.add('final');
                                    setTimeout(() => { counterBlock.classList.add('visible');
                                        startCounter(); }, 500);
                                }); }, 600);
                        }); }, 600);
                });
            }

            const START = new Date('2023-04-12T22:00:00');

            function startCounter() {
                function upd() {
                    const diff = Math.max(0, new Date() - START);
                    const sec = Math.floor(diff / 1000);
                    document.getElementById('days').textContent = Math.floor(sec / 86400);
                    document.getElementById('hours').textContent = Math.floor((sec % 86400) / 3600);
                    document.getElementById('minutes').textContent = Math.floor((sec % 3600) / 60);
                    document.getElementById('seconds').textContent = sec % 60;
                }
                upd();
                setInterval(upd, 1000);
            }
        })();
    </script>
</body>
</html>
