<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Árbol de Corazones</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fbf7f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .scene {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Начальное сердечко */
        .initial-heart-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        .initial-heart-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .heart-shape {
            width: 160px;
            height: 150px;
            position: relative;
            animation: heartPulse 1.2s ease-in-out infinite;
        }

        .heart-shape::before,
        .heart-shape::after {
            content: '';
            position: absolute;
            top: 0;
            width: 80px;
            height: 120px;
            background: #d63447;
            border-radius: 80px 80px 0 0;
        }

        .heart-shape::before {
            left: 40px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart-shape::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        .heart-bottom {
            position: absolute;
            top: 60px;
            left: 1px;
            width: 157px;
            height: 100px;
            background: #d63447;
            clip-path: polygon(50% 100%, 0% 20%, 100% 20%);
        }

        @keyframes heartPulse {
            0%,
            100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.08);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.05);
            }
            60% {
                transform: scale(1);
            }
        }

        .heart-line {
            width: 2px;
            height: 55px;
            background: #d63447;
            position: relative;
            margin-top: -2px;
        }

        .click-text {
            position: absolute;
            top: 18px;
            left: 8px;
            color: #d63447;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
            white-space: nowrap;
            font-family: 'Playfair Display', serif;
            animation: clickGlow 1.8s ease-in-out infinite;
        }

        @keyframes clickGlow {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
                text-shadow: 0 0 8px rgba(214, 52, 71, 0.4);
            }
        }

        /* seed падающий */
        .seed {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #d63447;
            border-radius: 50%;
            z-index: 20;
            transition: top 0.05s linear;
            box-shadow: 0 0 12px rgba(214, 52, 71, 0.6);
        }

        .seed-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #e84353;
            border-radius: 50%;
            pointer-events: none;
            animation: particleFade 0.8s ease-out forwards;
        }

        @keyframes particleFade {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(0);
            }
        }

        /* Линия горизонт */
        .horizon-line {
            position: absolute;
            top: 68%;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: #d63447;
            z-index: 5;
            transition: width 1.8s cubic-bezier(0.25, 0.1, 0.25, 1);
            border-radius: 1px;
        }

        .horizon-line.active {
            width: 75%;
            left: 12.5%;
            transform: translateX(0);
        }

        /* Дерево */
        .tree-container {
            position: absolute;
            top: 68%;
            left: 50%;
            transform: translate(-50%, -100%);
            z-index: 6;
            pointer-events: none;
            transition: left 2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .tree-container.shifted {
            left: 70%;
        }

        .tree-svg {
            width: 300px;
            height: 380px;
        }

        /* крона сердечек */
        .hearts-crown {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 7;
        }

        .crown-heart {
            position: absolute;
            font-size: 16px;
            animation: heartAppear 0.6s ease-out forwards;
            opacity: 0;
            transform: scale(0);
        }

        @keyframes heartAppear {
            0% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }
            60% {
                opacity: 1;
                transform: scale(1.3) rotate(5deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .crown-heart.falling {
            animation: heartFall 3.5s ease-in forwards;
        }

        @keyframes heartFall {
            0% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            70% {
                opacity: 0.8;
            }
            100% {
                opacity: 0;
                transform: translate(var(--fx), var(--fy)) rotate(var(--fr)) scale(0.6);
            }
        }

        /* Текст сообщение */
        .message-container {
            position: absolute;
            top: 25%;
            left: 8%;
            z-index: 8;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            max-width: 320px;
        }

        .message-container.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .date-line {
            font-size: 20px;
            color: #b56576;
            letter-spacing: 2px;
            margin-bottom: 18px;
            font-weight: 400;
        }

        .love-message {
            font-size: 22px;
            color: #4a3f47;
            line-height: 1.5;
            font-weight: 400;
            font-style: italic;
        }

        .typing-cursor {
            display: inline;
            animation: blink 0.7s step-end infinite;
            color: #b56576;
            font-weight: 300;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Счётчик */
        .counter-container {
            position: absolute;
            top: 71%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9;
            opacity: 0;
            transition: opacity 1.5s ease;
            text-align: center;
        }

        .counter-container.visible {
            opacity: 1;
        }

        .counter {
            font-size: 18px;
            color: #6b5b65;
            letter-spacing: 1.5px;
            font-weight: 400;
            background: rgba(251, 247, 240, 0.7);
            padding: 8px 24px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }

        .counter span {
            color: #b56576;
            font-weight: 600;
            margin: 0 3px;
        }
    </style>
</head>
<body>
    <div class="scene" id="scene">
        <!-- horizon line -->
        <div class="horizon-line" id="horizonLine"></div>

        <!-- initial heart -->
        <div class="initial-heart-container" id="initialHeart" onclick="startAnimation()">
            <div class="heart-shape"></div>
            <div class="heart-bottom"></div>
            <div class="heart-line">
                <span class="click-text">click here</span>
            </div>
        </div>

        <!-- tree -->
        <div class="tree-container" id="treeContainer">
            <svg class="tree-svg" viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg">
                <!-- ствол -->
                <path d="M140 340 L140 210 Q140 190 150 190 L150 340 Z" fill="#5D4037" />
                <path d="M150 340 L150 180 Q155 165 165 160 L160 340 Z" fill="#6D4C41" />
                <path d="M160 340 L160 175 Q165 158 175 150 L170 340 Z" fill="#5D4037" />
                <!-- основная толстая часть ствола -->
                <path d="M125 380 L125 240 Q128 215 140 200 L155 200 Q165 215 168 240 L168 380 Z" fill="#4E342E" />
                <path d="M140 200 Q148 185 155 180 L155 380 L140 380 Z" fill="#5D4037" />
                <!-- ветки -->
                <path d="M155 190 Q180 160 210 135" stroke="#5D4037" stroke-width="8" fill="none" stroke-linecap="round"/>
                <path d="M155 180 Q130 140 95 110" stroke="#5D4037" stroke-width="7" fill="none" stroke-linecap="round"/>
                <path d="M158 175 Q195 140 230 115" stroke="#6D4C41" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M150 170 Q110 130 70 105" stroke="#6D4C41" stroke-width="5.5" fill="none" stroke-linecap="round"/>
                <path d="M160 160 Q200 120 245 90" stroke="#5D4037" stroke-width="4.5" fill="none" stroke-linecap="round"/>
                <path d="M145 155 Q100 115 55 85" stroke="#5D4037" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M165 145 Q210 80 250 60" stroke="#6D4C41" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <path d="M140 140 Q80 90 40 60" stroke="#6D4C41" stroke-width="3" fill="none" stroke-linecap="round"/>
                <!-- тонкие веточки -->
                <path d="M210 135 Q225 120 235 110" stroke="#795548" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <path d="M210 135 Q220 115 215 100" stroke="#795548" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M95 110 Q80 100 70 90" stroke="#795548" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <path d="M95 110 Q85 95 90 80" stroke="#795548" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M230 115 Q245 105 255 95" stroke="#795548" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M70 105 Q55 95 45 85" stroke="#795548" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M245 90 Q260 80 270 68" stroke="#8D6E63" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M55 85 Q40 75 30 65" stroke="#8D6E63" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M250 60 Q268 48 278 38" stroke="#8D6E63" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                <path d="M40 60 Q25 50 15 40" stroke="#8D6E63" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- hearts crown container -->
        <div class="hearts-crown" id="heartsCrown"></div>

        <!-- message -->
        <div class="message-container" id="messageContainer">
            <div class="date-line" id="dateLine"></div>
            <div class="love-message" id="loveMessage"></div>
        </div>

        <!-- counter -->
        <div class="counter-container" id="counterContainer">
            <div class="counter" id="counter"></div>
        </div>
    </div>

    <script>
        // =========== ДАТА ============
        const startDate = new Date('2023-04-12T22:00:00');

        // =========== ЭЛЕМЕНТЫ ============
        const scene = document.getElementById('scene');
        const initialHeart = document.getElementById('initialHeart');
        const horizonLine = document.getElementById('horizonLine');
        const treeContainer = document.getElementById('treeContainer');
        const heartsCrown = document.getElementById('heartsCrown');
        const messageContainer = document.getElementById('messageContainer');
        const dateLine = document.getElementById('dateLine');
        const loveMessage = document.getElementById('loveMessage');
        const counterContainer = document.getElementById('counterContainer');
        const counter = document.getElementById('counter');

        let animationStarted = false;

        // =========== ЗАПУСК ============
        function startAnimation() {
            if (animationStarted) return;
            animationStarted = true;

            // Скрываем начальное сердечко
            initialHeart.classList.add('hidden');

            // Запускаем падение семени
            dropSeed();
        }

        function dropSeed() {
            const heartRect = initialHeart.getBoundingClientRect();
            const sceneRect = scene.getBoundingClientRect();
            const startX = heartRect.left + heartRect.width / 2 - sceneRect.left;
            const startY = heartRect.top + heartRect.height / 2 - sceneRect.top;

            const targetY = sceneRect.height * 0.68; // линия горизонта
            const targetX = sceneRect.width / 2;

            const seed = document.createElement('div');
            seed.classList.add('seed');
            seed.style.left = startX + 'px';
            seed.style.top = startY + 'px';
            scene.appendChild(seed);

            const duration = 1800;
            const startTime = performance.now();

            // Показываем линию горизонта
            setTimeout(() => {
                horizonLine.classList.add('active');
            }, 300);

            function animateSeed(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // easeInQuad
                const eased = progress * progress;
                const currentY = startY + (targetY - startY) * eased;
                const currentX = startX + (targetX - startX) * eased;

                seed.style.top = currentY + 'px';
                seed.style.left = currentX + 'px';

                // частицы
                if (Math.random() < 0.25) {
                    createParticle(currentX, currentY);
                }

                if (progress < 1) {
                    requestAnimationFrame(animateSeed);
                } else {
                    // Семя достигло линии
                    seed.style.opacity = '0';
                    setTimeout(() => seed.remove(), 300);
                    growTree();
                }
            }

            requestAnimationFrame(animateSeed);
        }

        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('seed-particle');
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.setProperty('--dx', (Math.random() - 0.5) * 60 + 'px');
            particle.style.setProperty('--dy', (Math.random() - 0.5) * 60 - 20 + 'px');
            scene.appendChild(particle);
            setTimeout(() => particle.remove(), 800);
        }

        function growTree() {
            // Дерево появляется
            treeContainer.style.opacity = '1';
            treeContainer.style.transition = 'opacity 1s ease';
            treeContainer.style.opacity = '1';

            // Заполняем крону сердечками
            setTimeout(() => {
                fillCrown();
            }, 600);
        }

        function fillCrown() {
            const treeRect = treeContainer.getBoundingClientRect();
            const sceneRect = scene.getBoundingClientRect();
            const treeCenterX = treeRect.left + treeRect.width / 2 - sceneRect.left;
            const treeTop = treeRect.top - sceneRect.top;

            // Форма сердца вокруг дерева
            const heartPoints = generateHeartShape(treeCenterX, treeTop + 80, 160);

            const colors = [
                '#d63447', '#e84353', '#f06292', '#ec407a',
                '#ff8a80', '#ff80ab', '#f48fb1', '#ff5252',
                '#ff4081', '#c2185b', '#e91e63', '#f50057',
                '#ffeb3b', '#ffc107', '#ce93d8', '#ba68c8'
            ];

            const emojis = ['❤️', '💖', '💕', '💗', '💝', '💘', '💓', '♥️'];

            // Создаём сердечки по форме
            heartPoints.forEach((pt, i) => {
                setTimeout(() => {
                    const heart = document.createElement('span');
                    heart.classList.add('crown-heart');
                    heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    heart.style.left = pt.x + 'px';
                    heart.style.top = pt.y + 'px';
                    heart.style.fontSize = (14 + Math.random() * 18) + 'px';
                    heart.style.color = colors[Math.floor(Math.random() * colors.length)];
                    heartsCrown.appendChild(heart);

                    // Триггерим появление
                    requestAnimationFrame(() => {
                        heart.style.opacity = '1';
                        heart.style.transform = 'scale(1)';
                    });
                }, i * 15);
            });

            // После заполнения — сдвигаем дерево и запускаем ветер
            setTimeout(() => {
                shiftTreeAndWind();
            }, heartPoints.length * 15 + 600);
        }

        function generateHeartShape(cx, cy, size) {
            const points = [];
            const totalPoints = 140;
            for (let i = 0; i < totalPoints; i++) {
                const t = (i / totalPoints) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                const scale = size / 16;
                const px = cx + x * scale + (Math.random() - 0.5) * 50;
                const py = cy + y * scale + (Math.random() - 0.5) * 40;
                if (py < cy + size * 0.9 && py > cy - size * 0.8) {
                    points.push({ x: px, y: py });
                }
            }
            // Добавляем внутренние точки
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * size * 0.65;
                points.push({
                    x: cx + Math.cos(angle) * radius,
                    y: cy + Math.sin(angle) * radius * 0.7 - size * 0.05
                });
            }
            return points;
        }

        function shiftTreeAndWind() {
            // Сдвигаем дерево вправо
            treeContainer.classList.add('shifted');

            // Запускаем падение сердечек влево
            setTimeout(() => {
                const allHearts = heartsCrown.querySelectorAll('.crown-heart');
                allHearts.forEach((heart, i) => {
                    setTimeout(() => {
                        const heartRect = heart.getBoundingClientRect();
                        const sceneRect = scene.getBoundingClientRect();
                        const hx = heartRect.left + heartRect.width / 2 - sceneRect.left;
                        const hy = heartRect.top + heartRect.height / 2 - sceneRect.top;
                        const targetX = 50 + Math.random() * 180;
                        const targetY = hy + 100 + Math.random() * 250;
                        heart.style.setProperty('--fx', (targetX - hx) + 'px');
                        heart.style.setProperty('--fy', (targetY - hy) + 'px');
                        heart.style.setProperty('--fr', (Math.random() - 0.5) * 120 + 'deg');
                        heart.classList.add('falling');

                        // Некоторые сердечки оставляем на дереве
                        if (Math.random() < 0.25) {
                            heart.classList.remove('falling');
                            heart.style.opacity = '0.85';
                        }
                    }, i * 20);
                });
            }, 400);

            // Показываем сообщение
            setTimeout(() => {
                showMessage();
            }, 1200);

            // Показываем счётчик
            setTimeout(() => {
                counterContainer.classList.add('visible');
                updateCounter();
                setInterval(updateCounter, 1000);
            }, 2000);
        }

        function showMessage() {
            const fullDate = 'April 12, 2023';
            const fullText = 'Not a single day has passed without the world being more beautiful simply because you exist, F.';

            messageContainer.classList.add('visible');

            // Печатаем дату
            let dateIndex = 0;
            const dateInterval = setInterval(() => {
                if (dateIndex <= fullDate.length) {
                    dateLine.textContent = fullDate.substring(0, dateIndex) + (dateIndex < fullDate.length ? '_' : '');
                    dateIndex++;
                } else {
                    clearInterval(dateInterval);
                    dateLine.textContent = fullDate;
                    // Начинаем печатать сообщение
                    typeMessage(fullText);
                }
            }, 80);
        }

        function typeMessage(text) {
            let index = 0;
            loveMessage.innerHTML = '<span class="typing-cursor">_</span>';
            const interval = setInterval(() => {
                if (index < text.length) {
                    index++;
                    loveMessage.innerHTML = text.substring(0, index) + '<span class="typing-cursor">_</span>';
                } else {
                    clearInterval(interval);
                    loveMessage.innerHTML = text;
                }
            }, 50);
        }

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            counter.innerHTML = `
                <span>${days}</span> days 
                <span>${hours}</span> hours 
                <span>${minutes}</span> minutes 
                <span>${seconds}</span> seconds
            `;
        }

        // Инициализация
        treeContainer.style.opacity = '0';
    </script>
</body>
</html>
