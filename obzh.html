<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОБЖ: Итоговый контроль</title>
    <style>
        :root { --main: #27ae60; --bg: #f4f7f6; --card: #ffffff; --text: #333; --accent: #2ecc71; --error: #c0392b; }
        [data-theme="dark"] { --bg: #1a1a1a; --card: #2d2d2d; --text: #e0e0e0; --main: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; min-height: 100vh; transition: 0.3s; }
        #app { width: 100%; max-width: 550px; padding: 20px; }
        .card { background: var(--card); padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        .theme-toggle { position: absolute; top: 15px; right: 15px; background: none; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; color: var(--text); padding: 5px 10px; font-size: 12px; }
        .progress-bar { height: 6px; background: #e0e0e0; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
        #progress { height: 100%; background: var(--main); width: 0%; transition: 0.4s; }
        .timer { font-size: 18px; font-weight: bold; color: var(--error); text-align: center; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 20px; box-sizing: border-box; background: var(--bg); color: var(--text); font-size: 16px; }
        .q-text { font-size: 18px; font-weight: 500; line-height: 1.5; margin-bottom: 25px; }
        .options { display: grid; gap: 10px; }
        .opt-btn { background: var(--bg); border: 1px solid #ddd; padding: 14px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 15px; color: var(--text); transition: 0.2s; }
        .opt-btn:hover { border-color: var(--main); background: rgba(46, 204, 113, 0.05); }
        .opt-btn.selected { border: 2px solid var(--main); background: rgba(46, 204, 113, 0.1); }
        .opt-btn.correct-anim { background: var(--main) !important; color: white !important; border-color: var(--main) !important; }
        .opt-btn.error-anim { background: var(--error) !important; color: white !important; border-color: var(--error) !important; }
        .btn-check { background: #2c3e50; color: white; border: none; width: 100%; padding: 16px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 25px; text-transform: uppercase; }
        #result-screen { text-align: center; }
        .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 6px solid var(--main); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin: 20px auto; color: var(--main); }
        .mistakes-box { text-align: left; margin-top: 20px; font-size: 14px; border-top: 1px solid #ddd; padding-top: 15px; line-height: 1.6; }
    </style>
</head>
<body>
<div id="app">
    <button class="theme-toggle" onclick="toggleTheme()">Темы</button>
    <div class="card" id="start-screen">
        <h2 style="color: var(--main)">ОБЖ: ПОЛНЫЙ ТРЕНАЖЕР</h2>
        <p>Для начала введите данные студента:</p>
        <input type="text" id="user-name" placeholder="Фамилия Имя Отчество">
        <button class="btn-check" onclick="startQuiz()">Начать тест</button>
    </div>
    <div class="card" id="quiz-screen" style="display: none;">
        <div class="progress-bar"><div id="progress"></div></div>
        <div class="timer" id="timer">20:00</div>
        <div id="quiz-content"></div>
        <button class="btn-check" id="main-btn" onclick="handleNext()">Ответить</button>
    </div>
    <div class="card" id="result-screen" style="display: none;">
        <h2 id="greeting">Ваш результат</h2>
        <div class="score-circle" id="final-score">0/20</div>
        <p>Оценка: <b id="final-grade">-</b></p>
        <div id="mistakes-log" class="mistakes-box"></div>
        <button class="btn-check" onclick="location.reload()">Новый тест</button>
    </div>
</div>

    { q: "Что НЕЛЬЗЯ делать при грозе на открытой местности?", options: ["Стоять под одинокими деревьями и находиться в воде", "Ложиться в низину", "Отключать телефон", "Снимать металлические украшения"], correct: "Стоять под одинокими деревьями и находиться в воде" },
    { q: "Если на водоеме затрещал лед, нужно:", options: ["Немедленно остановиться и скользить назад к берегу, не отрывая ног", "Прыгать на месте", "Бежать вперед как можно быстрее", "Лечь и ждать помощи"], correct: "Немедленно остановиться и скользить назад к берегу, не отрывая ног" },
    { q: "Металлическая ртуть наиболее опасна для организма при:", options: ["Вдыхании невидимых паров через дыхательные пути", "Прикосновении к шарикам ртути", "Визуальном контакте", "Замораживании"], correct: "Вдыхании невидимых паров через дыхательные пути" },
    { q: "Если на человеке загорелась одежда, НЕЛЬЗЯ:", options: ["Бежать", "Ложиться на землю", "Перекатываться", "Накрываться плотной тканью"], correct: "Бежать" },
    { q: "Совокупность обстоятельств, при которых ЧС только намечается, называется:", options: ["Предвестники чрезвычайной ситуации", "Конец света", "Обычный день", "Стихийное бедствие"], correct: "Предвестники чрезвычайной ситуации" },
    { q: "К природным ЧС гидрологического характера относятся:", options: ["Наводнения и цунами", "Землетрясения", "Лесные пожары", "Взрывы на ГЭС"], correct: "Наводнения и цунами" },
    { q: "Выберите вариант, который НЕ относится к техногенным ЧС:", options: ["Извержение вулкана", "Авария на АЭС", "Взрыв на заводе", "Крушение поезда"], correct: "Извержение вулкана" },
    { q: "Выберите вариант, который НЕ относится к природным ЧС:", options: ["Взрыв на складе ГСМ", "Ураган", "Оползень", "Засуха"], correct: "Взрыв на складе ГСМ" },
    { q: "Что из перечисленного НЕ относится к защитным системам автомобиля?", options: ["Автомагнитола", "Ремни безопасности", "Подушки безопасности", "Подголовники"], correct: "Автомагнитола" },
    { q: "Выберите вариант, который НЕ является видом ДТП:", options: ["Техническое обслуживание", "Столкновение", "Опрокидывание", "Наезд на пешехода"], correct: "Техническое обслуживание" },
    { q: "Каких пешеходных переходов НЕ существует в классификации ПДД?", options: ["Воздушных (в значении полета)", "Наземных («зебра»)", "Подземных", "Надземных"], correct: "Воздушных (в значении полета)" },
    { q: "Первоочередные действия внутри дома при угрозе урагана:", options: ["Отойти от окон, отключить приборы и занять безопасное место (коридор, ванную)", "Открыть все окна для проветривания", "Выйти на балкон наблюдать", "Лечь спать"], correct: "Отойти от окон, отключить приборы и занять безопасное место (коридор, ванную)" }
];

let sessionQ = []; let current = 0; let score = 0; let timeLeft = 1200; let timerInt; let selected = null; let mistakes = [];
function shuffle(a) { return a.sort(() => Math.random() - 0.5); }
function toggleTheme() { document.body.dataset.theme = document.body.dataset.theme === "dark" ? "" : "dark"; }
function startQuiz() {
    const name = document.getElementById('user-name').value;
    if(!name) { alert("Введите имя!"); return; }
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    sessionQ = shuffle([...database]).slice(0, 20);
    startTimer(); render();
}
function startTimer() {
    timerInt = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft / 60); let s = timeLeft % 60;
        document.getElementById('timer').innerText = `Осталось: ${m}:${s < 10 ? '0' + s : s}`;
        if(timeLeft <= 0) finish();
    }, 1000);
}
function render() {
    const q = sessionQ[current]; const opts = shuffle([...q.options]);
    selected = null;
    document.getElementById('progress').style.width = (current / 20) * 100 + '%';
    document.getElementById('main-btn').innerText = "ОТВЕТИТЬ";
    const cont = document.getElementById('quiz-content');
    cont.innerHTML = `<div class="q-text">${current + 1}. ${q.q}</div><div class="options">${opts.map(o => `<button class="opt-btn" onclick="select(this)">${o}</button>`).join('')}</div>`;
}
function select(btn) {
    if(document.querySelector('.correct-anim')) return;
    document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected'); selected = btn.innerText;
}
function handleNext() {
    if(!selected && document.getElementById('main-btn').innerText === "ОТВЕТИТЬ") return;
    const btn = document.getElementById('main-btn');
    if(btn.innerText === "ДАЛЕЕ") {
        current++; if(current < 20) render(); else finish();
        return;
    }
    const q = sessionQ[current];
    let isCorrect = selected === q.correct; 
    if(isCorrect) score++; else mistakes.push({q: q.q, c: q.correct});
    document.querySelectorAll('.opt-btn').forEach(b => {
        if(b.innerText === q.correct) b.classList.add('correct-anim');
        if(b.classList.contains('selected') && !isCorrect) b.classList.add('error-anim');
    });
    btn.innerText = "ДАЛЕЕ";
}
function finish() {
    clearInterval(timerInt);
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('final-score').innerText = `${score}/20`;
    let p = (score / 20) * 100;
    let g = p >= 85 ? 5 : (p >= 75 ? 4 : (p >= 50 ? 3 : 2));
    document.getElementById('final-grade').innerText = g;
    if(mistakes.length > 0) {
        let log = "<b>Работа над ошибками:</b><br>";
        mistakes.forEach(m => { log += `⚠️ ${m.q} -> <b>${m.c}</b><br>`; });
        document.getElementById('mistakes-log').innerHTML = log;
    }
}
</script>
