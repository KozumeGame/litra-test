<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пинг-понг · Нео-нуар</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #0a0a0a;
            --fg: #ffffff;
            --dim: #666666;
            --accent: #ff4444;
            --border: #ffffff;
            --gold: #ffd700;
        }

        .light-theme {
            --bg: #f5f5f5;
            --fg: #0a0a0a;
            --dim: #999999;
            --accent: #cc0000;
            --border: #0a0a0a;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            cursor: default;
            transition: background 0.3s;
        }

        #gameContainer {
            position: relative;
            width: 1000px;
            height: 500px;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 4px solid var(--border);
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
            transition: border-color 0.3s;
            display: none;
            background: var(--bg);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: var(--bg);
            color: var(--fg);
            z-index: 10;
            transition: background 0.3s, color 0.3s;
            overflow-y: auto;
            padding: 20px;
            padding-top: 60px;
        }

        .hidden {
            display: none !important;
        }

        .menu-title {
            font-size: 32px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 4px;
            text-align: center;
            flex-shrink: 0;
        }

        .menu-button {
            background: transparent;
            color: var(--fg);
            border: 2px solid var(--fg);
            padding: 12px 30px;
            margin: 6px;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 250px;
            text-align: center;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .menu-button:hover {
            background: var(--fg);
            color: var(--bg);
        }

        .menu-button:active {
            transform: scale(0.95);
        }

        .menu-button.small {
            min-width: auto;
            padding: 8px 15px;
            font-size: 10px;
        }

        .menu-button.shop-btn {
            border-color: #4444ff;
            color: #4444ff;
            min-width: 120px;
        }

        .menu-button.roulette-btn {
            border-color: #ff4444;
            color: #ff4444;
            min-width: 120px;
        }

        .menu-button.codes-btn {
            border-color: #00ff00;
            color: #00ff00;
            min-width: 120px;
        }

        .menu-row {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .theme-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 20;
            background: transparent;
            color: var(--fg);
            border: 1px solid var(--fg);
            padding: 8px 12px;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-button {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 20;
            background: transparent;
            color: var(--fg);
            border: 1px solid var(--fg);
            padding: 8px 12px;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .info-text {
            font-size: 10px;
            line-height: 1.6;
            text-align: center;
            margin: 10px;
            color: var(--dim);
        }

        .shop-section {
            width: 100%;
            max-width: 450px;
            margin-bottom: 20px;
        }

        .shop-section-title {
            font-size: 14px;
            text-align: center;
            margin: 15px 0;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .ability-slot, .shop-item, .achievement-item, .paddle-skin, .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 8px auto;
            padding: 12px;
            border: 1px solid var(--dim);
            width: 100%;
            max-width: 400px;
            justify-content: space-between;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .ability-slot.equipped, .paddle-skin.equipped {
            border-color: var(--fg);
            background: rgba(255, 255, 255, 0.1);
        }

        .achievement-item.unlocked {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .ability-name, .paddle-name {
            font-size: 12px;
            letter-spacing: 1px;
        }

        .ability-desc {
            font-size: 8px;
            color: var(--dim);
            margin-top: 4px;
            line-height: 1.4;
        }

        .shop-price {
            font-size: 12px;
            color: #ffd700;
        }

        .coins-display {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 12px;
            color: #ffd700;
            z-index: 15;
        }

        .category-title {
            font-size: 14px;
            margin: 20px 0 10px;
            letter-spacing: 2px;
            color: var(--accent);
            text-align: center;
            flex-shrink: 0;
        }

        .achievement-reward {
            font-size: 10px;
            color: #ffd700;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 10px;
            width: 100%;
            max-width: 400px;
            justify-content: space-between;
        }

        .setting-label {
            font-size: 12px;
        }

        input[type="range"] {
            width: 200px;
            cursor: pointer;
        }

        .code-input {
            background: transparent;
            color: var(--fg);
            border: 2px solid var(--fg);
            padding: 10px;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: 14px;
            text-align: center;
            width: 300px;
            margin: 20px;
            letter-spacing: 2px;
        }

        .screen::-webkit-scrollbar {
            width: 8px;
        }

        .screen::-webkit-scrollbar-thumb {
            background: var(--dim);
            border-radius: 4px;
        }

        .pause-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            background: var(--bg);
            border: 2px solid var(--fg);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .rarity-common { color: #888888; }
        .rarity-rare { color: #4444ff; }
        .rarity-epic { color: #ff44ff; }
        .rarity-legendary { color: #ffd700; }
        .rarity-secret { 
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8800ff, #ff0088);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .slot-machine {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px;
        }

        .slot {
            width: 80px;
            height: 100px;
            border: 2px solid var(--fg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            background: var(--bg);
            overflow: hidden;
            position: relative;
            transition: all 0.3s;
        }

        .slot.spinning {
            animation: slotShake 0.1s infinite;
        }

        @keyframes slotShake {
            0% { transform: translateY(-5px); }
            50% { transform: translateY(5px); }
            100% { transform: translateY(-5px); }
        }

        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .loading-text {
            font-size: 24px;
            color: #fff;
            animation: blink 1s infinite;
            letter-spacing: 4px;
        }

        .rarity-list-container {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .rarity-btn {
            padding: 10px 15px;
            border: 2px solid;
            cursor: pointer;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: 10px;
            background: transparent;
            transition: all 0.2s;
        }

        .rarity-btn.common { border-color: #888888; color: #888888; }
        .rarity-btn.rare { border-color: #4444ff; color: #4444ff; }
        .rarity-btn.epic { border-color: #ff44ff; color: #ff44ff; }
        .rarity-btn.legendary { border-color: #ffd700; color: #ffd700; }
        .rarity-btn.secret { border-color: #ff0088; color: #ff0088; }

        .rarity-btn.active {
            background: currentColor;
            color: var(--bg);
        }

        .rarity-abilities-list {
            display: none;
            margin: 10px 0;
            width: 100%;
            max-width: 400px;
        }

        .rarity-abilities-list.show {
            display: block;
        }

        .rarity-ability-item {
            padding: 8px;
            border: 1px solid var(--dim);
            margin: 5px 0;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1000" height="500"></canvas>
        
        <button class="theme-toggle" id="themeToggle">🌓 ТЕМА</button>
        <div class="coins-display hidden" id="coinsDisplay">🪙 0</div>
        
        <div class="loading-screen" id="loadingScreen">
            <div class="loading-text">ЗАГРУЗКА...</div>
        </div>
        
        <div class="screen hidden" id="mainMenu">
            <div class="menu-title">ПИНГ-ПОНГ</div>
            <button class="menu-button" onclick="showScreen('modeSelect')">ИГРАТЬ</button>
            <button class="menu-button" onclick="showScreen('inventory')">ИНВЕНТАРЬ</button>
            <button class="menu-button" onclick="showScreen('achievements')">ДОСТИЖЕНИЯ</button>
            <div class="menu-row">
                <button class="menu-button shop-btn" onclick="showScreen('shop')">МАГАЗИН</button>
                <button class="menu-button roulette-btn" onclick="showScreen('roulette')">РУЛЕТКА</button>
            </div>
            <button class="menu-button" onclick="showScreen('challenges')">ИСПЫТАНИЯ</button>
            <button class="menu-button" onclick="showScreen('leaderboard')">ТАБЛИЦА ЛИДЕРОВ</button>
            <button class="menu-button" onclick="showScreen('profile')">ПРОФИЛЬ</button>
            <button class="menu-button" onclick="showScreen('settings')">НАСТРОЙКИ</button>
            <button class="menu-button" onclick="showScreen('about')">ОБ ИГРЕ</button>
            <button class="menu-button codes-btn" onclick="showScreen('codes')">CODES</button>
        </div>
        
        <div class="screen hidden" id="modeSelect">
            <button class="back-button" onclick="showScreen('mainMenu')">← НАЗАД</button>
            <div class="menu-title">РЕЖИМ</div>
            <button class="menu-button" onclick="selectMode('score')">СЧЁТ (до 10)</button>
            <button class="menu-button" onclick="selectMode('hp')">HP (5 жизней)</button>
            <button class="menu-button" onclick="selectMode('nightmare')">💀 КОШМАР</button>
        </div>
        
        <div class="screen hidden" id="difficultySelect">
            <button class="back-button" onclick="showScreen('modeSelect')">← НАЗАД</button>
            <div class="menu-title">СЛОЖНОСТЬ</div>
            <button class="menu-button" onclick="selectDifficulty('easy')">ЛЁГКИЙ</button>
            <button class="menu-button" onclick="selectDifficulty('medium')">СРЕДНИЙ</button>
            <button class="menu-button" onclick="selectDifficulty('hard')">СЛОЖНЫЙ</button>
        </div>
        
        <div class="screen hidden" id="inventory">
            <button class="back-button" onclick="showScreen('mainMenu')">← НАЗАД</button>
            <div class="menu-title">ИНВЕНТАРЬ</div>
            <div id="abilityList"></div>
            <div class="shop-section-title">ДОСКИ</div>
            <div id="paddleList"></div>
        </div>
        
        <div class="screen hidden" id="shop">
            <button class="back-button" onclick="showScreen('mainMenu')">← НАЗАД</button>
            <div class="menu-title">МАГАЗИН</div>
            <div id="shopPaddles"></div>
        </div>
        
        <div class="screen hidden" id="roulette">
            <button class="back-button" onclick="showScreen('mainMenu')">← НАЗАД</button>
            <div class="menu-title">РУЛЕТКА</div>
            <div class="slot-machine">
                <div class="slot" id="slot1">?</div>
                <div class="slot" id="slot2">?</div>
                <div class="slot" id="slot3">?</div>
            </div>
            <button class="menu-button roulette-btn" onclick="spinRoulette()">КРУТИТЬ (100 🪙)</button>
            <div id="rouletteResult" class="info-text"></div>
            
            <div class="rarity-list-container">
                <button class="rarity-btn common" onclick="toggleRarityList('common')">ОБЫЧНЫЕ</button>
                <button class="rarity-btn rare" onclick="toggleRarityList('rare')">РЕДКИЕ</button>
                <button class="rarity-btn epic" onclick="toggleRarityList('epic')">ЭПИЧЕСКИЕ</button>
                <button class="rarity-btn legendary" onclick="toggleRarityList('legendary')">ЛЕГЕНДАРНЫЕ</button>
                <button class="rarity-btn secret" onclick="toggleRarityList('secret')">СЕКРЕТНЫЕ</button>
            </div>
            
            <div id="rarityLists">
                <div class="rarity-abilities-list" id="list-common"></div>
                <div class="rarity-abilities-list" id="list-rare"></div>
                <div class="rarity-abilities-list" id="list-epic"></div>
                <div class="rarity-abilities-list" id="list-legendary"></div>
                <div class="rarity-abilities-list" id="list-secret"></div>
            </div>
        </div>
        
        <div class="screen hidden" id="codes">
            <button class="back-button" onclick="showScreen('mainMenu')">← НАЗАД</button>
            <div class="menu-title">CODES</div>
            <input type="text" class="code-input" id="codeInput" placeholder="ВВЕДИТЕ КОД" maxlength="20">
            <button class="menu-button codes-btn" onclick="redeemCode()">АКТИВИРОВАТЬ</button>
            <div id="codeResult" class="info-text"></div>
        </div>
        
        <div class="screen hidden" id="achievements">
            <button class="back-button" onclick="showScreen('mainMenu')">← НАЗАД</button>
            <div class="menu-title">ДОСТИЖЕНИЯ</div>
            <div id="achievementsList"></div>
        </div>
        
        <div class="screen hidden" id="challenges">
            <button class="back-button" onclick="showScreen('mainMenu')">← НАЗАД</button>
            <div class="menu-title">ИСПЫТАНИЯ</div>
            <div id="challengesList"></div>
        </div>
        
        <div class="screen hidden" id="leaderboard">
            <button class="back-button" onclick="showScreen('mainMenu')">← НАЗАД</button>
            <div class="menu-title">ТАБЛИЦА ЛИДЕРОВ</div>
            <div id="leaderboardList"></div>
        </div>
        
        <div class="screen hidden" id="profile">
            <button class="back-button" onclick="showScreen('mainMenu')">← НАЗАД</button>
            <div class="menu-title">ПРОФИЛЬ</div>
            <div id="profileInfo" class="info-text"></div>
        </div>
        
        <div class="screen hidden" id="settings">
            <button class="back-button" onclick="showScreen('mainMenu')">← НАЗАД</button>
            <div class="menu-title">НАСТРОЙКИ</div>
            <div class="setting-item">
                <span class="setting-label">Громкость</span>
                <input type="range" min="0" max="100" value="50" id="volumeSlider">
            </div>
            <div class="setting-item">
                <span class="setting-label">Чувствительность</span>
                <input type="range" min="50" max="200" value="100" id="sensitivitySlider">
            </div>
            <button class="menu-button" onclick="resetSettings()">СБРОС НАСТРОЕК</button>
            <button class="menu-button" onclick="resetProgress()">СБРОС ПРОГРЕССА</button>
        </div>
        
        <div class="screen hidden" id="about">
            <button class="back-button" onclick="showScreen('mainMenu')">← НАЗАД</button>
            <div class="menu-title">ОБ ИГРЕ</div>
            <div class="info-text">
                ПИНГ-ПОНГ · НЕО-НУАР<br><br>
                Версия: 3.0<br>
                Автор: Kozume
            </div>
        </div>
        
        <div class="screen hidden" id="gameOver">
            <div class="menu-title" id="gameOverTitle">GAME OVER</div>
            <div class="info-text" id="gameOverStats"></div>
            <button class="menu-button" onclick="restartGame()">РЕСТАРТ</button>
            <button class="menu-button" onclick="showScreen('mainMenu')">В МЕНЮ</button>
        </div>
        
        <div class="pause-menu hidden" id="pauseMenu">
            <div class="menu-title">ПАУЗА</div>
            <button class="menu-button" onclick="resumeGame()">ПРОДОЛЖИТЬ</button>
            <button class="menu-button" onclick="exitToMenu()">В МЕНЮ</button>
        </div>
    </div>

    <script>
        // ============ СОСТОЯНИЕ ============
        let gameState = {
            screen: 'mainMenu', mode: 'score', difficulty: 'medium', theme: 'dark',
            coins: 1000, playerHP: 5, aiHP: 5, playerScore: 0, aiScore: 0,
            equippedAbility: null, ownedAbilities: [], equippedPaddle: 'classic',
            ownedPaddles: ['classic'], achievements: [], gameRunning: false,
            gameLoopRunning: false, paused: false,
            settings: { volume: 50, sensitivity: 100, screenShake: true, flashes: true, particles: true, trail: true, pulsation: true },
            stats: { gamesPlayed: 0, wins: 0, losses: 0, totalCoinsEarned: 0, totalTimePlayed: 0, favoriteAbility: null, favoritePaddle: 'classic' }
        };

        let usedCodes = [];
        let sessionRecord = 0;

        const abilities = [
            { id: 'powerstrike', name: 'POWER STRIKE', desc: 'Центр = ускорение ×1.5', rarity: 'common' },
            { id: 'magnet', name: 'MAGNET', desc: 'Мяч притягивается к центру', rarity: 'common' },
            { id: 'absorber', name: 'ABSORBER', desc: 'Отскок замедляет мяч', rarity: 'common' },
            { id: 'curveball', name: 'CURVE BALL', desc: 'Края закручивают мяч', rarity: 'rare' },
            { id: 'ghost', name: 'GHOST', desc: '15% шанс пройти сквозь доску', rarity: 'rare' },
            { id: 'reflector', name: 'REFLECTOR', desc: '+20% скорости при отскоке', rarity: 'rare' },
            { id: 'nuckleball', name: 'NUCKLEBALL', desc: 'Центр = хаотичный полёт', rarity: 'epic' },
            { id: 'shield', name: 'SHIELD', desc: 'Барьер от гола (интервал 25 сек)', rarity: 'epic' },
            { id: 'splitshot', name: 'SPLIT SHOT', desc: 'Раздвоение мяча (интервал 5 сек)', rarity: 'epic' },
            { id: 'timefreeze', name: 'TIME FREEZE', desc: 'Заморозка мяча при ударе', rarity: 'epic' },
            { id: 'berserk', name: 'BERSERK', desc: 'При HP < 3 доска ×1.5', rarity: 'legendary' },
            { id: 'phoenix', name: 'PHOENIX', desc: 'Восстановление HP при HP = 1', rarity: 'legendary' },
            { id: 'offside', name: 'OFFSIDE', desc: '20% шанс отмены гола', rarity: 'legendary' },
            { id: 'mindcontrol', name: 'MIND CONTROL', desc: 'Управление траекторией', rarity: 'secret' },
            { id: 'chaos', name: 'CHAOS', desc: 'Случайная способность при ударе', rarity: 'secret' }
        ];

        const paddles = [
            { id: 'classic', name: 'КЛАССИЧЕСКАЯ', desc: 'Базовая доска', price: 0, color: '#ffffff' },
            { id: 'neon', name: 'НЕОНОВАЯ', desc: 'Светится в темноте', price: 200, color: '#00ff00' },
            { id: 'blood', name: 'КРОВАВАЯ', desc: 'Оставляет красный след', price: 300, color: '#ff0000' },
            { id: 'gold', name: 'ЗОЛОТАЯ', desc: 'Блестит, частицы', price: 500, color: '#ffd700' },
            { id: 'ghost_paddle', name: 'ПРИЗРАЧНАЯ', desc: 'Полупрозрачная', price: 600, color: 'rgba(255,255,255,0.5)' },
            { id: 'fire', name: 'ОГНЕННАЯ', desc: 'Искры при ударе', price: 700, color: '#ff6600' },
            { id: 'cosmic', name: 'КОСМИЧЕСКАЯ', desc: 'Звёзды, неон', price: 1000, color: '#6600ff' },
            { id: 'dragon', name: 'ДРАКОНЬЯ', desc: 'Чешуя, огонь', price: 1200, color: '#00ff00' },
            { id: 'void', name: 'ПУСТОТНАЯ', desc: 'Искажение пространства', price: 1500, color: '#330033' },
            { id: 'rainbow', name: 'РАДУЖНАЯ', desc: 'Меняет цвета', price: 2000, color: 'rainbow' },
            { id: 'chrome', name: 'ХРОМИРОВАННАЯ', desc: 'Зеркальная', price: 2500, color: '#cccccc' },
            { id: 'divine', name: 'БОЖЕСТВЕННАЯ', desc: 'Сияние, лучи', price: 3000, color: '#ffff00' }
        ];

        const leaderboard = [
            { name: 'Amarchik', score: 1487 },
            { name: 'Kozume', score: 1337 },
            { name: 'Ronaldou', score: 999 },
            { name: 'phantom_47', score: 856 },
            { name: 'ne0n_gh0st', score: 743 },
            { name: 'pixel_wolf', score: 619 },
            { name: 'glitch_master', score: 528 },
            { name: 'void_runner', score: 434 },
            { name: 'dark_byte', score: 317 },
            { name: 'error_404', score: 208 }
        ];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;

        // ============ ФУНКЦИИ МЕНЮ ============

            if (screenId === 'leaderboard') updateLeaderboard();
            if (screenId === 'profile') updateProfile();
            canvas.style.display = (screenId === 'game') ? 'block' : 'none';
            document.getElementById('coinsDisplay').classList.toggle('hidden', screenId === 'game');
            updateCoinsDisplay();
        }

        function selectMode(mode) {

        function selectDifficulty(difficulty) {

        function restartGame() { startGame(); }
        function pauseGame() { if (gameState.gameRunning && !gameState.paused) { gameState.paused = true; document.getElementById('pauseMenu').classList.remove('hidden'); } }
        function resumeGame() { gameState.paused = false; document.getElementById('pauseMenu').classList.add('hidden'); }
        function exitToMenu() { gameState.gameRunning = false; gameState.paused = false; document.getElementById('pauseMenu').classList.add('hidden'); showScreen('mainMenu'); }

        function updateInventory() {
            const abilityContainer = document.getElementById('abilityList');
            abilityContainer.innerHTML = '';
            if (gameState.ownedAbilities.length === 0) {
                abilityContainer.innerHTML = '<div class="info-text">Нет способностей</div>';
            } else {
                gameState.ownedAbilities.forEach(abilityId => {
                    const ability = abilities.find(a => a.id === abilityId);
                    if (!ability) return;
                    const isEquipped = gameState.equippedAbility === abilityId;
                    const slot = document.createElement('div');
                    slot.className = 'ability-slot' + (isEquipped ? ' equipped' : '');
                    slot.innerHTML = `<div><div class="ability-name rarity-${ability.rarity}">${ability.name}</div><div class="ability-desc">${ability.desc}</div></div><button class="menu-button small" onclick="equipAbility('${ability.id}')">${isEquipped ? '✓' : 'ВЫБРАТЬ'}</button>`;
                    abilityContainer.appendChild(slot);
                });
            }
            const paddleContainer = document.getElementById('paddleList');
            paddleContainer.innerHTML = '';
            gameState.ownedPaddles.forEach(paddleId => {
                const paddle = paddles.find(p => p.id === paddleId);
                if (!paddle) return;
                const isEquipped = gameState.equippedPaddle === paddleId;
                const slot = document.createElement('div');
                slot.className = 'paddle-skin' + (isEquipped ? ' equipped' : '');
                slot.innerHTML = `<div><div class="paddle-name">${paddle.name}</div><div class="ability-desc">${paddle.desc}</div></div><button class="menu-button small" onclick="equipPaddle('${paddle.id}')">${isEquipped ? '✓' : 'ВЫБРАТЬ'}</button>`;
                paddleContainer.appendChild(slot);

            const container = document.getElementById('shopPaddles');
            container.innerHTML = '';
            paddles.forEach(paddle => {
                const isOwned = gameState.ownedPaddles.includes(paddle.id);
                const item = document.createElement('div');

                item.innerHTML = `<div><div class="paddle-name">${paddle.name}</div><div class="ability-desc">${paddle.desc}</div></div>${isOwned ? '<div class="shop-price">✓ КУПЛЕНО</div>' : `<button class="menu-button small" onclick="buyPaddle('${paddle.id}')">🪙 ${paddle.price}</button>`}`;

        function buyPaddle(id) {
            const paddle = paddles.find(p => p.id === id);
            if (gameState.coins >= paddle.price && !gameState.ownedPaddles.includes(id)) {
                gameState.coins -= paddle.price;
                gameState.ownedPaddles.push(id);
                updateShop();

        // ============ РУЛЕТКА ============
        function buildRarityLists() {
            const rarities = ['common', 'rare', 'epic', 'legendary', 'secret'];
            const rarityNames = { common: 'ОБЫЧНЫЕ', rare: 'РЕДКИЕ', epic: 'ЭПИЧЕСКИЕ', legendary: 'ЛЕГЕНДАРНЫЕ', secret: 'СЕКРЕТНЫЕ' };
            rarities.forEach(rarity => {
                const list = document.getElementById(`list-${rarity}`);
                list.innerHTML = '';
                const abilitiesOfRarity = abilities.filter(a => a.rarity === rarity);
                abilitiesOfRarity.forEach(ability => {
                    const item = document.createElement('div');
                    item.className = 'rarity-ability-item';
                    item.innerHTML = `<span class="rarity-${rarity}">${ability.name}</span> — ${ability.desc}`;
                    list.appendChild(item);
                });
            });
        }

        function toggleRarityList(rarity) {
            const list = document.getElementById(`list-${rarity}`);
            const btn = document.querySelector(`.rarity-btn.${rarity}`);
            const allLists = document.querySelectorAll('.rarity-abilities-list');
            const allBtns = document.querySelectorAll('.rarity-btn');
            
            if (list.classList.contains('show')) {
                list.classList.remove('show');
                btn.classList.remove('active');
            } else {
                allLists.forEach(l => l.classList.remove('show'));
                allBtns.forEach(b => b.classList.remove('active'));
                list.classList.add('show');
                btn.classList.add('active');
            }
        }

        function spinRoulette() {
            if (gameState.coins < 100) {
                document.getElementById('rouletteResult').textContent = 'Недостаточно монет!';
                return;
            }
            gameState.coins -= 100;
            updateCoinsDisplay();
            playCoinSound();
            const slots = ['slot1', 'slot2', 'slot3'];
            const rarities = ['common', 'rare', 'epic', 'legendary', 'secret'];
            const weights = [40, 30, 20, 8, 2];
            const results = [];
            slots.forEach((slotId, index) => {
                const slot = document.getElementById(slotId);
                slot.textContent = '';
                slot.className = 'slot spinning';
                let spinInterval = setInterval(() => {
                    const r = rarities[Math.floor(Math.random() * rarities.length)];
                    slot.textContent = getRaritySymbol(r);
                    slot.className = 'slot spinning rarity-' + r;
                    playPixelSound(600 + Math.random() * 400, 0.02, 0.08);
                }, 100);
                setTimeout(() => {
                    clearInterval(spinInterval);
                    const rarity = weightedRandom(rarities, weights);
                    results.push(rarity);
                    slot.textContent = getRaritySymbol(rarity);
                    slot.className = 'slot rarity-' + rarity;
                    playPixelSound(800, 0.1, 0.3);
                    if (index === 2) checkRouletteResult(results);
                }, 1500 + index * 800);
            });
        }

        function weightedRandom(items, weights) {
            const total = weights.reduce((a, b) => a + b, 0);
            let r = Math.random() * total;
            for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
            return items[0];
        }

        function getRaritySymbol(rarity) {
            return { common: '●', rare: '◆', epic: '▲', legendary: '★', secret: '✦' }[rarity] || '?';
        }

        function checkRouletteResult(results) {
            const resultDiv = document.getElementById('rouletteResult');
            if (Math.random() < 0.05) { resultDiv.textContent = '😅 Пусто!'; return; }
            if (results[0] === results[1] && results[1] === results[2]) {
                const rarity = results[0];
                const abilitiesOfRarity = abilities.filter(a => a.rarity === rarity);
                const ability = abilitiesOfRarity[Math.floor(Math.random() * abilitiesOfRarity.length)];
                if (gameState.ownedAbilities.includes(ability.id)) {
                    const comp = { common: 50, rare: 100, epic: 200, legendary: 500, secret: 1000 }[rarity];
                    gameState.coins += comp;
                    resultDiv.textContent = `Дубликат! +${comp} 🪙`;
                } else {
                    gameState.ownedAbilities.push(ability.id);
                    resultDiv.textContent = `Выигрыш: ${ability.name}!`;
                    playCoinSound();
                }
            } else {
                const order = ['common', 'rare', 'epic', 'legendary', 'secret'];
                const lowest = results.reduce((a, b) => order.indexOf(a) < order.indexOf(b) ? a : b);
                const consolation = { common: 25, rare: 50, epic: 75, legendary: 100, secret: 150 }[lowest];
                gameState.coins += consolation;
                resultDiv.textContent = `Утешительный приз: +${consolation} 🪙`;
            }
            updateCoinsDisplay();
        }

        // ============ ЗВУКИ ============
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playPixelSound(freq = 440, dur = 0.05, vol = 0.3, type = 'square') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol * (gameState.settings.volume / 100), audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + dur);
        }

        function playCoinSound() {
            playPixelSound(800, 0.1, 0.2);
            setTimeout(() => playPixelSound(1000, 0.1, 0.2), 100);
        }

        function playButtonSound() {
            playPixelSound(400, 0.03, 0.1);
        }

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('menu-button') || e.target.classList.contains('back-button') || e.target.classList.contains('theme-toggle') || e.target.classList.contains('rarity-btn')) {
                playButtonSound();
            }
        });

        document.getElementById('themeToggle').addEventListener('click', () => {
            gameState.theme = gameState.theme === 'dark' ? 'light' : 'dark';
            document.body.classList.toggle('light-theme', gameState.theme === 'light');
            document.getElementById('themeToggle').textContent = gameState.theme === 'dark' ? '🌓 ТЕМА' : '☀️ ТЕМА';
        });

        document.addEventListener('keydown', (e) => {

                if (gameState.paused) resumeGame();
                else pauseGame();
            }
        });

        // ============ ИГРА ============
        let mouseY = 250;

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleY = canvas.height / rect.height;
            mouseY = (e.clientY - rect.top) * scaleY * (gameState.settings.sensitivity / 100);
            initAudio();
        });

        canvas.addEventListener('click', initAudio);

        function resetBall(direction) {
            ball.x = 500;
            ball.y = 250;
            ball.baseSpeed = Math.max(4, ball.baseSpeed - 2);
            ball.speedX = ball.baseSpeed * direction;
            ball.speedY = (Math.random() - 0.5) * 4;
            ballSpeed = ball.baseSpeed;
            ball.speedMultiplier = 1;
            ball.shieldActive = false;
            ball.nuckleball = false;
            ball.curveball = false;
            ball.mindControlled = false;
            ball.phantom = false;
            trail = [];
        }

        function spawnPowerup() {
            powerupSpawnTimer++;
            const rate = gameState.mode === 'nightmare' ? 600 : 300;
            if (powerupSpawnTimer > rate && powerups.length < 3) {
                powerupSpawnTimer = 0;
                const types = ['tremor', 'speed', 'slow', 'expand', 'split', 'reverse', 'gold'];
                powerups.push({ x: 300 + Math.random() * 400, y: 50 + Math.random() * 400, type: types[Math.floor(Math.random() * types.length)], size: 20, life: 300 });
            }
        }

        function updatePowerups() {
            powerups.forEach((p, i) => {
                p.life--;
                if (ball.x < p.x + p.size && ball.x + ball.size > p.x && ball.y < p.y + p.size && ball.y + ball.size > p.y) {
                    activatePowerup(p.type);
                    powerups.splice(i, 1);
                }
                if (p.life <= 0) powerups.splice(i, 1);
            });
            if (activeEffects.speed > 0) { activeEffects.speed--; if (activeEffects.speed <= 0) ball.speedMultiplier = 1; }
            if (activeEffects.slow > 0) { activeEffects.slow--; if (activeEffects.slow <= 0) ball.speedMultiplier = 1; }
            if (activeEffects.expand > 0) { activeEffects.expand--; if (activeEffects.expand <= 0) playerPaddle.height = 80; }
            if (activeEffects.gold > 0) { activeEffects.gold--; if (activeEffects.gold <= 0) scoreMultiplier = 1; }
        }

        function activatePowerup(type) {
            playPixelSound(600, 0.1, 0.3);
            switch(type) {
                case 'tremor':
                    screenShake = 20;
                    flashEffect = 1;
                    playerPaddle.y += (Math.random() - 0.5) * 60;
                    aiPaddle.y += (Math.random() - 0.5) * 60;
                    playerPaddle.y = Math.max(0, Math.min(canvas.height - playerPaddle.height, playerPaddle.y));
                    aiPaddle.y = Math.max(0, Math.min(canvas.height - aiPaddle.height, aiPaddle.y));
                    break;
                case 'speed': ball.speedMultiplier = 1.5; activeEffects.speed = 180; break;
                case 'slow': ball.speedMultiplier = 0.5; activeEffects.slow = 180; break;
                case 'expand': playerPaddle.height = 120; activeEffects.expand = 300; break;
                case 'split': ball.phantom = true; ball.phantomTime = 120; break;
                case 'reverse': ball.speedX = -ball.speedX; break;
                case 'gold': scoreMultiplier = 2; activeEffects.gold = 600; break;
            }
        }

        function spawnObstacle() {
            obstacleSpawnTimer++;
            const rate = gameState.mode === 'nightmare' ? 400 : 600;
            if (obstacleSpawnTimer > rate && obstacles.length < 3) {
                obstacleSpawnTimer = 0;
                const height = [100, 150, 200][Math.floor(Math.random() * 3)];
                obstacles.push({ x: 350 + Math.random() * 300, y: 50 + Math.random() * (400 - height), width: 8, height: height, warning: 120, active: false, life: 480 });
            }
        }

        function updateObstacles() {
            obstacles.forEach((o, i) => {
                if (o.warning > 0) o.warning--;
                else if (!o.active) o.active = true;
                if (o.active) {
                    o.life--;
                    if (ball.x < o.x + o.width && ball.x + ball.size > o.x && ball.y < o.y + o.height && ball.y + ball.size > o.y) {
                        const ballCenter = ball.x + ball.size / 2;
                        const wallCenter = o.x + o.width / 2;
                        if (ballCenter < wallCenter) { ball.x = o.x - ball.size; ball.speedX = -Math.abs(ball.speedX); }
                        else { ball.x = o.x + o.width; ball.speedX = Math.abs(ball.speedX); }
                        createParticles(ball.x, ball.y, 8);
                        playPixelSound(250, 0.03, 0.2);
                    }
                }
                if (o.life <= 0) obstacles.splice(i, 1);
            });
        }

        function updateAI() {
            let speed, error;
            if (gameState.difficulty === 'easy') { speed = 3; error = 70; }
            else if (gameState.difficulty === 'medium') { speed = 5; error = 40; }
            else { speed = 7; error = 15; }
            aiPaddle.speed = speed;
            let targetY = ball.y - aiPaddle.height / 2;
            obstacles.forEach(o => {
                if (o.active && ball.speedX > 0 && ball.y + ball.size > o.y && ball.y < o.y + o.height && ball.x < o.x && ball.x + ball.speedX * 10 > o.x) {
                    targetY = o.y - aiPaddle.height / 2;
                }
            });
            if (ball.speedX > 0 && ball.x > 500) {
                targetY += (Math.random() - 0.5) * error;
                const dy = targetY - aiPaddle.y;
                if (Math.abs(dy) > 3) aiPaddle.y += Math.sign(dy) * aiPaddle.speed;
            } else if (ball.speedX < 0) {
                const dy = 250 - aiPaddle.y;
                if (Math.abs(dy) > 3) aiPaddle.y += Math.sign(dy) * aiPaddle.speed * 0.4;
            }
            aiPaddle.y = Math.max(0, Math.min(canvas.height - aiPaddle.height, aiPaddle.y));
        }

        function updateBall() {
            if (hitStop > 0) { hitStop--; return; }
            
            // Cooldowns
            if (ball.shieldCooldown > 0) ball.shieldCooldown--;
            if (ball.splitCooldown > 0) ball.splitCooldown--;
            if (ball.chaosCooldown > 0) ball.chaosCooldown--;

            const cx = ball.speedX * ball.speedMultiplier;
            const cy = ball.speedY * ball.speedMultiplier;
            ball.x += cx;
            ball.y += cy;

            // Magnet: притягивает мяч к центру доски
            if (gameState.equippedAbility === 'magnet' && ball.speedX < 0 && ball.x < 300) {
                const paddleCenter = playerPaddle.y + playerPaddle.height / 2;
                const ballCenter = ball.y + ball.size / 2;
                if (Math.abs(paddleCenter - ballCenter) > 20) {
                    ball.y += (paddleCenter - ballCenter) * 0.02;
                }
            }

            if (gameState.equippedAbility === 'mindcontrol' && ball.mindControlled) {
                ball.y = mouseY - ball.size / 2;
            }

            if (ball.phantom) {
                ball.phantomTime--;
                if (ball.phantomTime <= 0) ball.phantom = false;
            }

            if (gameState.settings.trail) {
                trail.push({ x: ball.x, y: ball.y, life: 10 });
                if (trail.length > 20) trail.shift();
                trail.forEach(t => t.life--);
                trail = trail.filter(t => t.life > 0);
            }

            if (ball.y <= 0 || ball.y + ball.size >= canvas.height) {
                ball.speedY = -ball.speedY;
                ball.y = Math.max(0, Math.min(canvas.height - ball.size, ball.y));
                createParticles(ball.x, ball.y, 5);
                playPixelSound(300, 0.03, 0.2);
                ballSpeed *= 1.05;
            }

            // Отскок от доски игрока
            if (ball.x <= playerPaddle.x + playerPaddle.width && ball.x + ball.size >= playerPaddle.x && ball.y + ball.size >= playerPaddle.y && ball.y <= playerPaddle.y + playerPaddle.height) {
                if (gameState.equippedAbility === 'ghost' && Math.random() < 0.15) {
                    // Проходим сквозь
                } else {
                    ball.x = playerPaddle.x + playerPaddle.width;
                    ball.speedX = Math.abs(cx);
                    const hitPos = (ball.y + ball.size / 2 - playerPaddle.y) / playerPaddle.height;
                    
                    if (gameState.equippedAbility === 'absorber' && Math.abs(hitPos - 0.5) < 0.2) {
                        ball.speedX *= 0.8;
                        ball.speedY *= 0.8;
                    } else {
                        ball.speedY = (hitPos - 0.5) * 10;
                        ball.speedX *= 1.05;
                    }
                    
                    if (gameState.equippedAbility === 'reflector') {
                        ball.speedX *= 1.2;
                        ball.speedY *= 1.2;
                    }
                    if (gameState.equippedAbility === 'powerstrike' && Math.abs(hitPos - 0.5) < 0.3) {
                        ball.speedX *= 1.5;
                        flashEffect = 0.5;
                    }
                    if (gameState.equippedAbility === 'nuckleball' && Math.abs(hitPos - 0.5) < 0.3) {
                        ball.nuckleball = true;
                        ball.nuckleballTime = 30;
                    }
                    if (gameState.equippedAbility === 'mindcontrol' && Math.abs(hitPos - 0.5) < 0.1) {
                        ball.mindControlled = true;
                    }
                    if (gameState.equippedAbility === 'curveball' && Math.abs(hitPos - 0.5) > 0.3) {
                        ball.curveball = true;
                    }
                    if (gameState.equippedAbility === 'splitshot' && ball.splitCooldown <= 0 && Math.random() < 0.3) {
                        ball.phantom = true;
                        ball.phantomTime = 60;
                        ball.splitCooldown = 300; // 5 секунд
                    }
                    if (gameState.equippedAbility === 'timefreeze') {
                        hitStop = 5;
                    }
                    if (gameState.equippedAbility === 'chaos' && ball.chaosCooldown <= 0) {
                        const effects = ['powerstrike', 'nuckleball', 'curveball', 'splitshot'];
                        const effect = effects[Math.floor(Math.random() * effects.length)];
                        if (effect === 'powerstrike') ball.speedX *= 1.5;
                        if (effect === 'nuckleball') { ball.nuckleball = true; ball.nuckleballTime = 30; }
                        if (effect === 'curveball') ball.curveball = true;
                        if (effect === 'splitshot') { ball.phantom = true; ball.phantomTime = 60; }
                        ball.chaosCooldown = 180; // 3 секунды
                    }
                    if (gameState.equippedAbility === 'berserk' && gameState.playerHP < 3) {
                        playerPaddle.speedMultiplier = 1.5;
                    }
                    if (gameState.equippedAbility === 'shield' && ball.shieldCooldown <= 0) {
                        ball.shieldActive = true;
                        ball.shieldCooldown = 1500; // 25 секунд
                    }

                    createParticles(ball.x, ball.y, 15);
                    playPixelSound(500, 0.04, 0.3);
                    ballSpeed = Math.abs(ball.speedX * ball.speedMultiplier);
                    combo++;
                }
            }

            // Отскок от доски ИИ
            if (ball.x + ball.size >= aiPaddle.x && ball.x <= aiPaddle.x + aiPaddle.width && ball.y + ball.size >= aiPaddle.y && ball.y <= aiPaddle.y + aiPaddle.height) {
                ball.x = aiPaddle.x - ball.size;
                ball.speedX = -Math.abs(cx) * 1.05;
                const hitPos = (ball.y + ball.size / 2 - aiPaddle.y) / aiPaddle.height;
                ball.speedY = (hitPos - 0.5) * 10;
                createParticles(ball.x, ball.y, 15);
                playPixelSound(500, 0.04, 0.3);
                ballSpeed = Math.abs(ball.speedX * ball.speedMultiplier);
                combo = 0;
            }

            if (ball.nuckleball) {
                ball.nuckleballTime--;
                ball.y += Math.sin(ball.x * 0.1) * 2;
                if (ball.nuckleballTime <= 0) {
                    ball.nuckleball = false;
                    ball.speedY = (Math.random() - 0.5) * 15;
                }
            }

            if (ball.curveball) {
                ball.y += Math.sin(ball.x * 0.05) * 3;
            }

            // Проверка гола с учётом Shield
            if (ball.x < -ball.size) {
                if (gameState.equippedAbility === 'shield' && ball.shieldActive) {
                    // Щит блокирует гол
                    ball.shieldActive = false;
                    ball.x = playerPaddle.x + playerPaddle.width;
                    ball.speedX = Math.abs(ball.speedX);
                    createParticles(ball.x, ball.y, 20);
                    playPixelSound(800, 0.1, 0.4);
                } else {
                    handleGoal(false);
                }
            }

            if (ball.x > canvas.width + ball.size) {
                handleGoal(true);
            }

            ballSpeed = Math.max(ballSpeed, Math.abs(ball.speedX * ball.speedMultiplier));
        }

        function handleGoal(playerScored) {
            if (gameState.equippedAbility === 'offside' && !playerScored && Math.random() < 0.2) {
                ball.x = 500;
                ball.y = 250;
                ball.speedX = -Math.abs(ball.speedX);
                return;
            }

            if (playerScored) {
                if (gameState.mode === 'score' || gameState.mode === 'nightmare') {
                    gameState.playerScore += scoreMultiplier;
                    if (gameState.playerScore > sessionRecord) sessionRecord = gameState.playerScore;
                    if (gameState.playerScore >= 10) gameOver(true);
                } else {
                    gameState.aiHP--;
                    if (gameState.aiHP <= 0) gameOver(true);
                }
            } else {
                if (gameState.mode === 'score' || gameState.mode === 'nightmare') {
                    gameState.aiScore++;
                    if (gameState.aiScore >= 10) gameOver(false);
                } else {
                    gameState.playerHP--;
                    if (gameState.equippedAbility === 'phoenix' && gameState.playerHP === 1) {
                        gameState.playerHP = 2;
                        gameState.equippedAbility = null;
                    }
                    if (gameState.playerHP <= 0) gameOver(false);
                }
            }

            resetBall(playerScored ? -1 : 1);
        }

        function createParticles(x, y, count) {
            if (!gameState.settings.particles) return;
            for (let i = 0; i < count; i++) {
                particles.push({ x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 20 });
            }
        }

        function gameOver(playerWon) {
            gameState.gameRunning = false;
            gameState.stats.gamesPlayed++;
            const title = document.getElementById('gameOverTitle');
            const stats = document.getElementById('gameOverStats');
            if (playerWon) {
                title.textContent = 'ПОБЕДА!';
                title.style.color = '#ffd700';
                gameState.stats.wins++;
                winsStreak++;
            } else {
                title.textContent = 'ПОРАЖЕНИЕ';
                title.style.color = '#ff4444';
                gameState.stats.losses++;
                winsStreak = 0;
            }
            stats.textContent = gameState.mode === 'hp' ? `HP: ${gameState.playerHP} - ${gameState.aiHP}` : `СЧЁТ: ${gameState.playerScore} - ${gameState.aiScore}`;
            const coinsEarned = Math.floor(gameTime / 10) + (playerWon ? 50 : 10);
            gameState.coins += coinsEarned;
            gameState.stats.totalCoinsEarned += coinsEarned;
            gameState.stats.totalTimePlayed += gameTime;
            updateCoinsDisplay();
            showScreen('gameOver');
        }

        function getPaddleColor(id) {
            const paddle = paddles.find(p => p.id === id);
            if (!paddle) return '#ffffff';
            if (paddle.color === 'rainbow') return `hsl(${(Date.now() / 10) % 360}, 100%, 50%)`;
            return paddle.color;
        }

        function draw() {
            const rootStyles = getComputedStyle(document.documentElement);
            let bgColor = rootStyles.getPropertyValue('--bg').trim() || '#0a0a0a';
            const fgColor = rootStyles.getPropertyValue('--fg').trim() || '#ffffff';

            if (gameState.settings.pulsation && hitStop > 0) {
                const pulse = Math.sin(gameTime * 0.5) * 0.1;
                const brightness = gameState.theme === 'dark' ? 10 + pulse * 10 : 245 + pulse * 10;
                bgColor = `rgb(${brightness}, ${brightness}, ${brightness})`;
            }

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (screenShake > 0 && gameState.settings.screenShake) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
                screenShake *= 0.9;
            }

            if (flashEffect > 0 && gameState.settings.flashes) {
                ctx.fillStyle = `rgba(255, 0, 0, ${flashEffect * 0.3})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                flashEffect *= 0.95;
            }

            ctx.strokeStyle = fgColor;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            obstacles.forEach(o => {
                ctx.fillStyle = o.warning > 0 ? 'rgba(128,128,128,0.5)' : fgColor;
                ctx.fillRect(o.x, o.y, o.width, o.height);
            });

            powerups.forEach(p => {
                ctx.fillStyle = { tremor: '#ff4444', speed: '#ffff00', slow: '#4444ff', expand: '#44ff44', split: '#ff44ff', reverse: '#ff8800', gold: '#ffd700' }[p.type] || '#fff';
                ctx.globalAlpha = Math.min(1, p.life / 50);
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.globalAlpha = 1;
            });

            if (gameState.settings.trail) {
                trail.forEach(t => {
                    ctx.fillStyle = fgColor;
                    ctx.globalAlpha = t.life / 10 * 0.5;
                    ctx.beginPath();
                    ctx.arc(t.x + ball.size / 2, t.y + ball.size / 2, ball.size / 2 * (t.life / 10), 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
            }

            particles.forEach(p => {
                ctx.fillStyle = fgColor;
                ctx.globalAlpha = p.life / 20;
                ctx.fillRect(p.x, p.y, 4, 4);
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
            });
            ctx.globalAlpha = 1;
            particles = particles.filter(p => p.life > 0);

            let ballColor = scoreMultiplier === 2 ? '#ffd700' : fgColor;
            ctx.fillStyle = ballColor;
            if (ball.phantom) ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.arc(ball.x + ball.size / 2, ball.y + ball.size / 2, ball.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.fillStyle = getPaddleColor(gameState.equippedPaddle);
            ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.width, playerPaddle.height);

            if (ball.shieldActive) {
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(playerPaddle.x - 5, playerPaddle.y - 5, playerPaddle.width + 10, playerPaddle.height + 10);
            }

            ctx.fillStyle = fgColor;
            ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.width, aiPaddle.height);

            if (ballSpeed < 8) {
                ctx.strokeStyle = fgColor;
                ctx.globalAlpha = (8 - ballSpeed) / 3 * 0.3;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(ball.x + ball.size / 2, ball.y + ball.size / 2);
                ctx.lineTo(ball.x + ball.speedX * 20, ball.y + ball.speedY * 20);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.globalAlpha = 1;
            }

            ctx.font = '32px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.fillStyle = fgColor;
            ctx.fillText(gameState.playerScore, canvas.width / 4, 50);
            ctx.fillText(gameState.aiScore, canvas.width * 3 / 4, 50);

            if (gameState.mode === 'hp') {
                ctx.font = '20px "Press Start 2P", monospace';
                ctx.fillText('❤️'.repeat(gameState.playerHP), canvas.width / 4, 90);
                ctx.fillText('❤️'.repeat(gameState.aiHP), canvas.width * 3 / 4, 90);
            }

            ctx.font = '10px "Press Start 2P", monospace';
            ctx.fillStyle = fgColor;
            ctx.globalAlpha = 0.7;
            ctx.fillText(`СЧЁТ: ${gameState.playerScore} - ${gameState.aiScore}`, canvas.width / 2, 30);
            ctx.fillText(`РЕКОРД: ${sessionRecord}`, canvas.width / 2, 50);
            ctx.globalAlpha = 0.5;
            let infoText = `СКОРОСТЬ: ${Math.floor(ballSpeed)}`;
            if (scoreMultiplier === 2) infoText += ' | ×2';
            ctx.fillText(infoText, canvas.width / 2, canvas.height - 20);
            ctx.globalAlpha = 1;

            ctx.setTransform(1, 0, 0, 1, 0, 0);
        }

        function gameLoop() {
            if (gameState.gameRunning && !gameState.paused) {
                gameTime++;
                playerPaddle.y = mouseY - playerPaddle.height / 2;
                playerPaddle.y = Math.max(0, Math.min(canvas.height - playerPaddle.height, playerPaddle.y));
                updateAI();
                updateBall();
                spawnPowerup();
                updatePowerups();
                spawnObstacle();
                updateObstacles();
                draw();
            }
            requestAnimationFrame(gameLoop);
        }

        // ============ ИНИЦИАЛИЗАЦИЯ ============
        setTimeout(() => {
            document.getElementById('loadingScreen').classList.add('hidden');
            showScreen('mainMenu');
        }, 2000);

        updateCoinsDisplay();
    </script>
</body>
</html>
