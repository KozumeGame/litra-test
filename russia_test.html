<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Тест-тренажёр: Русский язык (1 курс) — Зачёт</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* чтобы случайно не выделить текст при клике */
        }

        body {
            background: linear-gradient(145deg, #eef2f7 0%, #d4dfe9 100%);
            font-family: 'Segoe UI', 'Roboto', 'Inter', system-ui, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 48px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            transition: all 0.2s;
        }

        .test-header {
            background: #1e3c5c;
            padding: 20px 32px;
            color: white;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 15px;
        }

        .title h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .title p {
            opacity: 0.85;
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .stats {
            background: #0f2a42;
            padding: 10px 24px;
            border-radius: 60px;
            display: flex;
            gap: 30px;
            font-weight: 600;
        }

        .stats div {
            text-align: center;
        }

        .stats .label {
            font-size: 0.7rem;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .stats .value {
            font-size: 1.7rem;
            font-weight: 700;
            line-height: 1;
        }

        #timer {
            color: #ffdf8c;
        }

        .test-body {
            padding: 30px 32px 20px;
        }

        .question-card {
            background: white;
            border-radius: 28px;
            padding: 22px 28px;
            margin-bottom: 28px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
            border: 1px solid #e9edf2;
            transition: 0.1s;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0a2f44;
            margin-bottom: 20px;
            padding-left: 12px;
            border-left: 5px solid #2c7da0;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-left: 8px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #fafcff;
            padding: 10px 18px;
            border-radius: 60px;
            transition: 0.1s;
            cursor: pointer;
            border: 1px solid #e2e8f0;
        }

        .option:hover {
            background: #eef3fc;
            border-color: #b9d0e7;
        }

        input[type="radio"], input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #2c7da0;
            cursor: pointer;
            pointer-events: auto;
        }

        .option-text {
            font-size: 1rem;
            color: #1e2f3e;
            line-height: 1.4;
            flex: 1;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin: 10px 32px 30px 32px;
        }

        button {
            background: #1e3c5c;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        button:hover {
            background: #0f2a42;
            transform: scale(0.98);
        }

        .finish-btn {
            background: #c44536;
        }

        .finish-btn:hover {
            background: #a13325;
        }

        .reset-btn {
            background: #3b6e4c;
        }

        .mistake-btn {
            background: #2c7da0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            max-width: 750px;
            width: 90%;
            max-height: 85vh;
            border-radius: 40px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 40px rgba(0,0,0,0.3);
            animation: fadeInUp 0.2s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .modal-header {
            background: #1e3c5c;
            color: white;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.5rem;
        }

        .close-modal {
            background: none;
            font-size: 28px;
            padding: 0;
            width: 40px;
            box-shadow: none;
            color: white;
        }

        .close-modal:hover {
            background: none;
            transform: scale(1.1);
            color: #ffb347;
        }

        .mistakes-list {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }

        .mistake-item {
            background: #fff7f0;
            border-left: 6px solid #c44536;
            padding: 16px;
            margin-bottom: 18px;
            border-radius: 20px;
        }

        .mistake-question {
            font-weight: 700;
            margin-bottom: 10px;
            color: #1f3b4c;
        }

        .mistake-detail {
            font-size: 0.9rem;
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .your-answer {
            color: #b91c1c;
            background: #ffe6e6;
            padding: 4px 12px;
            border-radius: 24px;
        }

        .correct-answer {
            color: #2b6e3c;
            background: #e0f2e5;
            padding: 4px 12px;
            border-radius: 24px;
        }

        footer {
            background: #f0f4f9;
            padding: 12px;
            text-align: center;
            font-size: 0.75rem;
            color: #5b6f82;
        }

        @media (max-width: 680px) {
            .test-body {
                padding: 20px;
            }
            .question-card {
                padding: 16px;
            }
            .stats {
                padding: 5px 15px;
            }
        }
    </style>
</head>
<body>

<div class="test-container">
    <div class="test-header">
        <div class="title">
            <h1>📖 Русский язык · Тренажёр зачёт</h1>
            <p>1 курс (на базе 9 класса) · 20 случайных вопросов · все ответы проверены</p>
        </div>
        <div class="stats">
            <div>⏱️ <span class="label">таймер</span><br><span class="value" id="timer">20:00</span></div>
            <div>📋 <span class="label">баллы</span><br><span class="value" id="scoreDisplay">0</span><span style="font-size:1rem;">/100</span></div>
        </div>
    </div>
    <div class="test-body" id="questionsArea">
        <div style="text-align:center; padding: 40px;">Загрузка теста...</div>
    </div>
    <div class="action-bar">
        <button class="reset-btn" id="resetTestBtn">🔄 Новый тест</button>
        <button class="finish-btn" id="finishTestBtn">✅ Закончить и проверить</button>
        <button class="mistake-btn" id="showMistakesBtn" style="display:none;">📖 Работа над ошибками</button>
    </div>
    <footer>✔️ 5 баллов за каждый правильный ответ. Максимум — 100.</footer>
</div>

<div id="mistakeModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>📌 Работа над ошибками</h2>
            <button class="close-modal" id="closeModalBtn">✕</button>
        </div>
        <div class="mistakes-list" id="mistakesList"></div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // БАЗА ВОПРОСОВ (88 заданий) с ПРАВИЛЬНЫМИ ОТВЕТАМИ (согласно вашим +)
    // --------------------------------------------------------------
    const FULL_BANK = [];

    function addQuestion(id, text, optionsArray, correctIndices, multiple) {
        FULL_BANK.push({
            id: id,
            text: text,
            options: optionsArray.map((opt, idx) => ({ value: String(idx), text: opt })),
            correct: correctIndices.map(i => String(i)),
            multiple: multiple
        });
    }

    // ============= ЗАПОЛНЕНИЕ (сверено с вашими ответами) ============
    addQuestion(1, "Укажите неверное утверждение.", 
        ["в современном русском звуков больше, чем букв", "в русском языке 10 гласных звуков и 10 гласных букв", "гласные звуки делятся на ударные и безударные", "«алфавит» и «азбука» означает одно и то же"], [1], false);
    addQuestion(2, "Укажите слово, в котором букв столько же, сколько и звуков.", ["юла", "юннаты", "съест", "болеть"], [2], false);
    addQuestion(3, "Найдите слово, написание которого не совпадает с произношением.", ["чтобы", "взял", "азбука", "новый"], [0], false);
    addQuestion(4, "Найдите слова с непроизносимыми согласными в корне.", ["интерес...ный", "окрес...ый", "сверс...ник", "ровес...ник"], [1,2,3], true);
    addQuestion(5, "Укажите, в каких словах надо писать ъ.", ["пред...юбилейный", "с...уживались", "об...единение", "п...яница"], [0,2], true);
    addQuestion(6, "Укажите, где надо писать ь после шипящих.", ["зияет бреш...", "намаж... хлеб", "ребёнок пригож...", "ударил наотмаш..."], [0,1,3], true);
    addQuestion(7, "Укажите слова с буквой О после шипящих.", ["ч...порный вид", "сгнивший ж...лудь", "изображ...нный на бумаге", "расписной сундуч...к"], [0,3], true);
    addQuestion(8, "Найдите слова с буквой И после Ц.", ["пловц...", "ц...ликом", "традиц...я", "ц...линдр"], [2,3], true);
    addQuestion(9, "Укажите слова с ударением на первом слоге.", ["шарфы", "банты", "балуясь", "прибыла"], [0,1], true);
    addQuestion(10, "В каком слове вместо точек пишется А?", ["д...лина", "погл...щать", "раздр...жение", "зар...ждение"], [2], false);
    addQuestion(11, "В каком слове пишется Е?", ["соед...няет", "уд...вляется", "сл...тела", "сл...лись"], [2], false);
    addQuestion(12, "Укажите слово, в котором пять звуков.", ["январь", "июль", "юбка", "осень"], [2], false);
    addQuestion(13, "В каком слове первый звук корня мягкий согласный?", ["удивление", "пришёл", "цифра", "женщина"], [0], false);
    addQuestion(14, "В каком слове произносится твёрдый согласный перед Е?", ["фанера", "академик", "тема", "кашне"], [3], false);
    addQuestion(15, "В каком слове произносится [шн]?", ["конечно", "вечный", "порочный", "наконечник"], [0], false);
    addQuestion(16, "Найдите слова с безударной гласной корня, проверяемой ударением.", ["примирение", "вытереть", "коснуться", "запевать"], [0,3], true);
    addQuestion(17, "Укажите слова с буквой З в приставке.", ["бе...вкусный", "...делать", "в...дох", "бе...платный"], [0,2], true);
    addQuestion(18, "Где суффикс -ик имеет уменьшительное значение?", ["тюбик", "половик", "массовик", "арбузик"], [3], false);
    addQuestion(19, "Слово, образованное при помощи приставки и суффикса.", ["переезд", "берёзовый", "городской", "прибрежный"], [3], false);
    addQuestion(20, "Слова, образованные бессуффиксным способом.", ["отлёт", "рассмотрение", "погрузка", "тишь"], [0,3], true);
    addQuestion(21, "Ряд, в котором все слова имеют приставку ПРИ-.", ["пр..мирить, пр...забавный, пр...увеличить", "пр...сесть, пр...винтить, пр...спокойный", "пр...брежный, пр...ползти, пр..скакать", "пр...злой, пр...школьный, пр...ручить"], [2], false);
    addQuestion(22, "Какая часть слова не является морфемой?", ["основа", "приставка", "окончание", "суффикс"], [0], false);
    addQuestion(23, "Верное утверждение.", ["у глаголов нет нулевого окончания", "окончание служит для образования новых слов", "основа не может быть равна всему слову", "корень содержит главное лексическое значение"], [3], false);
    addQuestion(24, "Неверное утверждение.", ["корень — общая часть родственных слов", "беда, бедолага — один корень", "водяной, подводный, заводь — один корень", "родник, народ, родина — один корень"], [1], false);
    addQuestion(25, "Неизменяемое слово.", ["ворота", "работает", "друг", "вокруг"], [3], false);

    addQuestion(28, "Слово какой части речи состоит только из основы?", ["существительное", "местоимение", "глагол", "прилагательное"], [0], false);

    addQuestion(34, "Чередование О в корне.", ["предл...гать", "покл...ниться", "выр...стили", "з...ря"], [1], false);
    addQuestion(35, "Чередование А в корне.", ["к...снуться", "пол...жение", "заг...реть", "отр...сль"], [3], false);

    addQuestion(37, "На конце приставок пишется С.", ["бе...грамотный", "и...чезать", "и...носится", "и...катель"], [1,3], true);
    addQuestion(38, "Лишнее слово (Ы после приставок).", ["без...нициативный", "под...греть", "пред...стория", "роз...грыш"], [1], false);
    addQuestion(39, "Значение, которого нет у приставки ПРИ-.", ["присоединение", "превосходная степень", "неполнота действия", "приближение"], [1], false);
    addQuestion(40, "Лишнее слово (ПРЕ/ПРИ).", ["пр...ломить", "пр...трудный", "пр...струнить", "пр...интересный"], [2], false);
    addQuestion(41, "Способ образования слова зарплата.", ["приставочный", "из словосочетания", "сложение слогов", "сложение начальной части и целого слова"], [3], false);
    addQuestion(42, "Безударная гласная А.", ["к...мпания друзей", "избирательная к...мпания", "д...лина", "г...ризонт"], [1], false);
    addQuestion(43, "Безударная гласная Е.", ["пос...дел перед дорогой", "с...дящий на скамейке", "с...деющая голова", "с...дят в классе"], [2], false);
    addQuestion(44, "Многозначные слова.", ["акваланг", "диспут", "зеркало", "вестибюль"], [1,2], true);
    addQuestion(45, "Синонимы.", ["ветер-штиль", "коса-коза", "метель-вьюга", "крикнуть-пошептать"], [2], false);

    addQuestion(68, "Буква О во всех словах.", ["кумачовый, девчонка, лапшой, вещевой", "парчовый, дешёвый, речонка, тяжёлый", "ежовый, грошовый, одежонка, шорох", "образцовый, отцов, ключевой, тучей"], [2], false);

    addQuestion(73, "Суффикс -щик.", ["обида, разведать, камень", "угон, барабан, кровля", "поднос, автомат, заказ", "буфет, приводить, резать"], [1], false);
    addQuestion(74, "Неправильное ударение.", ["диалОг, обеспЕчение, сОздал", "банты, шарфы, торты", "позвонИшь, повторИм, красИвее", "жалюзИ, мЕльком, созвонимся"], [0], false);
    addQuestion(75, "Не соответствует «много».", ["куры не клюют", "семь пятниц на неделе", "тьма тьмущая", "хоть пруд пруди"], [1], false);
    addQuestion(76, "Разносклоняемые.", ["знамя, время, племя", "армия, санаторий, волнение", "пальто, кофе, жюри", "такси, товарищ, брошь"], [0], false);
    addQuestion(77, "Нет краткой формы.", ["плохой", "хороший", "сильный", "маленький"], [3], false);
    addQuestion(78, "Творительный падеж числительного.", ["семьсот шестьдесят восьмому", "семьюстами шестьюдесятью восемью", "семьсот шестьюдесятью восьмым", "семьсот шестьдесят восьмым"], [1], false);
    addQuestion(79, "Антоним страдание.", ["печаль", "смятение", "праздник", "блаженство"], [3], false);
    addQuestion(80, "Только архаизмы.", ["компьютер, хоккей", "уста, чело, ланиты", "перст, сюжет, кашнэ", "лицедей, сыроежка, баталия"], [1], false);
    addQuestion(81, "Одна и та же буква.", ["не...глядный, з...ходил", "бе..цельный, ра...кол, ра...писание", "бе...жалостный, пр...добрый", "без...дейный, ро...плыл"], [1], false);
    addQuestion(82, "Сколько частей речи?", ["7", "9", "10", "6"], [2], false);
    addQuestion(83, "Основной принцип орфографии.", ["Дифференцирующий", "традиционный", "морфологический", "фонетический"], [2], false);
    addQuestion(84, "Одна буква в сложных сущ.", ["сенокос, пароход, ледокол", "птицелов, волнорез, путеводитель", "баснописец, овцевод, кровожадный", "дальномер, змеелов, луноход"], [0], false);
    addQuestion(85, "Пишется без Ь.", ["уменьшить", "режьте", "каменщик", "больше"], [2], false);
    addQuestion(86, "Нельзя проверить однокоренным.", ["здравствуйте", "честный", "лестница", "местный"], [2], false);
    addQuestion(87, "Приставочно-суффиксальный способ.", ["обходить", "выспаться", "правнук", "небольшой"], [0,1], true);
    addQuestion(88, "Чередование гласных в корне.", ["запирать, озарение, Ростов", "выжигать, удивительный, долина", "загореть, собирать, промокательная", "часовой, коснулся, вокзал"], [0,2], true);

    // --- Логика теста ---
    let currentQuestions = [];
    let userAnswers = [];
    let timeSeconds = 20 * 60;
    let timerInterval = null;
    let testFinished = false;
    let currentScore = 0;
    let lastMistakes = [];

    const questionsDiv = document.getElementById('questionsArea');
    const timerSpan = document.getElementById('timer');
    const scoreSpan = document.getElementById('scoreDisplay');
    const resetBtn = document.getElementById('resetTestBtn');
    const finishBtn = document.getElementById('finishTestBtn');
    const showMistakesBtn = document.getElementById('showMistakesBtn');
    const modal = document.getElementById('mistakeModal');
    const closeModal = document.getElementById('closeModalBtn');
    const mistakesListDiv = document.getElementById('mistakesList');

    function formatTime(sec) {
        let m = Math.floor(sec / 60);
        let s = sec % 60;
        return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function updateTimerDisplay() {
        timerSpan.innerText = formatTime(timeSeconds);
        if (timeSeconds <= 0 && !testFinished) {
            clearInterval(timerInterval);
            finishTest();
        }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!testFinished && timeSeconds > 0) {
                timeSeconds--;
                updateTimerDisplay();
                if (timeSeconds === 0) finishTest();
            }
        }, 1000);
    }

    function getRandomQuestions(count) {
        const shuffled = [...FULL_BANK];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, count);
    }

    function renderTest() {
        if (!currentQuestions.length) return;
        userAnswers = currentQuestions.map(() => ({ selected: [] }));
        let html = '';
        currentQuestions.forEach((q, idx) => {
            const inputType = q.multiple ? 'checkbox' : 'radio';
            const nameGroup = `q_${idx}`;
            html += `<div class="question-card" data-qidx="${idx}">
                        <div class="question-text">${idx+1}. ${q.text}</div>
                        <div class="options">`;
            q.options.forEach((opt, optIdx) => {
                html += `<label class="option" data-qidx="${idx}" data-val="${opt.value}">
                            <input type="${inputType}" name="${nameGroup}" value="${opt.value}" class="option-input">
                            <span class="option-text">${opt.text}</span>
                         </label>`;
            });
            html += `</div></div>`;
        });
        questionsDiv.innerHTML = html;

        // привязываем события напрямую к инпутам
        document.querySelectorAll('.option-input').forEach(input => {
            input.addEventListener('change', function(e) {
                if (testFinished) return;
                const label = this.closest('.option');
                const qIdx = parseInt(label.dataset.qidx);
                const val = this.value;
                const q = currentQuestions[qIdx];
                if (q.multiple) {
                    if (this.checked) {
                        if (!userAnswers[qIdx].selected.includes(val)) userAnswers[qIdx].selected.push(val);
                    } else {
                        userAnswers[qIdx].selected = userAnswers[qIdx].selected.filter(v => v !== val);
                    }
                } else {
                    if (this.checked) {
                        userAnswers[qIdx].selected = [val];
                    }
                }
            });
        });
    }

    function computeResults() {
        let correctCount = 0;
        let mistakes = [];
        for (let i = 0; i < currentQuestions.length; i++) {
            const q = currentQuestions[i];
            const userSel = userAnswers[i]?.selected || [];
            const correctSorted = [...q.correct].sort();
            const userSorted = [...userSel].sort();
            const isCorrect = (userSorted.length === correctSorted.length && userSorted.every((v,idx) => v === correctSorted[idx]));
            if (isCorrect) correctCount++;
            else {
                mistakes.push({
                    questionText: q.text,
                    userAnswers: userSel.map(v => q.options.find(o => o.value === v)?.text || '—'),
                    correctAnswers: q.correct.map(v => q.options.find(o => o.value === v)?.text || '')
                });
            }
        }
        const totalScore = correctCount * 5;
        return { score: totalScore, correctCount, mistakes };
    }

    function finishTest() {
        if (testFinished) return;
        testFinished = true;
        if (timerInterval) clearInterval(timerInterval);
        const { score, mistakes } = computeResults();
        currentScore = score;
        scoreSpan.innerText = currentScore;
        let grade = '';
        if (score >= 85) grade = '5 (Отлично)';
        else if (score >= 70) grade = '4 (Хорошо)';
        else if (score >= 50) grade = '3 (Удовлетворительно)';
        else grade = '2 (Неудовлетворительно)';
        alert(`Тест завершён!\nВаш результат: ${score} из 100 баллов.\nОценка: ${grade}`);
        lastMistakes = mistakes;
        showMistakesBtn.style.display = 'inline-block';
    }

    function showMistakesModal() {
        if (!lastMistakes) return;
        if (lastMistakes.length === 0) {
            mistakesListDiv.innerHTML = '<div style="padding:20px;text-align:center;">✨ Отлично! Ошибок нет. ✨</div>';
        } else {
            let html = '';
            lastMistakes.forEach(m => {
                html += `<div class="mistake-item">
                            <div class="mistake-question">❓ ${m.questionText}</div>
                            <div class="mistake-detail">
                                <span class="your-answer">📌 Ваш ответ: ${m.userAnswers.join(', ') || '(не выбран)'}</span>
                                <span class="correct-answer">✅ Правильный: ${m.correctAnswers.join(', ')}</span>
                            </div>
                         </div>`;
            });
            mistakesListDiv.innerHTML = html;
        }
        modal.style.display = 'flex';
    }

    function resetTest() {
        if (timerInterval) clearInterval(timerInterval);
        testFinished = false;
        timeSeconds = 20 * 60;
        updateTimerDisplay();
        currentQuestions = getRandomQuestions(20);
        renderTest();
        userAnswers = currentQuestions.map(() => ({ selected: [] }));
        scoreSpan.innerText = '0';
        showMistakesBtn.style.display = 'none';
        lastMistakes = [];
        startTimer();
    }

    // События
    resetBtn.addEventListener('click', () => { if (confirm('Начать новый тест?')) resetTest(); });
    finishBtn.addEventListener('click', () => { if (!testFinished) finishTest(); else alert('Тест уже завершён. Нажмите "Новый тест"'); });
    showMistakesBtn.addEventListener('click', showMistakesModal);
    closeModal.addEventListener('click', () => modal.style.display = 'none');
    window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

    // СТАРТ
    resetTest();
</script>
</body>
</html>
