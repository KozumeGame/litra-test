<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Велошоп — Демо экзамен модуль 3</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        /* шапка */
        .header {
            background: #2c3e66;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo {
            font-size: 28px;
        }
        .user-info {
            background: #1e2a44;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
        }
        .logout-btn {
            background: #e67e22;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        /* панель авторизации */
        .auth-panel {
            background: #ecf0f1;
            padding: 16px 24px;
            border-bottom: 1px solid #ccc;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .role-badge {
            background: #3498db;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }
        button {
            background: #2c3e66;
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #1e2a44;
        }
        .admin-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }
        /* фильтры */
        .filters {
            padding: 16px 24px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }
        .filters input, .filters select {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #bbb;
            font-size: 14px;
        }
        .search-box {
            flex: 2;
            min-width: 200px;
        }
        /* таблица товаров */
        .products-table {
            padding: 20px 24px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background: #eef2f7;
            padding: 12px 8px;
            cursor: pointer;
            text-align: left;
        }
        td {
            padding: 10px 8px;
            border-bottom: 1px solid #ddd;
        }
        .stock-zero {
            background-color: #d3d3d3 !important;
        }
        .high-discount {
            background-color: #483D8B;
            color: white;
        }
        .old-price {
            text-decoration: line-through;
            color: red;
            margin-right: 8px;
        }
        .new-price {
            font-weight: bold;
            color: black;
        }
        .edit-btn, .delete-btn {
            padding: 4px 10px;
            margin: 0 4px;
            font-size: 12px;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 20px;
            width: 500px;
            max-width: 90%;
        }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            margin: 8px 0;
            padding: 8px;
        }
        .error-msg {
            color: red;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <!-- шапка -->
    <div class="header">
        <div class="logo-area">
            <span class="logo">🚲</span>
            <strong>Веломагазин "Педаль"</strong>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <span class="user-info" id="userFullName">Гость</span>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>
    </div>

    <!-- панель выбора роли (симуляция входа) -->
    <div class="auth-panel">
        <span class="role-badge">🔐 Вход в систему:</span>
        <button class="role-btn" data-role="guest">👤 Гость</button>
        <button class="role-btn" data-role="client">🚴 Клиент (Иванов И.И.)</button>
        <button class="role-btn" data-role="manager">📋 Менеджер (Петрова А.В.)</button>
        <button class="role-btn" data-role="admin">⚙️ Админ (Сидоров Д.М.)</button>
        <div class="admin-actions" id="adminActions" style="display: none;">
            <button id="addProductBtn">➕ Добавить товар</button>
        </div>
    </div>

    <!-- фильтры и сортировка (видны для менеджера/админа) -->
    <div class="filters" id="filtersPanel" style="display: none;">
        <input type="text" id="searchInput" placeholder="🔍 Поиск по всем текстовым полям..." class="search-box">
        <select id="discountFilter">
            <option value="all">📊 Все диапазоны</option>
            <option value="0-11.99">0% – 11.99%</option>
            <option value="12-18.99">12% – 18.99%</option>
            <option value="19+">19% и более</option>
        </select>
        <select id="sortSelect">
            <option value="name">Сортировка: по названию</option>
            <option value="price_asc">Сортировка: цена (по возрастанию)</option>
            <option value="price_desc">Сортировка: цена (по убыванию)</option>
        </select>
    </div>

    <!-- таблица товаров -->
    <div class="products-table">
        <table id="productTable">
            <thead>
                <tr><th>Фото</th><th>Наименование</th><th>Категория</th><th>Производитель</th><th>Цена</th><th>Скидка</th><th>В наличии</th><th>Действия</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // -------- Демо-данные (имитация БД) ----------
    let products = [
        { id: 1, name: "Горный велосипед", category: "Горные", description: "Алюминиевая рама", producer: "Trek", supplier: "Спорт-Лайн", price: 45000, oldPrice: null, unit: "шт", stock: 5, discount: 10, image: "🚵" },
        { id: 2, name: "Шоссейный велосипед", category: "Шоссе", description: "Карбон", producer: "Giant", supplier: "ВелоСити", price: 78000, oldPrice: 85000, unit: "шт", stock: 2, discount: 18, image: "🚴" },
        { id: 3, name: "Городской велосипед", category: "Город", description: "Удобная геометрия", producer: "Author", supplier: "Спорт-Лайн", price: 32000, oldPrice: null, unit: "шт", stock: 0, discount: 0, image: "🚲" },
        { id: 4, name: "Электровелосипед", category: "Электро", description: "Запас хода 80км", producer: "Kalkhoff", supplier: "Мир колес", price: 125000, oldPrice: 149000, unit: "шт", stock: 3, discount: 22, image: "⚡" },
        { id: 5, name: "Детский велосипед", category: "Детские", description: "С защитой", producer: "Puky", supplier: "ВелоСити", price: 15000, oldPrice: null, unit: "шт", stock: 8, discount: 5, image: "🧒" }
    ];
    let nextId = 6;

    let currentRole = "guest";   // guest, client, manager, admin
    let currentUserFullName = "Гость";
    let sortField = "name";
    let sortDirection = "asc";

    // ссылки
    const tbody = document.getElementById("tableBody");
    const filtersPanel = document.getElementById("filtersPanel");
    const adminActions = document.getElementById("adminActions");
    const userFullNameSpan = document.getElementById("userFullName");

    // вспомогательные функции
    function getDiscountedPrice(product) {
        let base = product.oldPrice ? product.oldPrice : product.price;
        return base * (1 - product.discount / 100);
    }

    function filterAndSortProducts() {
        let filtered = [...products];
        const role = currentRole;
        const searchTerm = document.getElementById("searchInput")?.value.toLowerCase() || "";
        const discountRange = document.getElementById("discountFilter")?.value || "all";

        // поиск (только для manager/admin)
        if ((role === "manager" || role === "admin") && searchTerm) {
            filtered = filtered.filter(p => 
                p.name.toLowerCase().includes(searchTerm) ||
                p.category.toLowerCase().includes(searchTerm) ||
                p.description.toLowerCase().includes(searchTerm) ||
                p.producer.toLowerCase().includes(searchTerm) ||
                p.supplier.toLowerCase().includes(searchTerm)
            );
        }

        // фильтр по скидке (только manager/admin)
        if ((role === "manager" || role === "admin") && discountRange !== "all") {
            filtered = filtered.filter(p => {
                if (discountRange === "0-11.99") return p.discount < 12;
                if (discountRange === "12-18.99") return p.discount >= 12 && p.discount <= 18.99;
                if (discountRange === "19+") return p.discount >= 19;
                return true;
            });
        }

        // сортировка (для всех, кто видит панель, но и админу сохраняем)
        const sortSelect = document.getElementById("sortSelect");
        if (sortSelect) {
            const val = sortSelect.value;
            if (val === "name") filtered.sort((a,b) => a.name.localeCompare(b.name));
            if (val === "price_asc") filtered.sort((a,b) => (a.oldPrice || a.price) - (b.oldPrice || b.price));
            if (val === "price_desc") filtered.sort((a,b) => (b.oldPrice || b.price) - (a.oldPrice || a.price));
        }
        renderTable(filtered);
    }

    function renderTable(productArray) {
        tbody.innerHTML = "";
        for (let p of productArray) {
            const row = tbody.insertRow();
            const finalPrice = p.oldPrice ? getDiscountedPrice(p) : p.price;
            const hasDiscount = p.discount > 0;
            const isHighDisc = p.discount > 15;
            const outOfStock = (p.stock === 0);
            let rowClass = "";
            if (outOfStock) rowClass = "stock-zero";
            else if (isHighDisc) rowClass = "high-discount";

            row.className = rowClass;

            // фото (симуляция)
            let imgCell = row.insertCell(0);
            imgCell.innerText = p.image || "🖼️";
            // наименование
            row.insertCell(1).innerText = p.name;
            row.insertCell(2).innerText = p.category;
            row.insertCell(3).innerText = p.producer;
            // цена
            let priceCell = row.insertCell(4);
            if (p.oldPrice && p.oldPrice !== p.price) {
                priceCell.innerHTML = `<span class="old-price">${p.oldPrice}₽</span> <span class="new-price">${Math.round(finalPrice)}₽</span>`;
            } else {
                priceCell.innerText = `${p.price}₽`;
            }
            row.insertCell(5).innerText = `${p.discount}%`;
            row.insertCell(6).innerText = p.stock;
            // действия (только для админа)
            let actionsCell = row.insertCell(7);
            if (currentRole === "admin") {
                let editBtn = document.createElement("button");
                editBtn.innerText = "✏️";
                editBtn.className = "edit-btn";
                editBtn.onclick = () => openEditModal(p.id);
                let delBtn = document.createElement("button");
                delBtn.innerText = "🗑️";
                delBtn.className = "delete-btn";
                delBtn.onclick = () => deleteProduct(p.id);
                actionsCell.appendChild(editBtn);
                actionsCell.appendChild(delBtn);
            } else {
                actionsCell.innerText = "—";
            }
        }
    }

    function deleteProduct(id) {
        let prod = products.find(p => p.id === id);
        if (!prod) return;
        // проверка: в заказах - заглушка, допустим если id=2 запретим для примера
        if (id === 2) {
            alert("❌ Ошибка: товар присутствует в заказе №101. Удаление невозможно.");
            return;
        }
        if (confirm(`Удалить товар "${prod.name}"?`)) {
            products = products.filter(p => p.id !== id);
            filterAndSortProducts();
        }
    }

    function openEditModal(id) {
        let product = products.find(p => p.id === id);
        if (!product) return;
        // простая форма через prompt (в реальном проекте - красивое модальное окно)
        let newName = prompt("Новое название:", product.name);
        if (newName && newName.trim()) product.name = newName.trim();
        let newPrice = prompt("Цена (руб):", product.price);
        if (newPrice && !isNaN(parseFloat(newPrice))) product.price = parseFloat(newPrice);
        let newStock = prompt("Количество на складе:", product.stock);
        if (newStock !== null && !isNaN(parseInt(newStock))) product.stock = parseInt(newStock);
        let newDiscount = prompt("Скидка % (0-100):", product.discount);
        if (newDiscount !== null && !isNaN(parseFloat(newDiscount))) product.discount = parseFloat(newDiscount);
        filterAndSortProducts();
    }

    function addNewProduct() {
        let name = prompt("Название товара:");
        if (!name) return;
        let price = parseFloat(prompt("Цена:"));
        if (isNaN(price)) return;
        let stock = parseInt(prompt("Количество на складе:"));
        let discount = parseFloat(prompt("Скидка %:"));
        let category = prompt("Категория:");
        let producer = prompt("Производитель:");
        let newProd = {
            id: nextId++,
            name: name,
            category: category || "Общая",
            description: "",
            producer: producer || "Unknown",
            supplier: "Поставщик",
            price: price,
            oldPrice: null,
            unit: "шт",
            stock: isNaN(stock) ? 0 : stock,
            discount: isNaN(discount) ? 0 : discount,
            image: "🆕"
        };
        products.push(newProd);
        filterAndSortProducts();
    }

    function updateUIForRole() {
        const isManagerOrAdmin = (currentRole === "manager" || currentRole === "admin");
        filtersPanel.style.display = isManagerOrAdmin ? "flex" : "none";
        adminActions.style.display = (currentRole === "admin") ? "flex" : "none";

        let displayName = currentUserFullName;
        if (currentRole === "guest") displayName = "Гость (только просмотр)";
        if (currentRole === "client") displayName = "Клиент: Иванов И.И.";
        if (currentRole === "manager") displayName = "Менеджер: Петрова А.В.";
        if (currentRole === "admin") displayName = "Администратор: Сидоров Д.М.";
        userFullNameSpan.innerText = displayName;

        // перерисовка с учетом прав (для гостя/клиента — без поиска/фильтрации)
        if (currentRole === "guest" || currentRole === "client") {
            // просто показать все товары без активных фильтров (только подсветка)
            renderTable(products);
        } else {
            filterAndSortProducts();
        }
    }

    // событий для поиска/фильтров
    function bindEvents() {
        const search = document.getElementById("searchInput");
        if (search) search.addEventListener("input", () => filterAndSortProducts());
        const filterDiscount = document.getElementById("discountFilter");
        if (filterDiscount) filterDiscount.addEventListener("change", () => filterAndSortProducts());
        const sortSelect = document.getElementById("sortSelect");
        if (sortSelect) sortSelect.addEventListener("change", () => filterAndSortProducts());
        document.getElementById("addProductBtn")?.addEventListener("click", addNewProduct);
        document.getElementById("logoutBtn").addEventListener("click", () => {
            currentRole = "guest";
            currentUserFullName = "Гость";
            updateUIForRole();
        });
        document.querySelectorAll(".role-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const role = btn.getAttribute("data-role");
                currentRole = role;
                if (role === "guest") currentUserFullName = "Гость";
                if (role === "client") currentUserFullName = "Иванов И.И.";
                if (role === "manager") currentUserFullName = "Петрова А.В.";
                if (role === "admin") currentUserFullName = "Сидоров Д.М.";
                updateUIForRole();
            });
        });
    }

    // инициализация
    function init() {
        bindEvents();
        updateUIForRole();
    }
    init();
</script>
</body>
</html>
