<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slash & Burn - Hotline Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #game-container {
            border: 2px solid #ff00aa;
            box-shadow: 0 0 30px rgba(255, 0, 170, 0.5), 0 0 60px rgba(0, 255, 255, 0.3);
            image-rendering: pixelated;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js">
    </script>
    <script>
        // ====================================
        // СИНТЕЗАТОР ЗВУКОВ НА WEB AUDIO API
        // ====================================
        class SynthAudio {
            constructor() {
                this.ctx = null;
                try {
                    this.ctx = new(window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn('Web Audio API не поддерживается');
                }
            }

            play(type, volume = 0.3) {
                if (!this.ctx) return;
                // Возобновляем контекст, если он приостановлен (нужно после взаимодействия)
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const t = this.ctx.currentTime;
                const gain = this.ctx.createGain();
                gain.connect(this.ctx.destination);
                gain.gain.setValueAtTime(volume, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

                switch (type) {
                    case 'slash':
                        this._noise(t, gain, 0.08, 800, 200);
                        break;
                    case 'heavy':
                        this._noise(t, gain, 0.15, 200, 60);
                        this._osc(t, gain, 'square', 80, 0.1, volume * 0.5);
                        break;
                    case 'dash':
                        this._noise(t, gain, 0.12, 1500, 400);
                        this._osc(t, gain, 'sine', 300, 0.08, volume);
                        break;
                    case 'shoot':
                        this._noise(t, gain, 0.06, 2000, 100);
                        this._osc(t, gain, 'square', 150, 0.04, volume * 0.8);
                        break;
                    case 'hit':
                        this._noise(t, gain, 0.05, 600, 150);
                        break;
                    case 'death':
                        this._noise(t, gain, 0.2, 400, 100);
                        this._osc(t, gain, 'sawtooth', 100, 0.15, volume);
                        break;
                    case 'explosion':
                        this._noise(t, gain, 0.3, 300, 50);
                        this._osc(t, gain, 'sawtooth', 40, 0.25, volume);
                        break;
                    case 'combo':
                        this._osc(t, gain, 'sine', 600, 0.05, volume);
                        this._osc(t, gain, 'sine', 900, 0.05, volume * 0.7);
                        break;
                    case 'select':
                        this._osc(t, gain, 'sine', 440, 0.08, volume);
                        break;
                }
            }

            _noise(t, gain, duration, freq, q) {
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.01));
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = freq;
                filter.Q.value = q;
                noise.connect(filter);
                filter.connect(gain);
                noise.start(t);
                noise.stop(t + duration);
            }

            _osc(t, gainNode, type, freq, duration, vol) {
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.3, t + duration);
                g.gain.setValueAtTime(vol, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + duration);
                osc.connect(g);
                g.connect(gainNode);
                osc.start(t);
                osc.stop(t + duration);
            }
        }

        // Глобальный экземпляр синтезатора
        const SFX = new SynthAudio();

        // ====================================
        // КОНФИГУРАЦИЯ ИГРЫ
        // ====================================
        const CONFIG = {
            WIDTH: 800,
            HEIGHT: 600,
            PLAYER_SPEED: 200,
            DASH_SPEED: 600,
            DASH_DURATION: 150,
            DASH_COOLDOWN: 600,
            DASH_INVINCIBILITY: 200,
            SLASH_RANGE: 55,
            SLASH_ANGLE: 80,
            SLASH_DAMAGE: 35,
            HAMMER_RANGE: 65,
            HAMMER_ANGLE: 100,
            HAMMER_DAMAGE: 60,
            HAMMER_SLOW: 0.3,
            ZOMBIE_SPEED: 80,
            ZOMBIE_HP: 40,
            ZOMBIE_DAMAGE: 15,
            SHOOTER_SPEED: 60,
            SHOOTER_HP: 30,
            SHOOTER_DAMAGE: 10,
            SHOOTER_FIRE_RATE: 1200,
            SHOOTER_PREFERRED_DIST: 200,
            BOSS_HP: 300,
            BOSS_SPEED: 100,
            BOSS_CHARGE_SPEED: 350,
            BOSS_DAMAGE: 30,
            HIT_STOP_DURATION: 50,
            SCREEN_SHAKE_INTENSITY: 6,
            SCREEN_SHAKE_DURATION: 80,
            BLOOD_PARTICLE_COUNT: 8,
            COMBO_TIMEOUT: 1500,
            ARENA_DURATION: 30, // секунд на арену, если не убиты все враги
        };

        // ====================================
        // ГЛОБАЛЬНОЕ СОСТОЯНИЕ ПРОХОЖДЕНИЯ
        // ====================================
        const GameState = {
            score: 0,
            kills: 0,
            currentArena: 0,
            combo: 0,
            comboTimer: 0,
            playerHP: 100,
            maxHP: 100,
            currentWeapon: 'katana', // 'katana' | 'hammer'
            weaponDurability: { katana: Infinity, hammer: 10 },
        };

        // ====================================
        // СЦЕНА: ГЛАВНОЕ МЕНЮ
        // ====================================
        class MainMenuScene extends Phaser.Scene {
            constructor() {
                super('MainMenu');
            }

            create() {
                const { width, height } = this.scale;
                this.cameras.main.setBackgroundColor('#0a0a0a');

                // Глитч-фон: множество линий
                this.bgLines = [];
                for (let i = 0; i < 40; i++) {
                    const line = this.add.rectangle(
                        Phaser.Math.Between(0, width),
                        Phaser.Math.Between(0, height),
                        Phaser.Math.Between(100, 400),
                        2,
                        Phaser.Math.RND.pick(['#ff00aa', '#00ffff', '#ff6600', '#aa00ff'])
                    ).setAlpha(0.3);
                    this.bgLines.push({ obj: line, speed: Phaser.Math.Between(50, 200) });
                }

                // Анимированный заголовок
                this.titleText = this.add.text(width / 2, height * 0.25, 'SLASH\n& BURN', {
                    fontFamily: 'Courier New',
                    fontSize: '72px',
                    fontStyle: 'bold',
                    color: '#ff00aa',
                    stroke: '#00ffff',
                    strokeThickness: 4,
                    align: 'center',
                }).setOrigin(0.5);

                // Анимация глитча для заголовка
                this.time.addEvent({
                    delay: 150,
                    loop: true,
                    callback: () => {
                        const offsetX = Phaser.Math.Between(-5, 5);
                        const offsetY = Phaser.Math.Between(-3, 3);
                        this.titleText.setPosition(width / 2 + offsetX, height * 0.25 + offsetY);
                        // Случайно меняем цвета
                        if (Math.random() < 0.3) {
                            this.titleText.setColor(Phaser.Math.RND.pick(['#ff00aa', '#ff0066',
                                '#00ffff']));
                        }
                    }
                });

                // Кнопка Start
                const btnBg = this.add.rectangle(width / 2, height * 0.55, 220, 60, 0xff00aa)
                    .setStrokeStyle(2, 0x00ffff)
                    .setInteractive({ useHandCursor: true });

                this.startText = this.add.text(width / 2, height * 0.55, '[ START GAME ]', {
                    fontFamily: 'Courier New',
                    fontSize: '24px',
                    color: '#ffffff',
                }).setOrigin(0.5);

                // Эффект наведения
                btnBg.on('pointerover', () => {
                    btnBg.setFillStyle(0xff0066);
                    btnBg.setScale(1.05);
                    this.startText.setScale(1.05);
                    SFX.play('select', 0.15);
                });
                btnBg.on('pointerout', () => {
                    btnBg.setFillStyle(0xff00aa);
                    btnBg.setScale(1);
                    this.startText.setScale(1);
                });

                // Запуск игры
                btnBg.on('pointerdown', () => {
                    SFX.play('slash', 0.4);
                    this.cameras.main.shake(200, 0.02);
                    this.time.delayedCall(200, () => {
                        GameState.score = 0;
                        GameState.kills = 0;
                        GameState.combo = 0;
                        GameState.playerHP = GameState.maxHP;
                        GameState.currentArena = 0;
                        GameState.currentWeapon = 'katana';
                        GameState.weaponDurability = { katana: Infinity, hammer: 10 };
                        this.scene.start('Arena');
                    });
                });

                // Подсказка
                this.add.text(width / 2, height * 0.7, 'WASD — Движение | Мышь — Удар\nSpace — Рывок | 1/2 — Оружие', {
                    fontFamily: 'Courier New',
                    fontSize: '14px',
                    color: '#888888',
                    align: 'center',
                }).setOrigin(0.5);

                // Версия
                this.add.text(width - 10, height - 10, 'v1.0', {
                    fontFamily: 'Courier New',
                    fontSize: '12px',
                    color: '#444444',
                }).setOrigin(1, 1);
            }

            update(time, delta) {
                // Движение линий фона
                this.bgLines.forEach(line => {
                    line.obj.x += line.speed * (delta / 1000);
                    if (line.obj.x > this.scale.width + 200) line.obj.x = -200;
                });
            }
        }

        // ====================================
        // СЦЕНА: АРЕНА (ИГРОВОЙ УРОВЕНЬ)
        // ====================================
        class ArenaScene extends Phaser.Scene {
            constructor() {
                super('Arena');
            }

            init() {
                this.player = null;
                this.enemies = [];
                this.projectiles = [];
                this.particles = []; // Кровавые декали на полу
                this.barrels = [];
                this.dashCooldownTimer = 0;
                this.isDashing = false;
                this.dashTimer = 0;
                this.slashCooldown = 0;
                this.cursors = null;
                this.hudElements = {};
                this.arenaTimer = CONFIG.ARENA_DURATION;
                this.enemiesRemaining = 0;
                this.arenaComplete = false;
                this.hitStopTimer = 0;
                this.comboTextPool = [];
                // Флаги состояний ИИ врагов будут храниться в самих объектах врагов
            }

            create() {
                const { width, height } = this.scale;
                GameState.currentArena++;

                // Фон арены
                this.cameras.main.setBackgroundColor('#1a1a2e');
                this.drawArenaFloor(width, height);

                // Игрок
                this.spawnPlayer(width / 2, height / 2);

                // Группа врагов
                this.spawnEnemies();

                // Бочки
                this.spawnBarrels();

                // Камера
                this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
                this.cameras.main.setBounds(0, 0, width, height);

                // Создаём HUD
                this.createHUD(width, height);

                // Ввод
                this.cursors = {
                    w: this.input.keyboard.addKey('W'),
                    a: this.input.keyboard.addKey('A'),
                    s: this.input.keyboard.addKey('S'),
                    d: this.input.keyboard.addKey('D'),
                    space: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE),
                    one: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ONE),
                    two: this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.TWO),
                };

                // Предотвращаем прокрутку страницы при нажатии пробела
                this.input.keyboard.addCapture('SPACE');

                // Время уровня
                this.time.addEvent({
                    delay: 1000,
                    loop: true,
                    callback: () => {
                        if (!this.arenaComplete) {
                            this.arenaTimer--;
                            if (this.arenaTimer <= 0) {
                                this.nextArena();
                            }
                        }
                    }
                });

                // Сброс комбо при старте уровня
                GameState.combo = 0;
                GameState.comboTimer = 0;
            }

            // ---- ОТРИСОВКА ПОЛА АРЕНЫ ----
            drawArenaFloor(w, h) {
                const gfx = this.add.graphics();
                // Основной пол
                gfx.fillStyle(0x2a2a3e, 1);
                gfx.fillRect(0, 0, w, h);

                // Сетка
                gfx.lineStyle(1, 0x3a3a5e, 0.3);
                const gridSize = 64;
                for (let x = 0; x < w; x += gridSize) {
                    gfx.lineBetween(x, 0, x, h);
                }
                for (let y = 0; y < h; y += gridSize) {
                    gfx.lineBetween(0, y, w, y);
                }

                // Пятна на полу
                for (let i = 0; i < 20; i++) {
                    const px = Phaser.Math.Between(0, w);
                    const py = Phaser.Math.Between(0, h);
                    gfx.fillStyle(
                        Phaser.Math.RND.pick([0x3a2a1a, 0x2a3a2a, 0x3a2a3a]),
                        0.2
                    );
                    gfx.fillCircle(px, py, Phaser.Math.Between(10, 40));
                }

                // Стены (рамка)
                gfx.fillStyle(0x4a4a6e, 1);
                gfx.fillRect(0, 0, w, 8);
                gfx.fillRect(0, h - 8, w, 8);
                gfx.fillRect(0, 0, 8, h);
                gfx.fillRect(w - 8, 0, 8, h);

                gfx.setDepth(-1);
            }

            // ---- ИГРОК ----
            spawnPlayer(x, y) {
                // Игрок — яркий прямоугольник
                this.player = this.add.rectangle(x, y, 24, 32, 0x00ffff)
                    .setStrokeStyle(2, 0xffffff);

                // "Глаза" игрока — две точки
                this.playerEyes = this.add.graphics();
                this.playerEyes.setPosition(x, y);
                this.playerEyes.fillStyle(0xff0000, 1);
                this.playerEyes.fillCircle(-4, -6, 3);
                this.playerEyes.fillCircle(4, -6, 3);

                // Свойства игрока
                this.player.hp = GameState.playerHP;
                this.player.maxHp = GameState.maxHP;
                this.player.isInvincible = false;
                this.player.dashOnCooldown = false;

                // Физическое тело
                this.physics.add.existing(this.player);
                this.player.body.setCircle(14, -2, -2);
                this.player.body.setCollideWorldBounds(true);
                this.player.body.setDrag(800);
            }

            // ---- ВРАГИ ----
            spawnEnemies() {
                this.enemies = [];
                const { width, height } = this.scale;
                const arenaNum = GameState.currentArena;

                // Определяем состав врагов в зависимости от арены
                let zombieCount, shooterCount;
                let hasBoss = false;
                if (arenaNum === 1) {
                    zombieCount = 5;
                    shooterCount = 1;
                } else if (arenaNum === 2) {
                    zombieCount = 7;
                    shooterCount = 3;
                    hasBoss = true;
                } else {
                    zombieCount = 5 + arenaNum * 2;
                    shooterCount = 2 + arenaNum;
                    if (arenaNum % 2 === 0) hasBoss = true;
                }

                // Спавн зомби
                for (let i = 0; i < zombieCount; i++) {
                    this.spawnEnemy('zombie', width, height);
                }
                // Спавн стрелков
                for (let i = 0; i < shooterCount; i++) {
                    this.spawnEnemy('shooter', width, height);
                }
                // Босс
                if (hasBoss) {
                    this.spawnEnemy('boss', width, height);
                }

                this.enemiesRemaining = this.enemies.length;
                this.updateEnemyCounter();
            }

            spawnEnemy(type, w, h) {
                // Спавн у краёв карты, подальше от игрока
                let ex, ey;
                const margin = 60;
                const playerPos = this.player ? { x: this.player.x, y: this.player.y } : { x: w / 2,
                    y: h / 2 };
                do {
                    ex = Phaser.Math.Between(margin, w - margin);
                    ey = Phaser.Math.Between(margin, h - margin);
                } while (Phaser.Math.Distance.Between(ex, ey, playerPos.x, playerPos.y) < 250);

                let enemy;
                const colorMap = {
                    zombie: 0x44cc44,
                    shooter: 0xcc8844,
                    boss: 0xcc2222,
                };
                const sizeMap = {
                    zombie: { w: 22, h: 30 },
                    shooter: { w: 24, h: 28 },
                    boss: { w: 40, h: 48 },
                };
                const sz = sizeMap[type];
                const col = colorMap[type];

                enemy = this.add.rectangle(ex, ey, sz.w, sz.h, col)
                    .setStrokeStyle(2, 0xffffff);

                // Глаза врага
                const eyes = this.add.graphics();
                eyes.fillStyle(0xffff00, 1);
                eyes.fillCircle(-4, -5, 2);
                eyes.fillCircle(4, -5, 2);
                eyes.setPosition(ex, ey);
                enemy.eyesGfx = eyes;

                this.physics.add.existing(enemy);
                enemy.body.setCircle(Math.max(sz.w, sz.h) / 2, -2, -4);
                enemy.body.setCollideWorldBounds(true);

                // Свойства врага
                enemy.enemyType = type;
                enemy.hp = type === 'zombie' ? CONFIG.ZOMBIE_HP :
                    type === 'shooter' ? CONFIG.SHOOTER_HP : CONFIG.BOSS_HP;
                enemy.maxHp = enemy.hp;
                enemy.damage = type === 'zombie' ? CONFIG.ZOMBIE_DAMAGE :
                    type === 'shooter' ? CONFIG.SHOOTER_DAMAGE : CONFIG.BOSS_DAMAGE;
                enemy.speed = type === 'zombie' ? CONFIG.ZOMBIE_SPEED :
                    type === 'shooter' ? CONFIG.SHOOTER_SPEED : CONFIG.BOSS_SPEED;
                // Состояние ИИ: 'chase', 'attack', 'stun'
                enemy.aiState = 'chase';
                enemy.stunTimer = 0;
                enemy.attackCooldown = 0;
                enemy.flashTimer = 0;
                enemy.lastSeenPlayerPos = { x: ex, y: ey };
                enemy.chargeTimer = 0;
                enemy.chargeDirection = { x: 0, y: 0 };
                // Для стрелков: предпочитаемая дистанция + таймер стрельбы
                enemy.fireTimer = Phaser.Math.Between(0, CONFIG.SHOOTER_FIRE_RATE);
                enemy.preferredDist = CONFIG.SHOOTER_PREFERRED_DIST + Phaser.Math.Between(-50, 50);

                this.enemies.push(enemy);
                return enemy;
            }

            // ---- БОЧКИ ----
            spawnBarrels() {
                this.barrels = [];
                const { width, height } = this.scale;
                const count = Phaser.Math.Between(3, 6);
                for (let i = 0; i < count; i++) {
                    const bx = Phaser.Math.Between(80, width - 80);
                    const by = Phaser.Math.Between(80, height - 80);
                    const barrel = this.add.rectangle(bx, by, 28, 32, 0x885522)
                        .setStrokeStyle(2, 0xaa7744);
                    // Крест на бочке
                    const cross = this.add.graphics();
                    cross.lineStyle(2, 0xffaa00, 0.7);
                    cross.lineBetween(-10, -12, 10, 12);
                    cross.lineBetween(10, -12, -10, 12);
                    cross.setPosition(bx, by);
                    barrel.crossGfx = cross;

                    this.physics.add.existing(barrel);
                    barrel.body.setCircle(16, -2, 0);
                    barrel.body.setImmovable(true);
                    barrel.body.setCollideWorldBounds(true);
                    barrel.hp = 30;
                    barrel.isExploding = false;
                    barrel.owner = 'barrel';
                    this.barrels.push(barrel);
                }
            }

            // ---- ВЗРЫВ БОЧКИ ----
            explodeBarrel(barrel) {
                if (barrel.isExploding) return;
                barrel.isExploding = true;
                SFX.play('explosion', 0.5);
                this.cameras.main.shake(CONFIG.SCREEN_SHAKE_DURATION * 2, CONFIG.SCREEN_SHAKE_INTENSITY / 500);

                // Визуальный эффект взрыва
                const ex = barrel.x;
                const ey = barrel.y;
                const flash = this.add.circle(ex, ey, 60, 0xff6600, 0.8).setDepth(10);
                this.tweens.add({
                    targets: flash,
                    scaleX: 2,
                    scaleY: 2,
                    alpha: 0,
                    duration: 300,
                    onComplete: () => flash.destroy(),
                });

                // Частицы
                for (let i = 0; i < 20; i++) {
                    this.spawnBloodParticle(ex, ey, '#ff6600', 200);
                }

                // Урон всем в радиусе
                const explosionRadius = 70;
                // Урон игроку
                const distToPlayer = Phaser.Math.Distance.Between(ex, ey, this.player.x, this.player.y);
                if (distToPlayer < explosionRadius && !this.player.isInvincible) {
                    const dmg = Math.floor(25 * (1 - distToPlayer / explosionRadius));
                    this.damagePlayer(dmg);
                }
                // Урон врагам
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const enemy = this.enemies[i];
                    const dist = Phaser.Math.Distance.Between(ex, ey, enemy.x, enemy.y);
                    if (dist < explosionRadius) {
                        const dmg = Math.floor(40 * (1 - dist / explosionRadius));
                        this.damageEnemy(enemy, dmg, { x: enemy.x - ex, y: enemy.y - ey });
                    }
                }
                // Цепная реакция на соседние бочки
                for (const b of this.barrels) {
                    if (b === barrel || b.isExploding) continue;
                    const dist = Phaser.Math.Distance.Between(ex, ey, b.x, b.y);
                    if (dist < explosionRadius) {
                        this.time.delayedCall(100, () => this.explodeBarrel(b));
                    }
                }

                // Убираем бочку
                barrel.crossGfx?.destroy();
                barrel.destroy();
                this.barrels = this.barrels.filter(b => b !== barrel);
            }

            // ---- HUD ----
            createHUD(w, h) {
                // Бар здоровья — фон
                const hpBarBg = this.add.rectangle(20, 20, 204, 16, 0x333333)
                    .setStrokeStyle(1, 0xffffff).setOrigin(0, 0).setScrollFactor(0).setDepth(100);
                // Бар здоровья — заполнение
                this.hudElements.hpBar = this.add.rectangle(22, 22, 200, 12, 0xff0000)
                    .setOrigin(0, 0).setScrollFactor(0).setDepth(100);
                // Текст HP
                this.hudElements.hpText = this.add.text(230, 18, '100/100', {
                    fontFamily: 'Courier New',
                    fontSize: '14px',
                    color: '#ffffff',
                }).setScrollFactor(0).setDepth(100);

                // Счёт
                this.hudElements.scoreText = this.add.text(20, 40, 'SCORE: 0', {
                    fontFamily: 'Courier New',
                    fontSize: '16px',
                    color: '#ffcc00',
                }).setScrollFactor(0).setDepth(100);

                // Убийства
                this.hudElements.killsText = this.add.text(20, 60, 'KILLS: 0', {
                    fontFamily: 'Courier New',
                    fontSize: '14px',
                    color: '#ff8888',
                }).setScrollFactor(0).setDepth(100);

                // Оружие
                this.hudElements.weaponIcon = this.add.rectangle(w - 60, 20, 40, 40, 0x00ccff)
                    .setStrokeStyle(2, 0xffffff).setScrollFactor(0).setDepth(100);
                this.hudElements.weaponText = this.add.text(w - 100, 22, 'КАТАНА', {
                    fontFamily: 'Courier New',
                    fontSize: '12px',
                    color: '#ffffff',
                    align: 'right',
                }).setOrigin(1, 0).setScrollFactor(0).setDepth(100);
                this.hudElements.durabilityText = this.add.text(w - 60, 65, '∞', {
                    fontFamily: 'Courier New',
                    fontSize: '12px',
                    color: '#aaaaaa',
                }).setScrollFactor(0).setDepth(100);

                // Комбо
                this.hudElements.comboText = this.add.text(w / 2, 30, '', {
                    fontFamily: 'Courier New',
                    fontSize: '28px',
                    fontStyle: 'bold',
                    color: '#ff00aa',
                    stroke: '#ffffff',
                    strokeThickness: 2,
                }).setOrigin(0.5).setScrollFactor(0).setDepth(100).setAlpha(0);

                // Таймер и враги
                this.hudElements.infoText = this.add.text(w / 2, h - 20, '', {
                    fontFamily: 'Courier New',
                    fontSize: '14px',
                    color: '#cccccc',
                }).setOrigin(0.5).setScrollFactor(0).setDepth(100);

                // Арена
                this.hudElements.arenaText = this.add.text(w - 20, h - 20, '', {
                    fontFamily: 'Courier New',
                    fontSize: '16px',
                    color: '#ffaa00',
                }).setOrigin(1, 1).setScrollFactor(0).setDepth(100);
            }

            updateHUD() {
                // HP
                const hpPercent = this.player.hp / this.player.maxHp;
                this.hudElements.hpBar.setScale(hpPercent, 1);
                // Цвет меняется от зелёного к красному
                const hpColor = Phaser.Display.Color.GetColor(
                    Math.floor(255 * (1 - hpPercent)),
                    Math.floor(255 * hpPercent),
                    30
                );
                this.hudElements.hpBar.setFillStyle(hpColor);
                this.hudElements.hpText.setText(`${Math.ceil(this.player.hp)}/${this.player.maxHp}`);

                // Счёт и убийства
                this.hudElements.scoreText.setText(`SCORE: ${GameState.score}`);
                this.hudElements.killsText.setText(`KILLS: ${GameState.kills}`);

                // Оружие
                const wepColors = { katana: 0x00ccff, hammer: 0xff8800 };
                const wepNames = { katana: 'КАТАНА', hammer: 'КУВАЛДА' };
                this.hudElements.weaponIcon.setFillStyle(wepColors[GameState.currentWeapon]);
                this.hudElements.weaponText.setText(wepNames[GameState.currentWeapon]);
                const dur = GameState.weaponDurability[GameState.currentWeapon];
                this.hudElements.durabilityText.setText(dur === Infinity ? '∞' : `${dur}`);

                // Инфо (таймер + враги)
                this.hudElements.infoText.setText(
                    `ВРЕМЯ: ${this.arenaTimer}с | ВРАГОВ: ${this.enemiesRemaining}`
                );
                this.hudElements.arenaText.setText(`АРЕНА ${GameState.currentArena}`);

                // Комбо
                if (GameState.combo > 1) {
                    this.hudElements.comboText.setText(`COMBO x${GameState.combo}`);
                    this.hudElements.comboText.setAlpha(1);
                    this.hudElements.comboText.setScale(1 + Math.sin(this.time.now / 100) * 0.1);
                } else {
                    this.hudElements.comboText.setAlpha(
                        Math.max(0, this.hudElements.comboText.alpha - 0.02)
                    );
                }
            }

            updateEnemyCounter() {
                this.enemiesRemaining = this.enemies.filter(e => e.active).length;
                if (this.enemiesRemaining <= 0 && !this.arenaComplete) {
                    this.arenaComplete = true;
                    this.time.delayedCall(800, () => this.nextArena());
                }
            }

            // ---- ПЕРЕХОД НА СЛЕДУЮЩУЮ АРЕНУ ----
            nextArena() {
                GameState.playerHP = this.player.hp;
                // Между аренами небольшое восстановление
                GameState.playerHP = Math.min(GameState.maxHP, GameState.playerHP + 20);
                this.cameras.main.fadeOut(400, 0, 0, 0);
                this.time.delayedCall(500, () => {
                    this.scene.restart();
                });
            }

            // ---- СИСТЕМА ПОВРЕЖДЕНИЙ ----
            damagePlayer(amount) {
                if (this.player.isInvincible || this.player.hp <= 0) return;
                this.player.hp -= amount;
                this.player.isInvincible = true;
                SFX.play('hit', 0.3);

                // Эффект: мигание красным + тряска камеры
                this.cameras.main.shake(CONFIG.SCREEN_SHAKE_DURATION, CONFIG.SCREEN_SHAKE_INTENSITY / 500);
                this.player.setFillStyle(0xff0000);
                this.time.delayedCall(150, () => {
                    this.player.setFillStyle(0x00ffff);
                    this.player.isInvincible = false;
                });

                if (this.player.hp <= 0) {
                    this.playerDeath();
                }
            }

            damageEnemy(enemy, amount, knockbackDir = null) {
                if (!enemy.active || enemy.hp <= 0) return;

                enemy.hp -= amount;
                enemy.flashTimer = 100; // Белая вспышка на 100 мс
                SFX.play('hit', 0.2);

                // Отбрасывание & стан
                if (knockbackDir) {
                    const dist = Math.sqrt(knockbackDir.x * knockbackDir.x + knockbackDir.y *
                        knockbackDir.y) || 1;
                    const nx = knockbackDir.x / dist;
                    const ny = knockbackDir.y / dist;
                    enemy.body.setVelocity(nx * 300, ny * 300);
                    enemy.aiState = 'stun';
                    enemy.stunTimer = 400;
                }

                // Комбо
                GameState.combo++;
                GameState.comboTimer = CONFIG.COMBO_TIMEOUT;
                GameState.score += amount * GameState.combo;

                // Hit Stop
                this.hitStopTimer = CONFIG.HIT_STOP_DURATION;

                // Screen Shake
                this.cameras.main.shake(CONFIG.SCREEN_SHAKE_DURATION, CONFIG.SCREEN_SHAKE_INTENSITY / 600);

                // Blood Particles
                for (let i = 0; i < CONFIG.BLOOD_PARTICLE_COUNT; i++) {
                    this.spawnBloodParticle(enemy.x, enemy.y, '#cc0000', 150);
                }

                // Комбо-звук при определённых значениях
                if (GameState.combo % 5 === 0) {
                    SFX.play('combo', 0.4);
                }

                if (enemy.hp <= 0) {
                    this.enemyDeath(enemy);
                }
            }

            enemyDeath(enemy) {
                SFX.play('death', 0.5);
                this.cameras.main.shake(CONFIG.SCREEN_SHAKE_DURATION * 1.5, CONFIG.SCREEN_SHAKE_INTENSITY /
                    400);

                // Много крови
                for (let i = 0; i < CONFIG.BLOOD_PARTICLE_COUNT * 2; i++) {
                    this.spawnBloodParticle(enemy.x, enemy.y, '#880000', 250);
                }

                // Оставляем кровавое пятно на полу (декаль)
                const decal = this.add.circle(enemy.x, enemy.y,
                    Phaser.Math.Between(15, 30),
                    Phaser.Math.RND.pick([0x990000, 0x660000, 0xaa0000]),
                    0.6
                ).setDepth(0);
                this.particles.push(decal);
                // Удаляем старые декали, если их слишком много
                if (this.particles.length > 60) {
                    const old = this.particles.shift();
                    old?.destroy();
                }

                GameState.kills++;
                GameState.score += enemy.enemyType === 'boss' ? 500 : 100;

                // Удаление врага
                enemy.eyesGfx?.destroy();
                enemy.destroy();
                this.enemies = this.enemies.filter(e => e.active);
                this.updateEnemyCounter();
            }

            playerDeath() {
                SFX.play('death', 0.7);
                this.cameras.main.shake(500, 0.03);
                this.cameras.main.flash(500, 255, 0, 0);

                // Кровь игрока
                for (let i = 0; i < 30; i++) {
                    this.spawnBloodParticle(this.player.x, this.player.y, '#ff0044', 400);
                }

                this.time.delayedCall(1500, () => {
                    this.cameras.main.fadeOut(500, 0, 0, 0);
                    this.time.delayedCall(600, () => {
                        this.scene.start('MainMenu');
                    });
                });
            }

            // ---- ЧАСТИЦЫ КРОВИ ----
            spawnBloodParticle(x, y, color, maxSpeed) {
                const size = Phaser.Math.Between(2, 6);
                const particle = this.add.circle(x, y, size,
                    Phaser.Display.Color.HexStringToColor(color).color,
                    0.9
                ).setDepth(1);

                const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
                const speed = Phaser.Math.Between(maxSpeed * 0.3, maxSpeed);
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                // Анимируем частицу
                this.tweens.add({
                    targets: particle,
                    x: x + vx * 0.5,
                    y: y + vy * 0.5,
                    alpha: 0,
                    scaleX: 0.3,
                    scaleY: 0.3,
                    duration: Phaser.Math.Between(200, 500),
                    ease: 'Power2',
                    onComplete: () => particle.destroy(),
                });
            }

            // ---- УДАР ИГРОКА ----
            performSlash() {
                if (this.slashCooldown > 0) return;
                const cooldownTime = GameState.currentWeapon === 'hammer' ? 600 : 250;
                this.slashCooldown = cooldownTime;

                const weapon = GameState.currentWeapon;
                const range = weapon === 'hammer' ? CONFIG.HAMMER_RANGE : CONFIG.SLASH_RANGE;
                const angle = weapon === 'hammer' ? CONFIG.HAMMER_ANGLE : CONFIG.SLASH_ANGLE;
                const damage = weapon === 'hammer' ? CONFIG.HAMMER_DAMAGE : CONFIG.SLASH_DAMAGE;
                const soundType = weapon === 'hammer' ? 'heavy' : 'slash';

                SFX.play(soundType, 0.5);

                // Прочность оружия
                if (weapon === 'hammer') {
                    GameState.weaponDurability.hammer--;
                    if (GameState.weaponDurability.hammer <= 0) {
                        // Кувалда сломалась, переключаем на катану
                        GameState.currentWeapon = 'katana';
                        GameState.weaponDurability.hammer = 0;
                        SFX.play('hit', 0.4);
                    }
                }

                // Визуализация удара — дуга
                const slashGfx = this.add.graphics().setDepth(5);
                const mouseAngle = Phaser.Math.Angle.Between(
                    this.player.x, this.player.y,
                    this.input.activePointer.worldX, this.input.activePointer.worldY
                );
                const halfAngle = Phaser.Math.DegToRad(angle / 2);
                const startAngle = mouseAngle - halfAngle;
                const endAngle = mouseAngle + halfAngle;
                const slashColor = weapon === 'hammer' ? 0xff8800 : 0x00ffff;

                slashGfx.lineStyle(4, slashColor, 0.8);
                slashGfx.beginPath();
                slashGfx.arc(this.player.x, this.player.y, range, startAngle, endAngle, false);
                slashGfx.strokePath();

                // Дополнительные линии для эффекта
                slashGfx.lineStyle(2, 0xffffff, 0.6);
                slashGfx.beginPath();
                slashGfx.arc(this.player.x, this.player.y, range * 0.8, startAngle + 0.1, endAngle - 0.1,
                false);
                slashGfx.strokePath();

                this.tweens.add({
                    targets: slashGfx,
                    alpha: 0,
                    scaleX: 1.3,
                    scaleY: 1.3,
                    duration: 200,
                    onComplete: () => slashGfx.destroy(),
                });

                // Проверка попадания по врагам
                for (const enemy of this.enemies) {
                    if (!enemy.active) continue;
                    const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, enemy.x,
                    enemy.y);
                    const angleToEnemy = Phaser.Math.Angle.Between(
                        this.player.x, this.player.y, enemy.x, enemy.y
                    );
                    let angleDiff = Math.abs(Phaser.Math.Angle.Wrap(angleToEnemy - mouseAngle));
                    if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                    if (dist <= range + 10 && angleDiff <= halfAngle + 0.1) {
                        const kbDir = { x: enemy.x - this.player.x, y: enemy.y - this.player.y };
                        this.damageEnemy(enemy, damage, kbDir);
                        // Замедление для кувалды
                        if (weapon === 'hammer') {
                            enemy.slowTimer = 500;
                            enemy.slowFactor = CONFIG.HAMMER_SLOW;
                        }
                    }
                }

                // Проверка попадания по бочкам
                for (const barrel of this.barrels) {
                    if (!barrel.active || barrel.isExploding) continue;
                    const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, barrel.x,
                    barrel.y);
                    const angleToBarrel = Phaser.Math.Angle.Between(
                        this.player.x, this.player.y, barrel.x, barrel.y
                    );
                    let angleDiff = Math.abs(Phaser.Math.Angle.Wrap(angleToBarrel - mouseAngle));
                    if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                    if (dist <= range + 10 && angleDiff <= halfAngle + 0.1) {
                        barrel.hp -= damage;
                        if (barrel.hp <= 0) {
                            this.explodeBarrel(barrel);
                        } else {
                            // Частицы при ударе по бочке
                            for (let i = 0; i < 5; i++) {
                                this.spawnBloodParticle(barrel.x, barrel.y, '#ffaa00', 80);
                            }
                        }
                    }
                }
            }

            // ---- РЫВОК (DASH) ----
            performDash() {
                if (this.dashCooldownTimer > 0 || this.isDashing) return;

                this.isDashing = true;
                this.dashTimer = CONFIG.DASH_DURATION;
                this.dashCooldownTimer = CONFIG.DASH_COOLDOWN;
                this.player.isInvincible = true;

                SFX.play('dash', 0.5);

                // Направление рывка — в сторону движения или к мыши если нет движения
                let dx = 0,
                    dy = 0;
                if (this.cursors.w.isDown) dy = -1;
                if (this.cursors.s.isDown) dy = 1;
                if (this.cursors.a.isDown) dx = -1;
                if (this.cursors.d.isDown) dx = 1;

                if (dx === 0 && dy === 0) {
                    // Рывок к мыши
                    const angle = Phaser.Math.Angle.Between(
                        this.player.x, this.player.y,
                        this.input.activePointer.worldX, this.input.activePointer.worldY
                    );
                    dx = Math.cos(angle);
                    dy = Math.sin(angle);
                }

                const len = Math.sqrt(dx * dx + dy * dy) || 1;
                this.player.body.setVelocity(
                    (dx / len) * CONFIG.DASH_SPEED,
                    (dy / len) * CONFIG.DASH_SPEED
                );

                // Эффект рывка — остаточные изображения
                for (let i = 1; i <= 3; i++) {
                    const afterimage = this.add.rectangle(
                        this.player.x, this.player.y,
                        24, 32, 0x00ffff, 0.3 - i * 0.08
                    ).setDepth(3);
                    this.tweens.add({
                        targets: afterimage,
                        alpha: 0,
                        scaleX: 0.5,
                        scaleY: 0.5,
                        duration: 200,
                        delay: i * 40,
                        onComplete: () => afterimage.destroy(),
                    });
                }

                // Завершение рывка
                this.time.delayedCall(CONFIG.DASH_DURATION, () => {
                    this.isDashing = false;
                    this.player.body.setVelocity(0, 0);
                });

                // Бессмертие после рывка
                this.time.delayedCall(CONFIG.DASH_INVINCIBILITY, () => {
                    if (!this.isDashing) {
                        this.player.isInvincible = false;
                    }
                });
            }

            // ---- ОСНОВНОЙ ЦИКЛ ОБНОВЛЕНИЯ ----
            update(time, delta) {
                // Hit Stop — заморозка игры
                if (this.hitStopTimer > 0) {
                    this.hitStopTimer -= delta;
                    if (this.hitStopTimer <= 0) {
                        this.hitStopTimer = 0;
                    }
                    return; // Пропускаем кадр
                }

                if (this.player.hp <= 0 || this.arenaComplete) {
                    // Игрок мёртв или арена завершена — только обновляем HUD
                    this.updateHUD();
                    return;
                }

                // Кулдаун оружия
                if (this.slashCooldown > 0) this.slashCooldown -= delta;

                // Кулдаун рывка
                if (this.dashCooldownTimer > 0) this.dashCooldownTimer -= delta;
                if (this.isDashing) {
                    this.dashTimer -= delta;
                    if (this.dashTimer <= 0) {
                        this.isDashing = false;
                        this.player.body.setVelocity(0, 0);
                    }
                }

                // Таймер комбо
                if (GameState.comboTimer > 0) {
                    GameState.comboTimer -= delta;
                    if (GameState.comboTimer <= 0) {
                        GameState.combo = 0;
                    }
                }

                // --- ВВОД ---
                // Движение
                let moveX = 0,
                    moveY = 0;
                if (!this.isDashing) {
                    if (this.cursors.w.isDown) moveY = -1;
                    if (this.cursors.s.isDown) moveY = 1;
                    if (this.cursors.a.isDown) moveX = -1;
                    if (this.cursors.d.isDown) moveX = 1;

                    const len = Math.sqrt(moveX * moveX + moveY * moveY) || 1;
                    this.player.body.setVelocity(
                        (moveX / len) * CONFIG.PLAYER_SPEED,
                        (moveY / len) * CONFIG.PLAYER_SPEED
                    );
                }

                // Рывок
                if (Phaser.Input.Keyboard.JustDown(this.cursors.space)) {
                    this.performDash();
                }

                // Удар (ЛКМ)
                if (this.input.activePointer.isDown && this.slashCooldown <= 0) {
                    this.performSlash();
                }

                // Смена оружия
                if (Phaser.Input.Keyboard.JustDown(this.cursors.one)) {
                    GameState.currentWeapon = 'katana';
                    SFX.play('select', 0.1);
                }
                if (Phaser.Input.Keyboard.JustDown(this.cursors.two) && GameState.weaponDurability.hammer >
                    0) {
                    GameState.currentWeapon = 'hammer';
                    SFX.play('select', 0.1);
                }

                // Поворот игрока к мыши
                const mouseAngle = Phaser.Math.Angle.Between(
                    this.player.x, this.player.y,
                    this.input.activePointer.worldX, this.input.activePointer.worldY
                );
                this.player.setRotation(mouseAngle + Math.PI / 2);
                // Глаза следуют за мышью
                if (this.playerEyes) {
                    this.playerEyes.setPosition(this.player.x, this.player.y);
                    this.playerEyes.setRotation(mouseAngle + Math.PI / 2);
                }

                // --- ОБНОВЛЕНИЕ ВРАГОВ (ИИ) ---
                for (const enemy of this.enemies) {
                    if (!enemy.active) continue;
                    this.updateEnemyAI(enemy, time, delta);
                    // Визуальные эффекты врага
                    this.updateEnemyVisuals(enemy, delta);
                }

                // --- ОБНОВЛЕНИЕ ПРОЖЕКТИЛОВ ---
                this.updateProjectiles(delta);

                // --- ПРОВЕРКА КОЛЛИЗИЙ С ИГРОКОМ ---
                this.checkPlayerEnemyCollisions();

                // --- ОБНОВЛЕНИЕ HUD ---
                this.updateHUD();

                // --- СОХРАНЕНИЕ HP В ГЛОБАЛЬНОМ СОСТОЯНИИ ---
                GameState.playerHP = this.player.hp;
            }

            // ============================================
            // ИИ ВРАГОВ: СИСТЕМА СОСТОЯНИЙ (Chase, Attack, Stun)
            // ============================================
            updateEnemyAI(enemy, time, delta) {
                const playerX = this.player.x;
                const playerY = this.player.y;
                const distToPlayer = Phaser.Math.Distance.Between(enemy.x, enemy.y, playerX, playerY);
                const angleToPlayer = Phaser.Math.Angle.Between(enemy.x, enemy.y, playerX, playerY);

                // Обновление таймеров
                if (enemy.stunTimer > 0) enemy.stunTimer -= delta;
                if (enemy.attackCooldown > 0) enemy.attackCooldown -= delta;
                if (enemy.flashTimer > 0) enemy.flashTimer -= delta;
                if (enemy.fireTimer > 0) enemy.fireTimer -= delta;

                // Если стан истёк — возвращаемся в преследование
                if (enemy.aiState === 'stun' && enemy.stunTimer <= 0) {
                    enemy.aiState = 'chase';
                    enemy.body.setVelocity(0, 0);
                }

                // Если стан — враг не действует
                if (enemy.aiState === 'stun') {
                    // Замедление от кувалды
                    if (enemy.slowTimer > 0) {
                        enemy.slowTimer -= delta;
                        enemy.body.setVelocity(
                            enemy.body.velocity.x * 0.9,
                            enemy.body.velocity.y * 0.9
                        );
                    }
                    return;
                }

                // Применяем замедление если есть
                let speedMult = 1;
                if (enemy.slowTimer > 0) {
                    enemy.slowTimer -= delta;
                    speedMult = enemy.slowFactor || CONFIG.HAMMER_SLOW;
                }

                switch (enemy.enemyType) {
                    case 'zombie':
                        // Зомби: всегда преследует игрока на полной скорости
                        enemy.aiState = 'chase';
                        const zSpeed = enemy.speed * speedMult;
                        this.physics.moveToObject(enemy, this.player, zSpeed);
                        break;

                    case 'shooter':
                        // Стрелок: держит дистанцию, стреляет издалека
                        if (distToPlayer < enemy.preferredDist * 0.7) {
                            // Слишком близко — отбегает
                            enemy.aiState = 'chase';
                            const fleeAngle = angleToPlayer + Math.PI; // Противоположное направление
                            enemy.body.setVelocity(
                                Math.cos(fleeAngle) * enemy.speed * speedMult,
                                Math.sin(fleeAngle) * enemy.speed * speedMult
                            );
                        } else if (distToPlayer > enemy.preferredDist * 1.3) {
                            // Слишком далеко — приближается
                            enemy.aiState = 'chase';
                            this.physics.moveToObject(enemy, this.player, enemy.speed * speedMult);
                        } else {
                            // Оптимальная дистанция — атакует
                            enemy.aiState = 'attack';
                            enemy.body.setVelocity(0, 0);
                            // Поворот к игроку
                            enemy.setRotation(angleToPlayer + Math.PI / 2);
                            if (enemy.eyesGfx) {
                                enemy.eyesGfx.setPosition(enemy.x, enemy.y);
                                enemy.eyesGfx.setRotation(angleToPlayer + Math.PI / 2);
                            }
                            // Стрельба по таймеру
                            if (enemy.fireTimer <= 0) {
                                this.enemyShoot(enemy, angleToPlayer);
                                enemy.fireTimer = CONFIG.SHOOTER_FIRE_RATE + Phaser.Math.Between(-200,
                                200);
                            }
                        }
                        break;

                    case 'boss':
                        // Босс: чередует преследование и рывок
                        enemy.chargeTimer -= delta;
                        if (enemy.chargeTimer <= 0 && distToPlayer < 350) {
                            // Рывок на игрока
                            enemy.aiState = 'attack';
                            enemy.chargeTimer = 2000;
                            enemy.chargeDirection = { x: Math.cos(angleToPlayer), y: Math.sin(angleToPlayer) };
                            enemy.body.setVelocity(
                                enemy.chargeDirection.x * CONFIG.BOSS_CHARGE_SPEED,
                                enemy.chargeDirection.y * CONFIG.BOSS_CHARGE_SPEED
                            );
                            // Эффект рывка
                            const chargeFx = this.add.circle(enemy.x, enemy.y, 20, 0xff4400, 0.4)
                                .setDepth(4);
                            this.tweens.add({
                                targets: chargeFx,
                                alpha: 0,
                                scaleX: 2,
                                scaleY: 2,
                                duration: 500,
                                onComplete: () => chargeFx.destroy(),
                            });
                        } else if (enemy.chargeTimer > 1500) {
                            // Продолжает рывок
                            enemy.aiState = 'attack';
                        } else {
                            // Преследование
                            enemy.aiState = 'chase';
                            this.physics.moveToObject(enemy, this.player, enemy.speed * speedMult);
                        }
                        // Поворот
                        enemy.setRotation(angleToPlayer + Math.PI / 2);
                        if (enemy.eyesGfx) {
                            enemy.eyesGfx.setPosition(enemy.x, enemy.y);
                            enemy.eyesGfx.setRotation(angleToPlayer + Math.PI / 2);
                        }
                        break;
                }

                // Все враги поворачиваются лицом к игроку
                if (enemy.enemyType !== 'shooter' || enemy.aiState === 'attack') {
                    enemy.setRotation(angleToPlayer + Math.PI / 2);
                    if (enemy.eyesGfx) {
                        enemy.eyesGfx.setPosition(enemy.x, enemy.y);
                        enemy.eyesGfx.setRotation(angleToPlayer + Math.PI / 2);
                    }
                }
            }

            // Визуальные эффекты врага (вспышка при уроне)
            updateEnemyVisuals(enemy, delta) {
                if (enemy.flashTimer > 0) {
                    enemy.setFillStyle(0xffffff);
                } else {
                    const colorMap = {
                        zombie: 0x44cc44,
                        shooter: 0xcc8844,
                        boss: 0xcc2222,
                    };
                    enemy.setFillStyle(colorMap[enemy.enemyType] || 0x888888);
                }
                // Мигание при низком HP
                if (enemy.hp < enemy.maxHp * 0.3 && enemy.flashTimer <= 0) {
                    enemy.setAlpha(0.6 + Math.sin(this.time.now / 80) * 0.4);
                } else if (enemy.flashTimer <= 0) {
                    enemy.setAlpha(1);
                }
            }

            // Стрельба врага
            enemyShoot(enemy, angle) {
                SFX.play('shoot', 0.2);
                const bullet = this.add.circle(enemy.x, enemy.y, 4, 0xffff00)
                    .setStrokeStyle(1, 0xff8800).setDepth(6);
                this.physics.add.existing(bullet);
                bullet.body.setCircle(4);
                bullet.body.setVelocity(
                    Math.cos(angle) * 300,
                    Math.sin(angle) * 300
                );
                bullet.damage = enemy.damage;
                bullet.lifespan = 2000;
                bullet.owner = 'enemy';
                this.projectiles.push(bullet);

                // Дульный闪光
                const muzzle = this.add.circle(
                    enemy.x + Math.cos(angle) * 15,
                    enemy.y + Math.sin(angle) * 15,
                    8, 0xffff00, 0.7
                ).setDepth(7);
                this.tweens.add({
                    targets: muzzle,
                    alpha: 0,
                    scaleX: 2,
                    scaleY: 2,
                    duration: 100,
                    onComplete: () => muzzle.destroy(),
                });
            }

            // Обновление прожектилов
            updateProjectiles(delta) {
                for (let i = this.projectiles.length - 1; i >= 0; i--) {
                    const bullet = this.projectiles[i];
                    if (!bullet.active) {
                        this.projectiles.splice(i, 1);
                        continue;
                    }
                    bullet.lifespan -= delta;
                    if (bullet.lifespan <= 0) {
                        bullet.destroy();
                        this.projectiles.splice(i, 1);
                        continue;
                    }
                    // Попадание в игрока
                    if (bullet.owner === 'enemy') {
                        const dist = Phaser.Math.Distance.Between(bullet.x, bullet.y, this.player.x, this.player
                            .y);
                        if (dist < 16 && !this.player.isInvincible) {
                            this.damagePlayer(bullet.damage);
                            bullet.destroy();
                            this.projectiles.splice(i, 1);
                            // Искры при попадании
                            for (let j = 0; j < 4; j++) {
                                this.spawnBloodParticle(bullet.x, bullet.y, '#ffff00', 100);
                            }
                        }
                    }
                    // Попадание в бочки
                    for (const barrel of this.barrels) {
                        if (!barrel.active || barrel.isExploding) continue;
                        const dist = Phaser.Math.Distance.Between(bullet.x, bullet.y, barrel.x, barrel
                        .y);
                        if (dist < 18) {
                            barrel.hp -= bullet.damage;
                            if (barrel.hp <= 0) this.explodeBarrel(barrel);
                            bullet.destroy();
                            this.projectiles.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            // Проверка коллизий игрока с врагами
            checkPlayerEnemyCollisions() {
                if (this.player.isInvincible || this.player.hp <= 0) return;
                for (const enemy of this.enemies) {
                    if (!enemy.active) continue;
                    const dist = Phaser.Math.Distance.Between(
                        this.player.x, this.player.y, enemy.x, enemy.y
                    );
                    if (dist < 28) {
                        this.damagePlayer(enemy.damage);
                        // Отбрасывание игрока
                        const angle = Phaser.Math.Angle.Between(enemy.x, enemy.y, this.player.x, this.player
                        .y);
                        this.player.body.setVelocity(Math.cos(angle) * 250, Math.sin(angle) * 250);
                        break;
                    }
                }
            }
        }

        // ====================================
        // КОНФИГУРАЦИЯ PHASER
        // ====================================
        const phaserConfig = {
            type: Phaser.AUTO,
            width: CONFIG.WIDTH,
            height: CONFIG.HEIGHT,
            parent: 'game-container',
            backgroundColor: '#000000',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false,
                },
            },
            scene: [MainMenuScene, ArenaScene],
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
            },
            render: {
                pixelArt: false,
                antialias: true,
            },
        };

        // ====================================
        // ЗАПУСК ИГРЫ
        // ====================================
        window.addEventListener('load', () => {
            const game = new Phaser.Game(phaserConfig);

            // Разблокировка Web Audio после первого клика
            const unlockAudio = () => {
                if (SFX.ctx && SFX.ctx.state === 'suspended') {
                    SFX.ctx.resume();
                }
                document.removeEventListener('click', unlockAudio);
                document.removeEventListener('keydown', unlockAudio);
            };
            document.addEventListener('click', unlockAudio);
            document.addEventListener('keydown', unlockAudio);
        });
    </script>
</body>
</html>
